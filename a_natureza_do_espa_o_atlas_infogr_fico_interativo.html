<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Natureza do Espaço — Atlas Infográfico Interativo | Milton Santos</title>

  <!-- Fontes opcionais Google Fonts com fallback editorial elegante -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,700;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       TOKENS DE DESIGN — PALETA DA CAPA EDUSP / COLEÇÃO MILTON SANTOS
       ========================================================================= */
    :root {
      --bg-paper: #F6F3EB;
      --bg-surface: #FFFFFF;
      --border-soft: #E2DDD0;
      --border-strong: #CCC5B3;

      --teal: #1A4A4F;
      --teal-dark: #123539;
      --teal-soft: #E6F0F0;

      --terracotta: #B85D3B;
      --terracotta-soft: #FDF1EC;

      --amber: #C68B2C;
      --amber-soft: #FBF4E4;

      --olive: #3F6A4E;
      --olive-soft: #EAF2EC;

      --text-main: #1D2322;
      --text-muted: #4F5957;

      --font-serif: 'Newsreader', Georgia, Cambria, 'Times New Roman', serif;
      --font-sans: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

      --sidebar-w: 290px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 8px rgba(26, 74, 79, 0.05);
      --shadow-md: 0 8px 24px rgba(29, 35, 34, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(rgba(26, 74, 79, 0.045) 1px, transparent 0);
      background-size: 24px 24px;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================================
       LAYOUT PRINCIPAL & BARRA LATERAL
       ========================================================================= */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Cabeçalho Mobile */
    .mobile-topbar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(246, 243, 235, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-soft);
      padding: 12px 16px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-soft);
      background: var(--bg-surface);
      color: var(--teal);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.18s ease, border-color 0.18s ease;
    }
    .icon-btn:hover {
      background: var(--teal-soft);
      border-color: var(--teal);
    }

    .mobile-brand {
      text-align: center;
      flex: 1;
      min-width: 0;
    }
    .mobile-brand strong {
      display: block;
      font-family: var(--font-serif);
      font-size: 1rem;
      color: var(--teal);
      line-height: 1.15;
    }
    .mobile-brand span {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--terracotta);
    }

    .progress-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--teal-soft);
      color: var(--teal);
      border: 1px solid rgba(26, 74, 79, 0.2);
      white-space: nowrap;
    }

    /* Sidebar fixa desktop / Drawer mobile */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--bg-surface);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: transform 0.24s ease;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(29, 35, 34, 0.45);
      z-index: 45;
    }
    .sidebar-overlay.open {
      display: block;
    }

    .sidebar-header {
      padding: 20px 18px 16px;
      background: linear-gradient(155deg, var(--teal) 0%, var(--teal-dark) 100%);
      color: #F6F3EB;
      position: relative;
    }

    .sidebar-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #FBF4E4;
      background: rgba(198, 139, 44, 0.28);
      border: 1px solid rgba(251, 244, 228, 0.25);
      padding: 2px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .sidebar-title {
      font-family: var(--font-serif);
      font-size: 1.32rem;
      font-weight: 700;
      line-height: 1.15;
      color: #FFFFFF;
    }

    .sidebar-subtitle {
      font-size: 0.76rem;
      color: rgba(246, 243, 235, 0.85);
      margin-top: 3px;
    }

    .sidebar-author {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: #F4D59A;
      margin-top: 6px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .close-drawer-btn {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.1);
      color: #FFFFFF;
      align-items: center;
      justify-content: center;
    }

    /* Mini barra de progresso */
    .study-progress-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }
    .study-progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      margin-bottom: 6px;
      color: rgba(246, 243, 235, 0.9);
    }
    .study-progress-meta span:last-child {
      font-family: var(--font-mono);
      font-weight: 600;
      color: #F4D59A;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--amber), #E8B85B);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Busca instantânea */
    .search-box {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-soft);
      background: #FAF8F3;
    }
    .search-wrap {
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 9px 32px 9px 34px;
      font-size: 0.8rem;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-surface);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    .search-input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(26, 74, 79, 0.12);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.9rem;
      padding: 2px 6px;
      display: none;
    }
    .search-clear.visible {
      display: block;
    }

    /* Navegação da Sidebar */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 20px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: var(--text-main);
      transition: all 0.16s ease;
      margin-bottom: 3px;
    }
    .nav-item:hover {
      background: var(--bg-paper);
      border-color: var(--border-soft);
    }
    .nav-item.active {
      background: var(--teal-soft);
      border-color: rgba(26, 74, 79, 0.35);
    }

    .nav-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-paper);
      color: var(--text-muted);
      border: 1px solid var(--border-soft);
      margin-top: 1px;
    }
    .nav-item.active .nav-num {
      background: var(--teal);
      color: #FFFFFF;
      border-color: var(--teal);
    }

    .nav-label {
      flex: 1;
      min-width: 0;
    }
    .nav-label-title {
      display: block;
      font-size: 0.79rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-main);
    }
    .nav-item.active .nav-label-title {
      color: var(--teal-dark);
    }
    .nav-label-sub {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .nav-check {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: transparent;
      margin-top: 3px;
      transition: all 0.16s ease;
    }
    .nav-check.done {
      background: var(--olive);
      border-color: var(--olive);
      color: #FFFFFF;
    }

    .part-group {
      margin-top: 14px;
    }
    .part-group-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px 6px;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .part-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border-soft);
      background: #FAF8F3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .reset-btn {
      background: transparent;
      border: none;
      color: var(--terracotta);
      font-weight: 600;
      font-size: 0.7rem;
      text-decoration: underline;
    }

    /* =========================================================================
       ÁREA PRINCIPAL DE CONTEÚDO
       ========================================================================= */
    .main-area {
      flex: 1;
      min-width: 0;
      padding: 32px 40px 64px;
    }

    .content-container {
      max-width: 980px;
      margin: 0 auto;
      animation: fadeUp 0.28s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cabeçalho de Capítulo */
    .chapter-header {
      margin-bottom: 24px;
    }
    .chapter-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .part-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      border-radius: 999px;
      color: #FFFFFF;
    }

    .study-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: var(--bg-surface);
      color: var(--text-main);
      transition: all 0.18s ease;
    }
    .study-toggle-btn:hover {
      border-color: var(--olive);
      color: var(--olive);
    }
    .study-toggle-btn.studied {
      background: var(--olive);
      border-color: var(--olive);
      color: #FFFFFF;
    }

    .chapter-title {
      font-family: var(--font-serif);
      font-size: clamp(1.75rem, 3vw, 2.45rem);
      font-weight: 700;
      line-height: 1.15;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }
    .chapter-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 8px;
      max-width: 780px;
    }

    .editorial-divider {
      height: 4px;
      width: 100%;
      margin: 20px 0 24px;
      border-radius: 4px;
      background: repeating-linear-gradient(
        -45deg,
        rgba(26, 74, 79, 0.14),
        rgba(26, 74, 79, 0.14) 3px,
        transparent 3px,
        transparent 7px
      );
    }

    /* Cards Base */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 24px 26px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .thesis-card {
      border-left: 5px solid var(--teal);
    }
    .section-kicker {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--teal);
      margin-bottom: 6px;
      display: block;
    }
    .section-heading {
      font-family: var(--font-serif);
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .thesis-text {
      font-size: 0.96rem;
      color: var(--text-main);
      line-height: 1.68;
    }

    /* Infográfico Container */
    .infographic-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }
    .infographic-header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .infographic-lead {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
      max-width: 720px;
    }

    /* Controles Interativos Comuns */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }
    .ctrl-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-paper);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.16s ease;
    }
    .ctrl-btn:hover {
      border-color: var(--teal);
      background: var(--teal-soft);
    }
    .ctrl-btn.active {
      background: var(--teal);
      color: #FFFFFF;
      border-color: var(--teal);
      box-shadow: 0 2px 8px rgba(26, 74, 79, 0.22);
    }
    .ctrl-btn.active-terracotta {
      background: var(--terracotta);
      color: #FFFFFF;
      border-color: var(--terracotta);
    }
    .ctrl-btn.active-amber {
      background: var(--amber);
      color: #FFFFFF;
      border-color: var(--amber);
    }
    .ctrl-btn.active-olive {
      background: var(--olive);
      color: #FFFFFF;
      border-color: var(--olive);
    }

    .panel-soft {
      background: #FAF8F3;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 18px;
    }

    /* Sliders */
    input[type="range"].atlas-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 7px;
      background: var(--border-soft);
      border-radius: 999px;
      outline: none;
    }
    input[type="range"].atlas-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--teal);
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(26, 74, 79, 0.35);
      cursor: pointer;
    }
    input[type="range"].atlas-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--teal);
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(26, 74, 79, 0.35);
      cursor: pointer;
    }

    /* Grids utilitários */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    /* Conceitos-chave */
    .concepts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .concept-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.16s ease, border-color 0.16s ease;
    }
    .concept-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
    }
    .concept-tag {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--terracotta);
      margin-bottom: 5px;
      display: block;
    }
    .concept-card h4 {
      font-family: var(--font-serif);
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--teal-dark);
      margin-bottom: 6px;
      line-height: 1.25;
    }
    .concept-card p {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* Blockquote Editorial */
    .editorial-quote {
      margin: 26px 0;
      background: var(--teal-soft);
      border-left: 4px solid var(--teal);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 20px 24px;
    }
    .editorial-quote p {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.12rem;
      color: var(--teal-dark);
      line-height: 1.55;
    }
    .editorial-quote footer {
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    /* Navegação Inferior */
    .chapter-footer-nav {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      justify-content: space-between;
      align-items: stretch;
      gap: 14px;
      flex-wrap: wrap;
    }
    .nav-step-btn {
      flex: 1;
      min-width: 220px;
      max-width: 380px;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-soft);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.18s ease;
      text-align: left;
    }
    .nav-step-btn:hover {
      border-color: var(--teal);
      background: var(--teal-soft);
    }
    .nav-step-btn.next {
      margin-left: auto;
      justify-content: flex-end;
      text-align: right;
      background: var(--teal);
      border-color: var(--teal);
      color: #FFFFFF;
    }
    .nav-step-btn.next:hover {
      background: var(--teal-dark);
    }
    .nav-step-meta {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.72;
      display: block;
    }
    .nav-step-title {
      font-size: 0.86rem;
      font-weight: 600;
      display: block;
      margin-top: 2px;
    }

    /* Barras de Medição Visual */
    .meter-row {
      margin-bottom: 12px;
    }
    .meter-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .meter-head span:last-child {
      font-family: var(--font-mono);
    }
    .meter-track {
      width: 100%;
      height: 10px;
      background: var(--bg-paper);
      border: 1px solid var(--border-soft);
      border-radius: 999px;

    /* =========================================================================

    function loadStudied() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveStudied() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(studied));
      } catch (e) { /* ambiente sem localStorage */ }
    }

    let toastTimer = null;
    function showToast(message) {
      const el = document.getElementById('toast');
      const msg = document.getElementById('toast-msg');
      if (!el || !msg) return;
      msg.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function normalizeText(str) {
      return String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function toggleChapterStudied(chId, evt) {
      if (evt) evt.stopPropagation();
      studied[chId] = !studied[chId];
      saveStudied();
      renderSidebar();
      renderMain();
      showToast(studied[chId] ? `Capítulo ${chId} marcado como estudado.` : `Capítulo ${chId} desmarcado.`);
    }

    function resetProgress() {
      studied = {};
      saveStudied();
      renderSidebar();
      renderMain();
      showToast('Progresso de estudo reiniciado.');
    }

    function navigateTo(view) {
      currentView = view;
      renderSidebar();
      renderMain();
      closeDrawer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openDrawer() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebar-overlay').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('open');
    }

    function renderSidebar() {
      const nav = document.getElementById('sidebar-nav');
      const q = normalizeText(searchTerm.trim());

      // Atualizar barra de progresso
      const doneCount = CHAPTERS.filter(c => studied[c.id]).length;
      const pct = Math.round((doneCount / CHAPTERS.length) * 100);
      document.getElementById('sidebar-progress-label').textContent = `${doneCount} / ${CHAPTERS.length} (${pct}%)`;
      document.getElementById('sidebar-progress-fill').style.width = `${pct}%`;
      document.getElementById('mobile-progress-pill').textContent = `${doneCount}/${CHAPTERS.length}`;

      let html = '';

      // Item Mapa Geral
      const showOverview = !q || normalizeText('mapa geral prefacio introducao categorias ontologia').includes(q);
      if (showOverview) {
        html += `
          <button type="button" class="nav-item ${currentView === 'overview' ? 'active' : ''}" onclick="navigateTo('overview')">
            <span class="nav-num">§0</span>
            <span class="nav-label">
              <span class="nav-label-title">Mapa Geral da Obra</span>
              <span class="nav-label-sub">Prefácio, Introdução &amp; Arquitetura</span>
            </span>
          </button>
        `;
      }

      // Agrupamento pelas 4 Partes Oficiais
      let totalMatches = showOverview ? 1 : 0;

      Object.values(PARTS).forEach(part => {
        const partChapters = CHAPTERS.filter(ch => {
          if (ch.part !== part.id) return false;
          if (!q) return true;
          const hay = normalizeText(`${ch.id} ${ch.title} ${ch.subtitle} ${ch.keywords.join(' ')}`);
          return hay.includes(q);
        });

        if (partChapters.length === 0) return;
        totalMatches += partChapters.length;

        html += `
          <div class="part-group">
            <div class="part-group-header">
              <span class="part-dot" style="background:${part.color}"></span>
              <span>${part.roman} — ${part.title}</span>
            </div>
        `;

        partChapters.forEach(ch => {
          const isActive = currentView === ch.id;
          const isDone = !!studied[ch.id];
          html += `
            <button type="button" class="nav-item ${isActive ? 'active' : ''}" onclick="navigateTo(${ch.id})">
              <span class="nav-num" style="${isActive ? `background:${part.color};border-color:${part.color};color:#fff;` : `border-left:3px solid ${part.color};`}">${ch.id}</span>
              <span class="nav-label">
                <span class="nav-label-title">${ch.title}</span>
              </span>
              <span class="nav-check ${isDone ? 'done' : ''}" title="${isDone ? 'Estudado' : 'Marcar como estudado'}" onclick="toggleChapterStudied(${ch.id}, event)">✓</span>
            </button>
          `;
        });

        html += `</div>`;
      });

      if (totalMatches === 0) {
        html = `<div style="padding:16px;font-size:0.8rem;color:var(--text-muted);text-align:center;">Nenhum capítulo ou conceito encontrado para "<strong>${searchTerm}</strong>".</div>`;
      }

      nav.innerHTML = html;
    }

          <p style="font-size:0.84rem;color:var(--text-main);">
            ${mode === 'vertical'
              ? '<strong>Verticalidades:</strong> Articulam pontos distantes segundo racionalidades hegemônicas e normas rígidas. Geram solidariedade organizacional, mas trazem desordem (entropia) às coesões locais.'
              : mode === 'horizontal'
              ? '<strong>Horizontalidades:</strong> Espaços da contiguidade e da vida cotidiana. Podem transformar interesses comuns e o "cotidiano homólogo" em força política coletiva.'
              : '<strong>Sobreposição Dialética:</strong> O espaço geográfico reúne ambos os recortes inseparavelmente. As cidades são o palco onde forças centrífugas (verticais) perturbam e obrigam a refazer as solidariedades centrípetas (horizontais).'}
          </p>
        </div>
      `;
    }

    /* --- CAPÍTULO 13: Mapa Esquemático Espaços Luminosos vs. Opacos --- */
    function renderInfoCap13() {
      const zones = {
        luminoso: {
          title: 'Espaço Luminoso (Racionalidade Hegemônica)',
          tech: 96, info: 95, norm: 94, color: '#C68B2C',
          desc: 'Fração do território densamente equipada com ciência, tecnologia e informação (centros financeiros, tecnopolos, agroindústria de ponta). Atrai investimentos públicos e atores hegemônicos; funciona como máquina de precisão ("campo e cronômetro").'
        },
        transicao: {
          title: 'Zona de Transição / Contágio Racional',
          tech: 58, info: 52, norm: 60, color: '#1A4A4F',
          desc: 'Áreas onde objetos técnicos modernos convivem com rugosidades e serviços tradicionais. Forte conflito entre o ritmo dos relógios corporativos e a diversidade socioespacial herdada.'
        },
        opaco: {
          title: 'Espaço Opaco (Contra-Racionalidades)',
          tech: 22, info: 25, norm: 28, color: '#3F6A4E',
          desc: 'Áreas menos modernas, consideradas "irracionais" para usos hegemônicos. Abrigam pobres, migrantes e atividades marginais que, a partir da experiência da escassez, constroem racionalidades paralelas e criativas.'
        }
      };
      const z = zones[uiState.c13Zone];

      return `
        <div class="infographic-header">
          <div>
            <span class="section-kicker">Infográfico Exclusivo • Cap. 13</span>
            <h3 class="section-heading">Espaços Luminosos vs. Espaços Opacos</h3>
            <p class="infographic-lead">Clique nas zonas do mapa esquemático para inspecionar as densidades técnica, informacional e normativa e compreender a emergência das <strong>contra-racionalidades</strong>.</p>
          </div>
        </div>

        <div class="grid-2" style="align-items:center;">
          <div class="svg-stage">
            <svg viewBox="0 0 380 230" role="img" aria-label="Mapa esquemático de espaços luminosos e opacos">
              <!-- Fundo opaco -->
              <rect x="12" y="12" width="356" height="206" rx="14"
                fill="${uiState.c13Zone==='opaco' ? '#3F6A4E' : '#DCE7DF'}"
                stroke="#3F6A4E" stroke-width="2"
                onclick="uiState.c13Zone='opaco'; renderMain();" style="cursor:pointer;"/>
              <text x="28" y="36" font-family="JetBrains Mono, monospace" font-size="10.5" font-weight="700"
                fill="${uiState.c13Zone==='opaco' ? '#FFFFFF' : '#284A34'}">ESPAÇOS OPACOS (Contra-racionalidades)</text>

              <!-- Zona de transição -->
              <ellipse cx="190" cy="122" rx="125" ry="74"
                fill="${uiState.c13Zone==='transicao' ? '#1A4A4F' : '#E6F0F0'}"
                stroke="#1A4A4F" stroke-width="2" stroke-dasharray="5 3"
                onclick="uiState.c13Zone='transicao'; renderMain();" style="cursor:pointer;"/>
              <text x="190" y="70" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700"
                fill="${uiState.c13Zone==='transicao' ? '#FFFFFF' : '#1A4A4F'}">ZONA DE TRANSIÇÃO</text>

              <!-- Núcleo luminoso -->
              <circle cx="190" cy="128" r="46"
                fill="${uiState.c13Zone==='luminoso' ? '#C68B2C' : '#FBF4E4'}"
                stroke="#C68B2C" stroke-width="2.5"
                onclick="uiState.c13Zone='luminoso'; renderMain();" style="cursor:pointer;"/>
              <text x="190" y="124" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700"
                fill="${uiState.c13Zone==='luminoso' ? '#FFFFFF' : '#875B14'}">ESPAÇO</text>
              <text x="190" y="139" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700"
                fill="${uiState.c13Zone==='luminoso' ? '#FFFFFF' : '#875B14'}">LUMINOSO</text>
            </svg>
          </div>

          <div class="panel-soft" style="border-left:4px solid ${z.color};">
            <h4 style="font-family:var(--font-serif);font-size:1.1rem;color:${z.color};margin-bottom:8px;">${z.title}</h4>
            <p style="font-size:0.83rem;color:var(--text-main);margin-bottom:14px;">${z.desc}</p>
            <div class="meter-row">
              <div class="meter-head"><span>Densidade Técnica</span><span>${z.tech}%</span></div>
              <div class="meter-track"><div class="meter-fill" style="width:${z.tech}%;background:var(--teal);"></div></div>
            </div>
            <div class="meter-row">
              <div class="meter-head"><span>Densidade Informacional</span><span>${z.info}%</span></div>
              <div class="meter-track"><div class="meter-fill" style="width:${z.info}%;background:var(--amber);"></div></div>
            </div>
            <div class="meter-row" style="margin-bottom:0;">
              <div class="meter-head"><span>Rigidez Normativa</span><span>${z.norm}%</span></div>
              <div class="meter-track"><div class="meter-fill" style="width:${z.norm}%;background:var(--terracotta);"></div></div>
            </div>
          </div>
        </div>
      `;
    }

    /* --- CAPÍTULO 14: Homens Lentos & Migrante: Da Memória à Descoberta --- */
    function renderInfoCap14() {
      const isLento = uiState.c14Profile === 'lento';
      const migrantSteps = [
        {
          step: '1. Memória & Estranhamento',
          desc: 'Ao chegar à cidade grande, o migrante traz uma memória construída em outro lugar. Diante de um espaço que não ajudou a criar, sua memória revela-se inútil para a luta cotidiana (choque e alienação inicial).'
        },
        {
          step: '2. Reaprendizado do Entorno',
          desc: 'Obrigados a esquecer rotinas antigas, os migrantes não usam passivamente o prático-inerte herdado. O novo meio ambiente atua como detonador intelectual de uma "terceira via" de entendimento da cidade.'
        },
        {
          step: '3. Descoberta & Futuro',
          desc: 'Enquanto a memória olha para o passado, a nova consciência olha para o futuro. A "consciência pelo lugar" supera a "consciência no lugar", alimentando uma práxis inventiva e libertadora.'
        }
      ];
      const ms = migrantSteps[uiState.c14MigrantStep];

      return `
        <div class="infographic-header">
          <div>
            <span class="section-kicker">Infográfico Exclusivo • Cap. 14</span>
            <h3 class="section-heading">Os Homens Lentos &amp; A Jornada do Migrante</h3>
            <p class="infographic-lead">Contraste o uso do espaço urbano pelos "homens rápidos" e pelos "homens lentos", e percorra a transformação do migrante <strong>da memória à descoberta</strong>.</p>
          </div>
        </div>

        <div class="btn-group">
          <button type="button" class="ctrl-btn ${!isLento ? 'active' : ''}" onclick="uiState.c14Profile='rapido'; renderMain();">Homens Rápidos (Fluidez &amp; Imagens)</button>
          <button type="button" class="ctrl-btn ${isLento ? 'active-olive' : ''}" onclick="uiState.c14Profile='lento'; renderMain();">Homens Lentos (Proximidade &amp; Criatividade)</button>
        </div>

        <div class="panel-soft" style="border-left:4px solid ${isLento ? 'var(--olive)' : 'var(--teal)'};margin-bottom:18px;">
          <h4 style="font-family:var(--font-serif);font-size:1.1rem;color:${isLento ? 'var(--olive)' : 'var(--teal)'};margin-bottom:6px;">
            ${isLento ? 'Os Homens Lentos — Os Pobres na Cidade' : 'Os Homens Rápidos — A Ilusão da Velocidade'}
          </h4>
          <p style="font-size:0.85rem;color:var(--text-main);">
            ${isLento
              ? 'Habitam as zonas opacas e vivem a experiência da escassez e da proximidade intensa. Escapam ao totalitarismo da racionalidade e às miragens da cultura de massas, desenvolvendo a <strong>flexibilidade tropical</strong>, a ação comunicativa ativa e um olhar mais agudo para o futuro.'
              : 'Dotados de grande mobilidade e acesso às zonas luminosas, percorrem a cidade mas acabam vendo pouco dela. Prisioneiros das imagens prefabricadas e do conforto rotineiro, mantêm relação pragmática e superficial com o espaço banal.'}
          </p>
        </div>

        <span class="section-kicker" style="color:var(--olive);">Os Migrantes no Lugar: Da Memória à Descoberta</span>
        <div class="grid-3" style="margin-top:8px;margin-bottom:12px;">
          ${migrantSteps.map((s, i) => `
            <button type="button" class="ctrl-btn ${uiState.c14MigrantStep===i ? 'active-olive' : ''}" style="text-align:left;padding:11px 12px;" onclick="uiState.c14MigrantStep=${i}; renderMain();">
              ${s.step}
            </button>
          `).join('')}
        </div>
        <div class="panel-soft">
          <p style="font-size:0.84rem;color:var(--text-main);"><strong>${ms.step}:</strong> ${ms.desc}</p>
        </div>
      `;
    }

    /* --- CAPÍTULO 15: Balança Dialética Ordem Global vs. Ordem Local --- */
    function renderInfoCap15() {
      const b = uiState.c15Balance; // 0 = Global, 100 = Local
      const globalW = 100 - b;
      const localW = b;
      const tilt = ((b - 50) / 50) * 10; // inclinação visual suave (-10deg a +10deg)

      const synthesis = b < 35
        ? 'Predomínio da Ordem Global (Globalização Perversa): razão técnica e organizacional, sincronização despótica, normas corporativas desterritorializadas e esvaziamento do sentido local.'
        : b > 65
        ? 'Afirmação da Ordem Local (A Força do Lugar): primazia da comunicação, da copresença, da emoção e da solidariedade orgânica — o território local como norma capaz de fundar um novo destino.'
        : 'Tensão Dialética Permanente (Síntese de Milton Santos): cada lugar é simultaneamente objeto de uma razão global e de uma razão local, que se associam e se confrontam — abrindo caminho para uma outra globalização.';

      return `
        <div class="infographic-header">
          <div>
            <span class="section-kicker">Infográfico Exclusivo • Cap. 15</span>
            <h3 class="section-heading">Balança Dialética: Ordem Global vs. Ordem Local</h3>
            <p class="infographic-lead">Deslize o controle para tensionar a relação entre a <strong>Ação Globalizada como Norma</strong> e o <strong>Território Local como Norma</strong>.</p>
          </div>
        </div>

        <div class="panel-soft" style="margin-bottom:16px;">
          <div class="meter-head">
            <span style="color:var(--terracotta);">← Ordem Global (${globalW}%)</span>
            <span style="color:var(--olive);">Ordem Local (${localW}%) →</span>
          </div>
          <input type="range" class="atlas-slider" min="0" max="100" value="${b}" oninput="uiState.c15Balance=Number(this.value); renderMain();" aria-label="Equilibrar ordem global e ordem local">
        </div>

        <div class="svg-stage" style="margin-bottom:14px;">
          <svg viewBox="0 0 780 180" role="img" aria-label="Balança dialética entre ordem global e ordem local">
            <!-- Base da balança -->
            <polygon points="390,122 362,168 418,168" fill="#1A4A4F"/>
            <!-- Braço inclinável -->
            <g transform="rotate(${tilt.toFixed(1)} 390 122)">
              <line x1="140" y1="122" x2="640" y2="122" stroke="#1D2322" stroke-width="4" stroke-linecap="round"/>
              <!-- Prato Global -->
              <rect x="65" y="42" width="190" height="72" rx="12" fill="#FDF1EC" stroke="#B85D3B" stroke-width="2"/>
              <text x="160" y="68" text-anchor="middle" font-family="Newsreader, serif" font-size="14" font-weight="700" fill="#B85D3B">ORDEM GLOBAL</text>
              <text x="160" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#4F5957">Razão Técnica • Norma</text>
              <text x="160" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#4F5957">Informação • Verticalidade</text>

              <!-- Prato Local -->
              <rect x="525" y="42" width="190" height="72" rx="12" fill="#EAF2EC" stroke="#3F6A4E" stroke-width="2"/>
              <text x="620" y="68" text-anchor="middle" font-family="Newsreader, serif" font-size="14" font-weight="700" fill="#3F6A4E">ORDEM LOCAL</text>
              <text x="620" y="88" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#4F5957">Razão Orgânica • Emoção</text>
              <text x="620" y="102" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#4F5957">Comunicação • Copresença</text>
            </g>
            <circle cx="390" cy="122" r="8" fill="#C68B2C"/>
          </svg>
        </div>

        <div class="panel-soft" style="border-left:4px solid var(--olive);">
          <strong style="font-size:0.84rem;color:var(--teal-dark);">Leitura da Síntese Conclusiva:</strong>
          <p style="font-size:0.84rem;color:var(--text-main);margin-top:4px;">${synthesis}</p>
        </div>
      `;
    }

    /* =========================================================================
       RENDERIZAÇÃO PRINCIPAL DE CADA CAPÍTULO
       ========================================================================= */

    function renderChapter(ch) {
      const part = PARTS[ch.part];
      const isDone = !!studied[ch.id];
      const prevTarget = ch.id === 1 ? 'overview' : ch.id - 1;
      const prevLabel = ch.id === 1 ? 'Mapa Geral da Obra' : `Cap. ${ch.id - 1} — ${CHAPTERS[ch.id - 2].title}`;
      const nextTarget = ch.id < 15 ? ch.id + 1 : 'overview';
      const nextLabel = ch.id < 15 ? `Cap. ${ch.id + 1} — ${CHAPTERS[ch.id].title}` : 'Voltar ao Mapa Geral da Obra';

      return `
        <header class="chapter-header">
          <div class="chapter-meta-row">
            <span class="part-pill" style="background:${part.color};">${part.roman} • ${part.title}</span>
            <button type="button" class="study-toggle-btn ${isDone ? 'studied' : ''}" onclick="toggleChapterStudied(${ch.id})">
              <span>${isDone ? '✓' : '○'}</span>
              <span>${isDone ? 'Capítulo Estudado' : 'Marcar como estudado'}</span>
            </button>
          </div>
          <h2 class="chapter-title">Capítulo ${ch.id} — ${ch.title}</h2>
          <p class="chapter-subtitle">${ch.subtitle}</p>
          <div class="editorial-divider"></div>
        </header>

        <!-- Card Ideia Central -->
        <section class="card thesis-card" style="border-left-color:${part.color};">
          <span class="section-kicker" style="color:${part.color};">Ideia Central &amp; Tese do Capítulo</span>
          <p class="thesis-text">${ch.thesis}</p>
        </section>

        <!-- Infográfico Interativo Exclusivo -->
        <section class="infographic-card">
          ${renderInfographic(ch.id)}
        </section>

        <!-- Grid de Ideias-Chave -->
        <section style="margin-bottom:26px;">
          <span class="section-kicker" style="color:${part.color};">Conceitos Estruturantes</span>
          <h3 class="section-heading">Ideias-Chave &amp; Conceitos Fundamentais</h3>
          <div class="concepts-grid">
            ${ch.concepts.map(c => `
              <article class="concept-card">
                <span class="concept-tag" style="color:${part.color};">${c.tag}</span>
                <h4>${c.name}</h4>
                <p>${c.desc}</p>
              </article>
            `).join('')}
          </div>
        </section>

        <!-- Citação Editorial -->
        <blockquote class="editorial-quote" style="background:${part.soft};border-left-color:${part.color};">
          <p>“${ch.quote}”</p>
          <footer>— Milton Santos, ${ch.quoteRef} (Edusp)</footer>
        </blockquote>

        <!-- Navegação Inferior -->
        <nav class="chapter-footer-nav" aria-label="Navegação entre capítulos">
          <button type="button" class="nav-step-btn" onclick="navigateTo(${typeof prevTarget === 'string' ? `'${prevTarget}'` : prevTarget})">
            <span style="font-size:1.15rem;color:var(--teal);">←</span>
            <div>
              <span class="nav-step-meta">Anterior</span>
              <span class="nav-step-title">${prevLabel}</span>
            </div>
          </button>

          <button type="button" class="nav-step-btn next" onclick="navigateTo(${typeof nextTarget === 'string' ? `'${nextTarget}'` : nextTarget})">
            <div>
              <span class="nav-step-meta">${ch.id < 15 ? 'Próximo Capítulo' : 'Concluir Percurso'}</span>
              <span class="nav-step-title">${nextLabel}</span>
            </div>
            <span style="font-size:1.15rem;">${ch.id < 15 ? '→' : '↺'}</span>
          </button>
        </nav>
      `;
    }

    function renderMain() {
      const main = document.getElementById('main-content');
      if (!main) return;
      if (currentView === 'overview') {
        main.innerHTML = renderOverview();
      } else {
        const ch = CHAPTERS.find(c => c.id === currentView);
        main.innerHTML = ch ? renderChapter(ch) : renderOverview();
      }
    }

    /* =========================================================================
       INICIALIZAÇÃO
       ========================================================================= */

    document.addEventListener('DOMContentLoaded', () => {
      try {
        document.getElementById('open-drawer-btn').addEventListener('click', openDrawer);
        document.getElementById('close-drawer-btn').addEventListener('click', closeDrawer);
        document.getElementById('sidebar-overlay').addEventListener('click', closeDrawer);
        document.getElementById('reset-progress-btn').addEventListener('click', resetProgress);

        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');

        searchInput.addEventListener('input', (e) => {
          searchTerm = e.target.value;
          searchClear.classList.toggle('visible', searchTerm.length > 0);
          renderSidebar();
        });

        searchClear.addEventListener('click', () => {
          searchTerm = '';
          searchInput.value = '';
          searchClear.classList.remove('visible');
          renderSidebar();
          searchInput.focus();
        });

        renderSidebar();
        renderMain();
      } catch (err) {
        console.error('Erro na inicialização do Atlas:', err);
      }
    });
  </script>
</body>
</html>
