<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Future as Cultural Fact — Infográfico Interativo (Arjun Appadurai)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Merriweather:ital,wght@0,700;0,900;1,400&display=swap" rel="stylesheet">
  <style>
    /* ==========================================================================
       DESIGN TOKENS — PALETA AZUL MARINHO E AMARELO EDITORIAL
       ========================================================================== */
    :root {
      --navy-950: #0A192F;
      --navy-900: #112240;
      --navy-700: #1D3557;
      --navy-100: #E6EDF7;
      --navy-50:  #F4F6FA;

      --gold-500: #F4C430;
      --gold-400: #FFD166;
      --gold-100: #FEF3C7;
      --gold-50:  #FFF8DC;

      --white:      #FFFFFF;
      --text-main:  #1E293B;
      --text-muted: #475569;
      --border:     #D8E1EE;

      --font-serif: 'Merriweather', Georgia, 'Times New Roman', serif;
      --font-sans:  'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      --topbar-h: 102px;
      --sidebar-w: 320px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 2px 8px rgba(10, 25, 47, 0.06);
      --shadow-md: 0 8px 24px rgba(10, 25, 47, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--navy-50);
      color: var(--text-main);
      line-height: 1.65;
      overflow-x: hidden;
    }

    /* ==========================================================================
       BARRA SUPERIOR FIXA + FILTRO DE PARTES + BARRA DE PROGRESSO
       ========================================================================== */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-900) 100%);
      color: var(--white);
      box-shadow: 0 4px 18px rgba(10, 25, 47, 0.25);
    }

    .topbar-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px 10px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mobile-menu-btn {
      display: none;
      background: rgba(244, 196, 48, 0.14);
      border: 1px solid var(--gold-500);
      color: var(--gold-400);
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.18rem;
      font-weight: 900;
      color: var(--white);
      line-height: 1.2;
    }

    .brand-title span {
      color: var(--gold-500);
    }

    .brand-sub {
      font-size: 0.75rem;
      color: #CBD5E1;
      margin-top: 2px;
    }

    .parts-filter {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .part-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #E2E8F0;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .part-btn:hover {
      border-color: var(--gold-400);
      color: var(--gold-400);
    }

    .part-btn.active {
      background: var(--gold-500);
      border-color: var(--gold-500);
      color: var(--navy-950);
      font-weight: 700;
    }

    /* Barra de progresso de leitura */
    .progress-bar-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 5px 24px 8px;
      background: rgba(10, 25, 47, 0.55);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      border-bottom: 3px solid var(--gold-500);
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 6.25%;
      background: linear-gradient(90deg, var(--gold-500), var(--gold-400));
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .progress-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--gold-400);
      white-space: nowrap;
    }

    /* ==========================================================================
       LAYOUT PRINCIPAL: SIDEBAR + CONTEÚDO
       ========================================================================== */
    .app-layout {
      display: flex;
      padding-top: var(--topbar-h);
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: var(--topbar-h);
      left: 0;
      bottom: 0;
      width: var(--sidebar-w);
      background: var(--navy-950);
      color: #E2E8F0;
      overflow-y: auto;
      padding: 16px 12px 48px;
      border-right: 1px solid var(--navy-700);
      z-index: 900;
      transition: transform 0.25s ease;
    }

    .sidebar::-webkit-scrollbar { width: 6px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--navy-700); border-radius: 4px; }

    .sidebar-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6px 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-heading {
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gold-400);
    }

    .toggle-all-btn {
      background: rgba(244, 196, 48, 0.14);
      border: 1px solid rgba(244, 196, 48, 0.45);
      color: var(--gold-400);
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    .toggle-all-btn:hover {
      background: rgba(244, 196, 48, 0.25);
    }

    .sidebar-part-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--gold-500);
      margin: 16px 6px 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(244, 196, 48, 0.25);
    }

    .nav-item {
      margin-bottom: 6px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    .nav-item.active-chapter {
      background: rgba(29, 53, 87, 0.65);
      border-color: var(--gold-500);
    }

    .nav-item-header {
      display: flex;
      align-items: stretch;
    }

    .nav-chap-btn {
      flex: 1;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--white);
      padding: 9px 8px 9px 10px;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.35;
    }

    .nav-chap-btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-num {
      flex: 0 0 auto;
      background: var(--navy-700);
      color: var(--gold-400);
      font-size: 0.68rem;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 1px;
    }

    .nav-item.active-chapter .nav-num {
      background: var(--gold-500);
      color: var(--navy-950);
    }

    .nav-expand-btn {
      width: 30px;
      background: transparent;
      border: none;
      border-left: 1px solid rgba(255, 255, 255, 0.07);
      color: #94A3B8;
      cursor: pointer;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, color 0.2s;
    }

    .nav-expand-btn:hover {
      color: var(--gold-400);
    }

    .nav-item.expanded .nav-expand-btn {
      color: var(--gold-500);
      transform: rotate(90deg);
    }

    .nav-sub-list {
      display: none;
      list-style: none;
      padding: 4px 8px 8px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
      background: rgba(10, 25, 47, 0.45);
    }

    .nav-item.expanded .nav-sub-list {
      display: block;
    }

    .nav-sub-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-left: 2px solid rgba(255, 255, 255, 0.18);
      color: #CBD5E1;
      font-family: var(--font-sans);
      font-size: 0.74rem;
      padding: 5px 8px 5px 10px;
      cursor: pointer;
      line-height: 1.35;
      transition: all 0.15s;
    }

    .nav-sub-btn:hover {
      color: var(--gold-400);
      border-left-color: var(--gold-400);
    }

    .nav-sub-btn.active-sub {
      color: var(--gold-500);
      border-left-color: var(--gold-500);
      font-weight: 700;
      background: rgba(244, 196, 48, 0.1);
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 25, 47, 0.6);
      z-index: 850;
    }

    /* ==========================================================================
       ÁREA PRINCIPAL DE LEITURA
       ========================================================================== */
    .main-stage {
      margin-left: var(--sidebar-w);
      flex: 1;
      max-width: calc(100% - var(--sidebar-w));
      padding: 30px 36px 72px;
    }

    .chapter-container {
      max-width: 1060px;
      margin: 0 auto;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cabeçalho do Capítulo */
    .hero-card {
      background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-900) 65%, var(--navy-700) 100%);
      color: var(--white);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      border-left: 6px solid var(--gold-500);
      box-shadow: var(--shadow-md);
      margin-bottom: 22px;
    }

    .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .badge-gold {
      background: var(--gold-500);
      color: var(--navy-950);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .badge-outline {
      border: 1px solid rgba(255, 209, 102, 0.55);
      color: var(--gold-400);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 4px;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 900;
      line-height: 1.25;
      margin-bottom: 6px;
      color: var(--white);
    }

    .hero-orig {
      font-size: 0.84rem;
      color: var(--gold-400);
      font-style: italic;
      margin-bottom: 12px;
    }

    .hero-summary {
      font-size: 0.96rem;
      color: #E2E8F0;
      max-width: 880px;
    }

    /* Caixa de Tese Central */
    .thesis-banner {
      background: var(--gold-50);
      border: 1px solid #F2D377;
      border-left: 5px solid var(--gold-500);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
    }

    .thesis-label {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--navy-900);
      margin-bottom: 6px;
    }

    .thesis-text {
      font-size: 0.95rem;
      color: var(--navy-950);
      font-weight: 500;
    }

    /* Pílulas de navegação rápida para subcapítulos */
    .sub-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 26px;
    }

    .sub-pill-btn {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--navy-900);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .sub-pill-btn:hover {
      background: var(--navy-900);
      color: var(--gold-400);
      border-color: var(--navy-900);
    }

    /* Títulos de Seção */
    .section-divider {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 28px 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--navy-100);
    }

    .section-divider h3 {
      font-family: var(--font-serif);
      font-size: 1.28rem;
      color: var(--navy-950);
    }

    .section-tag {
      background: var(--navy-900);
      color: var(--gold-400);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ==========================================================================
       CARDS DE ESQUEMAS EXPLICATIVOS VISUAIS
       ========================================================================== */
    .schema-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }

    .schema-card.nested {
      background: #FCFDFE;
      border: 1px solid #D3DFEF;
      margin-top: 14px;
      margin-bottom: 10px;
      padding: 18px 20px;
    }

    .schema-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .schema-badge {
      background: var(--navy-950);
      color: var(--gold-500);
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 9px;
      border-radius: 4px;
    }

    .schema-badge.sub-badge {
      background: var(--gold-500);
      color: var(--navy-950);
    }

    .schema-title {
      font-family: var(--font-serif);
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--navy-950);
    }

    .schema-caption {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 12px;
      padding-top: 9px;
      border-top: 1px dashed var(--border);
    }

    /* --- Componente 1: Fluxograma Horizontal --- */
    .diag-flow {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .diag-node {
      flex: 1;
      background: var(--navy-50);
      border: 1px solid #C9D7EA;
      border-top: 4px solid var(--navy-700);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .diag-node.tone-navy {
      background: var(--navy-950);
      border-color: var(--navy-950);
      border-top: 4px solid var(--gold-500);
      color: var(--white);
    }

    .diag-node.tone-navy h5 { color: var(--gold-400); }
    .diag-node.tone-navy p, .diag-node.tone-navy li { color: #E2E8F0; }

    .diag-node.tone-gold {
      background: var(--gold-100);
      border-color: #ECCE6E;
      border-top: 4px solid var(--gold-500);
    }

    .diag-node.tone-gold h5 { color: var(--navy-950); }
    .diag-node.tone-gold p, .diag-node.tone-gold li { color: #334155; }

    .diag-node h5 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy-950);
      line-height: 1.3;
    }

    .diag-node p, .diag-node li {
      font-size: 0.79rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .diag-node ul {
      padding-left: 15px;
      margin-top: 2px;
    }

    .diag-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-700);
      font-size: 1.3rem;
      font-weight: 800;
      padding: 0 2px;
      user-select: none;
    }

    .diag-arrow.gold-arrow {
      color: #D4A106;
    }

    /* --- Componente 2: Grade de Blocos --- */
    .diag-grid {
      display: grid;
      gap: 12px;
    }
    .diag-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .diag-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .diag-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .diag-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }

    /* --- Componente 3: Tensão Bipolar (A <-> B) --- */
    .diag-tension {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      gap: 12px;
    }

    .tension-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--gold-500);
      color: var(--navy-950);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      min-width: 118px;
      max-width: 160px;
      text-align: center;
      font-size: 0.76rem;
      font-weight: 800;
      line-height: 1.3;
      box-shadow: var(--shadow-sm);
    }

    .tension-mid span.sym {
      font-size: 1.25rem;
      margin-bottom: 4px;
    }

    /* --- Componente 4: Tabela Comparativa Visual --- */
    .diag-table-wrap {
      overflow-x: auto;
    }

    .diag-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.81rem;
    }

    .diag-table th {
      background: var(--navy-950);
      color: var(--gold-400);
      text-align: left;
      padding: 10px 12px;
      font-weight: 700;
      border: 1px solid var(--navy-900);
    }

    .diag-table td {
      padding: 9px 12px;
      border: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-main);
    }

    .diag-table tr:nth-child(even) td {
      background: var(--navy-50);
    }

    .diag-table td:first-child {
      font-weight: 700;
      color: var(--navy-900);
      background: #EEF3FA;
    }

    /* --- Componente 5: Matriz 2x2 --- */
    .diag-matrix {
      display: grid;
      grid-template-columns: auto 1fr 1fr;
      gap: 8px;
      align-items: stretch;
    }

    .matrix-corner {
      background: var(--navy-950);
      color: var(--gold-400);
      font-size: 0.7rem;
      font-weight: 800;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .matrix-col-hdr {
      background: var(--navy-900);
      color: var(--gold-400);
      font-size: 0.76rem;
      font-weight: 700;
      padding: 8px 10px;
      border-radius: var(--radius-sm);
      text-align: center;
    }

    .matrix-row-hdr {
      background: var(--navy-700);
      color: var(--white);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 10px 10px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-width: 108px;
    }

    .matrix-cell {
      background: var(--navy-50);
      border: 1px solid #CBD8EB;
      border-radius: var(--radius-sm);
      padding: 12px;
    }

    .matrix-cell.highlight {
      background: var(--gold-100);
      border-color: var(--gold-500);
    }

    .matrix-cell h5 {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--navy-950);
      margin-bottom: 4px;
    }

    .matrix-cell p {
      font-size: 0.77rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* --- Componente 6: Escada / Camadas Verticais --- */
    .diag-ladder {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ladder-step {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      background: var(--navy-50);
      border: 1px solid #C9D7EA;
      border-left: 5px solid var(--navy-700);
    }

    .ladder-step.top-step {
      background: var(--navy-950);
      border-color: var(--navy-950);
      border-left: 5px solid var(--gold-500);
      color: var(--white);
    }

    .ladder-step.top-step h5 { color: var(--gold-400); }
    .ladder-step.top-step p { color: #E2E8F0; }

    .ladder-step.gold-step {
      background: var(--gold-100);
      border-color: #ECCE6E;
      border-left: 5px solid var(--gold-500);
    }

    .ladder-num {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--navy-900);
      color: var(--gold-400);
      font-size: 0.76rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ==========================================================================
       RENDERIZADOR DE ESQUEMAS VISUAIS (HTML/CSS + SVG)
       ========================================================================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderNodeCard(item) {
      const toneClass = item.tone ? `tone-${item.tone}` : "";
      const bulletsHtml = item.bullets
        ? `<ul>${item.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}</ul>`
        : "";
      const bodyHtml = item.body ? `<p>${escapeHtml(item.body)}</p>` : "";
      return `
        <div class="diag-node ${toneClass}">
          <h5>${escapeHtml(item.title)}</h5>
          ${bodyHtml}
          ${bulletsHtml}
        </div>
      `;
    }

    function renderTriangleSVG(schema) {
      return `
        <div class="svg-box">
          <svg viewBox="0 0 680 250" width="680" height="250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${escapeHtml(schema.title)}">
            <rect x="0" y="0" width="680" height="250" rx="10" fill="#F4F6FA"/>
            <!-- Triângulo conector -->
            <polygon points="340,56 145,196 535,196" fill="#FEF3C7" fill-opacity="0.55" stroke="#1D3557" stroke-width="3" stroke-linejoin="round"/>
            <!-- Centro -->
            <circle cx="340" cy="148" r="44" fill="#0A192F" stroke="#F4C430" stroke-width="3.5"/>
            <text x="340" y="144" text-anchor="middle" fill="#FFD166" font-size="10.5" font-weight="800" font-family="Inter, sans-serif">
              ${escapeHtml(schema.center.split('\n')[0])}
            </text>
            ${schema.center.includes('\n') ? `<text x="340" y="159" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="600" font-family="Inter, sans-serif">${escapeHtml(schema.center.split('\n')[1])}</text>` : ""}

            <!-- Vértice Topo -->
            <rect x="210" y="14" width="260" height="44" rx="8" fill="#0A192F" stroke="#F4C430" stroke-width="2.5"/>
            <text x="340" y="41" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" font-family="Inter, sans-serif">${escapeHtml(schema.top)}</text>

            <!-- Vértice Esquerdo -->
            <rect x="24" y="182" width="235" height="48" rx="8" fill="#112240" stroke="#FFD166" stroke-width="2"/>
            <text x="141" y="211" text-anchor="middle" fill="#FFD166" font-size="11.5" font-weight="700" font-family="Inter, sans-serif">${escapeHtml(schema.left)}</text>

            <!-- Vértice Direito -->
            <rect x="421" y="182" width="235" height="48" rx="8" fill="#112240" stroke="#FFD166" stroke-width="2"/>
            <text x="538" y="211" text-anchor="middle" fill="#FFD166" font-size="11.5" font-weight="700" font-family="Inter, sans-serif">${escapeHtml(schema.right)}</text>
          </svg>
        </div>
      `;
    }

    function renderSchemaBody(schema) {
      if (schema.type === "flow") {
        return `
          <div class="diag-flow">
            ${schema.nodes.map((n, i) => `
              ${renderNodeCard(n)}
              ${i < schema.nodes.length - 1 ? `<div class="diag-arrow gold-arrow">→</div>` : ""}
            `).join("")}
          </div>
        `;
      }

      if (schema.type === "grid") {
        const cols = schema.cols || 3;
        return `
          <div class="diag-grid cols-${cols}">
            ${schema.items.map(renderNodeCard).join("")}
          </div>
        `;
      }

      if (schema.type === "tension") {
        const midLines = escapeHtml(schema.mid.text).replace(/\n/g, "<br>");
        return `
          <div class="diag-tension">
            ${renderNodeCard(schema.left)}
            <div class="tension-mid">
              <span class="sym">${escapeHtml(schema.mid.sym)}</span>
              <div>${midLines}</div>
            </div>
            ${renderNodeCard(schema.right)}
          </div>
        `;
      }

      if (schema.type === "compare") {
        return `
          <div class="diag-table-wrap">
            <table class="diag-table">
              <thead>
                <tr>${schema.headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${schema.rows.map(r => `
                  <tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join("")}</tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      if (schema.type === "matrix2x2") {
        return `
          <div class="diag-matrix">
            <div class="matrix-corner">${escapeHtml(schema.corner)}</div>
            <div class="matrix-col-hdr">${escapeHtml(schema.colHeaders[0])}</div>
            <div class="matrix-col-hdr">${escapeHtml(schema.colHeaders[1])}</div>

            <div class="matrix-row-hdr">${escapeHtml(schema.rowHeaders[0])}</div>
            <div class="matrix-cell ${schema.cells[0].highlight ? "highlight" : ""}">
              <h5>${escapeHtml(schema.cells[0].title)}</h5>
              <p>${escapeHtml(schema.cells[0].body)}</p>
            </div>
            <div class="matrix-cell ${schema.cells[1].highlight ? "highlight" : ""}">
              <h5>${escapeHtml(schema.cells[1].title)}</h5>
              <p>${escapeHtml(schema.cells[1].body)}</p>
            </div>

            <div class="matrix-row-hdr">${escapeHtml(schema.rowHeaders[1])}</div>
            <div class="matrix-cell ${schema.cells[2].highlight ? "highlight" : ""}">
              <h5>${escapeHtml(schema.cells[2].title)}</h5>
              <p>${escapeHtml(schema.cells[2].body)}</p>
            </div>
            <div class="matrix-cell ${schema.cells[3].highlight ? "highlight" : ""}">
              <h5>${escapeHtml(schema.cells[3].title)}</h5>
              <p>${escapeHtml(schema.cells[3].body)}</p>
            </div>
          </div>
        `;
      }

      if (schema.type === "ladder") {
        return `
          <div class="diag-ladder">
            ${schema.steps.map((s, idx) => `
              <div class="ladder-step ${s.tone || ""}">
                <div class="ladder-num">${idx + 1}</div>
                <div>
                  <h5>${escapeHtml(s.title)}</h5>
                  <p>${escapeHtml(s.body)}</p>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }

      if (schema.type === "bars") {
        return `
          <div class="diag-bars">
            ${schema.bars.map(b => `
              <div class="bar-row">
                <span class="bar-lbl">${escapeHtml(b.label)}</span>
                <div class="bar-bg">
                  <div class="bar-val-fill ${b.gold ? "gold" : ""}" style="width: ${Math.max(b.pct, 12)}%;">
                    ${escapeHtml(b.text)}
                  </div>
                </div>
                <span class="bar-num">${escapeHtml(b.val)}</span>
              </div>
            `).join("")}
          </div>
        `;
      }

      if (schema.type === "triangle") {
        return renderTriangleSVG(schema);
      }

      return "";
    }

    function renderSchemaCard(schema, index, isNested = false) {
      const badgeLabel = isNested ? `Esquema do Subcapítulo` : `Esquema Central ${index + 1}`;
      return `
        <div class="schema-card ${isNested ? "nested" : ""}">
          <div class="schema-top">
            <span class="schema-badge ${isNested ? "sub-badge" : ""}">${badgeLabel}</span>
            <h4 class="schema-title">${escapeHtml(schema.title)}</h4>
          </div>
          ${renderSchemaBody(schema)}
          ${schema.caption ? `<p class="schema-caption">${escapeHtml(schema.caption)}</p>` : ""}
        </div>
      `;
    }

                  ${chaps.map(c => `

    /* ==========================================================================
       CONTROLE DE ESTADO E NAVEGAÇÃO
       ========================================================================== */
    let currentChapterId = "cap-0";
    let allExpanded = false;

    const sidebarNavRoot = document.getElementById("sidebarNavRoot");
    const chapterRoot = document.getElementById("chapterRoot");
    const progressFill = document.getElementById("progressFill");
    const progressLabel = document.getElementById("progressLabel");
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const toggleAllBtn = document.getElementById("toggleAllBtn");
    const partBtns = document.querySelectorAll(".part-btn");

    function closeMobileSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("open");
    }

    mobileMenuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      sidebarOverlay.classList.toggle("open");
    });

    sidebarOverlay.addEventListener("click", closeMobileSidebar);

    function buildSidebar() {
      const partHeaders = {
        "part-1": "Parte 1 • Geografias em Movimento",
        "part-2": "Parte 2 • A Visão a Partir de Mumbai",
        "part-3": "Parte 3 • Fazendo o Futuro"
      };

      let lastPart = "part-0";
      let html = "";

      BOOK_DATA.forEach(chap => {
        if (chap.partId !== lastPart && partHeaders[chap.partId]) {
          html += `<div class="sidebar-part-label">${escapeHtml(partHeaders[chap.partId])}</div>`;
          lastPart = chap.partId;
        }

        const hasSubs = chap.subchapters && chap.subchapters.length > 0;
        html += `
          <div class="nav-item" data-nav-chap="${chap.id}">
            <div class="nav-item-header">
              <button class="nav-chap-btn" data-open-chap="${chap.id}">
                <span class="nav-num">${escapeHtml(chap.num)}</span>
                <span>${escapeHtml(chap.title)}</span>
              </button>
              ${hasSubs ? `<button class="nav-expand-btn" data-expand-chap="${chap.id}" aria-label="Expandir subcapítulos">▸</button>` : ""}
            </div>
            ${hasSubs ? `
              <ul class="nav-sub-list">
                ${chap.subchapters.map(sub => `
                  <li>
                    <button class="nav-sub-btn" data-open-chap="${chap.id}" data-open-sub="${sub.id}">
                      ${escapeHtml(sub.code)} ${escapeHtml(sub.title)}
                    </button>
                  </li>
                `).join("")}
              </ul>
            ` : ""}
          </div>
        `;
      });

      sidebarNavRoot.innerHTML = html;

      // Eventos de clique na sidebar
      sidebarNavRoot.querySelectorAll("[data-open-chap]").forEach(btn => {
        btn.addEventListener("click", () => {
          const cid = btn.dataset.openChap;
          const sid = btn.dataset.openSub || null;
          renderChapter(cid, sid);
        });
      });

      sidebarNavRoot.querySelectorAll("[data-expand-chap]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const item = btn.closest(".nav-item");
          item.classList.toggle("expanded");
        });
      });
    }

    toggleAllBtn.addEventListener("click", () => {
      allExpanded = !allExpanded;
      sidebarNavRoot.querySelectorAll(".nav-item").forEach(item => {
        if (item.querySelector(".nav-sub-list")) {
          item.classList.toggle("expanded", allExpanded);
        }
      });
      toggleAllBtn.textContent = allExpanded ? "Recolher Todos" : "Expandir Todos";
    });

    partBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        renderChapter(btn.dataset.partJump);
      });
    });

    function renderChapter(chapterId, subId = null) {
      const idx = BOOK_DATA.findIndex(c => c.id === chapterId);
      if (idx === -1) return;

      currentChapterId = chapterId;
      const chap = BOOK_DATA[idx];
      const prevChap = idx > 0 ? BOOK_DATA[idx - 1] : null;
      const nextChap = idx < BOOK_DATA.length - 1 ? BOOK_DATA[idx + 1] : null;

      // Atualiza barra de progresso
      const pct = ((idx + 1) / BOOK_DATA.length) * 100;
      progressFill.style.width = `${pct}%`;
      progressLabel.textContent = `Seção ${idx + 1} de ${BOOK_DATA.length} • ${chap.num}`;

      // Atualiza filtros de Parte no topo
      partBtns.forEach(btn => {
        btn.classList.toggle("active", btn.dataset.partId === chap.partId);
      });

      // Atualiza estado ativo na sidebar e expande o capítulo atual
      sidebarNavRoot.querySelectorAll(".nav-item").forEach(item => {
        const isCurrent = item.dataset.navChap === chapterId;
        item.classList.toggle("active-chapter", isCurrent);
        if (isCurrent && item.querySelector(".nav-sub-list")) {
          item.classList.add("expanded");
        }
      });

      sidebarNavRoot.querySelectorAll(".nav-sub-btn").forEach(btn => {
        btn.classList.toggle("active-sub", Boolean(subId && btn.dataset.openSub === subId));
      });

      // Monta o HTML da área principal
      const hasSubs = chap.subchapters && chap.subchapters.length > 0;

      chapterRoot.innerHTML = `
        <div class="hero-card">
          <div class="hero-meta">

            <span class="badge-outline">${escapeHtml(chap.partLabel)}</span>

          <div class="hero-orig">${escapeHtml(chap.origTitle)}</div>
          <p class="hero-summary">${escapeHtml(chap.summary)}</p>
        </div>

        <div class="thesis-banner">
          <div class="thesis-label">◆ Argumento / Questão Central</div>
          <p class="thesis-text">${escapeHtml(chap.thesis)}</p>
        </div>

        ${hasSubs ? `
          <div class="sub-pills" aria-label="Atalhos para subcapítulos">
            ${chap.subchapters.map(s => `
              <button class="sub-pill-btn" data-jump-sub="${s.id}">
                ${escapeHtml(s.code)} ${escapeHtml(s.title)}
              </button>
            `).join("")}
          </div>
        ` : ""}

        <div class="section-divider">
          <h3>Esquemas Explicativos do Capítulo</h3>
          <span class="section-tag">${chap.schemas.length} Diagramas</span>
        </div>

        ${chap.schemas.map((sc, i) => renderSchemaCard(sc, i, false)).join("")}

        ${chap.showBookMap ? renderBookMap() : ""}

        ${hasSubs ? `
          <div class="section-divider">
            <h3>Subcapítulos e Esquemas Específicos</h3>
            <span class="section-tag">${chap.subchapters.length} Subcapítulos</span>
          </div>

          ${chap.subchapters.map(sub => `
            <article class="sub-card" id="${sub.id}">
              <div class="sub-card-head">
                <span class="sub-code">${escapeHtml(sub.code)}</span>
                <h4 class="sub-title">${escapeHtml(sub.title)}</h4>
                <span class="sub-orig">(${escapeHtml(sub.orig)})</span>
              </div>
              <p class="sub-text">${escapeHtml(sub.text)}</p>
              ${sub.schemas.map((sc, i) => renderSchemaCard(sc, i, true)).join("")}
            </article>
          `).join("")}
        ` : ""}

        <div class="pager-nav">
          ${prevChap ? `<button class="pager-btn" data-goto-chap="${prevChap.id}">← Anterior: ${escapeHtml(prevChap.num)} — ${escapeHtml(prevChap.title)}</button>` : "<span></span>"}
          ${nextChap ? `<button class="pager-btn next" data-goto-chap="${nextChap.id}">Próximo: ${escapeHtml(nextChap.num)} — ${escapeHtml(nextChap.title)} →</button>` : `<button class="pager-btn next" data-goto-chap="cap-0">Voltar à Introdução ↺</button>`}
        </div>
      `;

      // Liga eventos de botões internos (mapa do livro, paginação e pílulas de subcapítulo)
      chapterRoot.querySelectorAll("[data-goto-chap]").forEach(btn => {
        btn.addEventListener("click", () => renderChapter(btn.dataset.gotoChap));
      });

      chapterRoot.querySelectorAll("[data-jump-sub]").forEach(btn => {
        btn.addEventListener("click", () => scrollToSubchapter(btn.dataset.jumpSub));
      });

      closeMobileSidebar();

      if (subId) {
        setTimeout(() => scrollToSubchapter(subId), 50);
      } else {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function scrollToSubchapter(subId) {
      const el = document.getElementById(subId);
      if (!el) return;

      sidebarNavRoot.querySelectorAll(".nav-sub-btn").forEach(btn => {
        btn.classList.toggle("active-sub", btn.dataset.openSub === subId);
      });

      el.scrollIntoView({ behavior: "smooth", block: "start" });
      el.classList.remove("flash-focus");
      void el.offsetWidth;
      el.classList.add("flash-focus");
      setTimeout(() => el.classList.remove("flash-focus"), 1800);
    }

    // Inicialização
    buildSidebar();
    renderChapter("cap-0");
  </script>
</body>
</html>
