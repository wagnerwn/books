<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Por uma Geografia do Poder — Atlas Conceitual e Infográfico Interativo | Claude Raffestin</title>

  <style>
    /* =========================================================================
       TOKENS DE DESIGN — PALETA EDITORIAL (EDITORA ÁTICA • SÉRIE TEMAS VOL. 29)
       ========================================================================= */
    :root {
      --bg-paper: #F7F4EC;
      --bg-card: #FFFDF8;
      --bg-soft: #F1ECE0;
      --border-soft: #DDD5C7;
      --border-strong: #C5BAA6;

      /* Cor Primária — Poder / Destaque / Faixa Editorial */
      --crimson: #9E2424;
      --crimson-dark: #731818;
      --crimson-soft: #F9EBEB;

      /* Cor Secundária — Estrutura / Estado / Tipografia */
      --slate: #1B2635;
      --slate-muted: #4A5564;
      --petrol: #2B5B6C;
      --petrol-soft: #E8F1F4;

      /* Cores de Acento — Energia / Informação / Trunfos */
      --ochre: #C98A2C;
      --ochre-soft: #FBF3E3;
      --olive: #3D6B59;
      --olive-soft: #E8F2EE;

      /* Tipografia Editorial 100% Nativa */
      --font-serif: Georgia, 'Times New Roman', Cambria, serif;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --sidebar-w: 300px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 10px rgba(27, 38, 53, 0.06);
      --shadow-md: 0 12px 30px rgba(27, 38, 53, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--slate);
      font-family: var(--font-sans);
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      background-image:
        linear-gradient(rgba(27, 38, 53, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(27, 38, 53, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
      overflow-x: hidden;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================================
       LAYOUT PRINCIPAL & BARRA LATERAL
       ========================================================================= */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Topo Mobile */
    .mobile-topbar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(247, 244, 236, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--crimson);
      padding: 10px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--slate);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.16s ease;
    }
    .icon-btn:hover {
      border-color: var(--crimson);
      color: var(--crimson);
      background: var(--crimson-soft);
    }

    .mobile-brand {
      text-align: center;
      flex: 1;
      min-width: 0;
    }
    .mobile-brand strong {
      display: block;
      font-family: var(--font-serif);
      font-size: 0.98rem;
      color: var(--slate);
      line-height: 1.15;
    }
    .mobile-brand span {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--crimson);
    }

    .mobile-progress-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--crimson-soft);
      color: var(--crimson-dark);
      border: 1px solid rgba(158, 36, 36, 0.3);
      white-space: nowrap;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(27, 38, 53, 0.48);
      z-index: 45;
    }
    .sidebar-overlay.open {
      display: block;
    }

    /* Sidebar Fixa */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--bg-card);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 20px 18px 16px;
      background: linear-gradient(155deg, var(--slate) 0%, #141C28 65%, #34161A 100%);
      color: #F7F4EC;
      position: relative;
      border-bottom: 4px solid var(--crimson);
    }

    .edition-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.61rem;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(158, 36, 36, 0.45);
      border: 1px solid rgba(247, 244, 236, 0.25);
      color: #FBF3E3;
      margin-bottom: 8px;
    }

    .sidebar-title {
      font-family: var(--font-serif);
      font-size: 1.32rem;
      font-weight: 700;
      line-height: 1.18;
      color: #FFFFFF;
    }

    .sidebar-author {
      font-family: var(--font-mono);
      font-size: 0.71rem;
      color: #E7BE79;
      margin-top: 5px;
      letter-spacing: 0.04em;
    }

    .close-drawer-btn {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    /* Progresso */
    .progress-wrap {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.71rem;
      margin-bottom: 6px;
      color: rgba(247, 244, 236, 0.9);
    }
    .progress-meta strong {
      font-family: var(--font-mono);
      color: #E7BE79;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--crimson), var(--ochre));
      transition: width 0.3s ease;
    }

    /* Busca */
    .search-box {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border-soft);
      background: #F4EFE3;
    }
    .search-wrap {
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 9px 30px 9px 32px;
      font-size: 0.79rem;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--slate);
      outline: none;
      transition: border-color 0.16s, box-shadow 0.16s;
    }
    .search-input:focus {
      border-color: var(--crimson);
      box-shadow: 0 0 0 3px rgba(158, 36, 36, 0.12);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--slate-muted);
      pointer-events: none;
    }
    .search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: var(--slate-muted);
      border-radius: 6px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
    }
    .search-clear.visible {
      display: inline-flex;
    }
    .search-clear:hover {
      background: var(--border-soft);
      color: var(--slate);
    }

    /* Lista da Sidebar */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 20px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: var(--slate);
      transition: all 0.15s ease;
      margin-bottom: 3px;
    }
    .nav-item:hover {
      background: var(--bg-paper);
      border-color: var(--border-soft);
    }
    .nav-item.active {
      background: var(--crimson-soft);
      border-color: rgba(158, 36, 36, 0.34);
    }

    .nav-num {
      flex-shrink: 0;
      width: 26px;
      height: 24px;
      border-radius: 7px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-paper);
      color: var(--slate-muted);
      border: 1px solid var(--border-soft);
      margin-top: 1px;
    }
    .nav-item.active .nav-num {
      background: var(--crimson);
      color: #FFFFFF;
      border-color: var(--crimson);
    }

    .nav-label {
      flex: 1;
      min-width: 0;
    }
    .nav-label-title {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--slate);
    }
    .nav-item.active .nav-label-title {
      color: var(--crimson-dark);
    }
    .nav-label-sub {
      display: block;
      font-size: 0.67rem;
      color: var(--slate-muted);
      margin-top: 1px;
    }

    .nav-check {
      flex-shrink: 0;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.64rem;
      color: transparent;
      margin-top: 2px;
      transition: all 0.16s ease;
    }
    .nav-check.done {
      background: var(--olive);
      border-color: var(--olive);
      color: #FFFFFF;
    }

    .part-group {
      margin-top: 13px;
    }
    .part-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px 6px;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--slate-muted);
    }
    .part-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border-soft);
      background: #F4EFE3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.69rem;
      color: var(--slate-muted);
    }
    .reset-btn {
      background: transparent;
      border: none;
      color: var(--crimson);
      font-weight: 600;
      font-size: 0.69rem;
      text-decoration: underline;
    }

    /* =========================================================================
       CONTEÚDO PRINCIPAL
       ========================================================================= */
    .main-area {
      flex: 1;
      min-width: 0;
      padding: 32px 38px 64px;
    }

    .page-container {
      max-width: 990px;
      margin: 0 auto;
      animation: fadeUp 0.26s ease-out;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseSoft {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }

    /* Cabeçalho de Capítulo */
    .chapter-header {
      margin-bottom: 22px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .part-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      border-radius: 999px;
      color: #FFFFFF;
    }

    .study-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.79rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--slate);
      transition: all 0.16s ease;
    }
    .study-btn:hover {
      border-color: var(--olive);
      color: var(--olive);
    }
    .study-btn.studied {
      background: var(--olive);
      border-color: var(--olive);
      color: #FFFFFF;
    }

    .chapter-title {
      font-family: var(--font-serif);
      font-size: clamp(1.7rem, 3vw, 2.38rem);
      font-weight: 700;
      line-height: 1.17;
      color: var(--slate);
    }

    .chapter-subtitle {
      font-size: 0.96rem;
      color: var(--slate-muted);
      margin-top: 7px;
      max-width: 820px;
    }

    .editorial-stripe {
      height: 5px;
      width: 100%;
      margin: 18px 0 22px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--crimson) 0%, var(--crimson) 38%, var(--slate) 38%, var(--slate) 76%, var(--ochre) 76%, var(--ochre) 100%);
    }

    /* Blocos Editoriais */
    .synthesis-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-left: 5px solid var(--crimson);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    .synthesis-text {
      font-size: 0.94rem;
      color: var(--slate);
      line-height: 1.68;
    }

    .formula-pill {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      background: var(--slate);
      color: #FBF3E3;
      margin-top: 10px;
      letter-spacing: 0.03em;
    }

    /* Infográfico Container */
    .infographic-card {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
    }

    .kicker {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--crimson);
      margin-bottom: 5px;
    }

    .section-heading {
      font-family: var(--font-serif);
      font-size: 1.42rem;
      font-weight: 700;
      color: var(--slate);
      line-height: 1.24;
      margin-bottom: 6px;
    }

    .section-lead {
      font-size: 0.87rem;
      color: var(--slate-muted);
      margin-bottom: 18px;
      max-width: 790px;
    }

    /* Controles Interativos */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .ctrl-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-paper);
      color: var(--slate);
      font-size: 0.79rem;
      font-weight: 600;
      transition: all 0.16s ease;
    }
    .ctrl-btn:hover {
      border-color: var(--crimson);
      background: var(--crimson-soft);
    }
    .ctrl-btn.active-crimson {
      background: var(--crimson);
      color: #FFFFFF;
      border-color: var(--crimson);
      box-shadow: 0 2px 8px rgba(158, 36, 36, 0.25);
    }
    .ctrl-btn.active-slate {
      background: var(--slate);
      color: #FFFFFF;
      border-color: var(--slate);
    }
    .ctrl-btn.active-petrol {
      background: var(--petrol);
      color: #FFFFFF;
      border-color: var(--petrol);
    }
    .ctrl-btn.active-ochre {
      background: var(--ochre);
      color: #FFFFFF;
      border-color: var(--ochre);
    }
    .ctrl-btn.active-olive {
      background: var(--olive);
      color: #FFFFFF;
      border-color: var(--olive);
    }

    .panel-soft {
      background: #F6F2E8;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 18px;
    }

    .svg-stage {
      width: 100%;
      background: #FAF7F0;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .svg-stage svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Sliders */
    input[type="range"].atlas-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: var(--border-soft);
      outline: none;
    }
    input[type="range"].atlas-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--crimson);
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(158, 36, 36, 0.35);
      cursor: pointer;
    }
    input[type="range"].atlas-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--crimson);
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(158, 36, 36, 0.35);
      cursor: pointer;
    }

    /* Grids utilitários */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    /* Medidores */
    .meter-item {
      margin-bottom: 12px;
    }
    .meter-item:last-child {
      margin-bottom: 0;
    }
    .meter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .meter-head span:last-child {
      font-family: var(--font-mono);
    }
    .meter-track {
      width: 100%;
      height: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Chips */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--slate);
    }
    .chip-crimson { background: var(--crimson-soft); border-color: rgba(158,36,36,0.32); color: var(--crimson-dark); }
    .chip-petrol { background: var(--petrol-soft); border-color: rgba(43,91,108,0.32); color: var(--petrol); }
    .chip-ochre { background: var(--ochre-soft); border-color: rgba(201,138,44,0.36); color: #8A5B14; }
    .chip-olive { background: var(--olive-soft); border-color: rgba(61,107,89,0.32); color: var(--olive); }

    /* Cartões de Conceitos-Chave Clicáveis / Expansíveis */
    .concepts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(235px, 1fr));
      gap: 14px;
      margin-top: 12px;
      margin-bottom: 26px;
    }

    .concept-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: left;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    .concept-card:hover {
      border-color: var(--crimson);
      transform: translateY(-2px);
    }
    .concept-card.expanded {
      border-color: var(--crimson);
      background: #FFFBF8;
      box-shadow: var(--shadow-md);
    }
    .concept-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      width: 100%;
    }
    .concept-tag {
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--crimson);
      margin-bottom: 4px;
      display: block;
    }
    .concept-toggle-icon {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--crimson);
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--crimson-soft);
      display: inline-flex;

    /* =========================================================================
       PERSISTÊNCIA E UTILITÁRIOS
       ========================================================================= */

    function loadStudied() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveStudied() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(studiedMap));
      } catch (e) { /* ambiente sem localStorage */ }
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      const txt = document.getElementById('toast-msg');
      if (!el || !txt) return;
      txt.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function norm(s) {
      return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function toggleStudied(id, evt) {
      if (evt) evt.stopPropagation();
      studiedMap[id] = !studiedMap[id];
      saveStudied();
      renderSidebar();
      renderMain();
      const label = id === 11 ? 'Conclusão' : `Capítulo ${id}`;
      showToast(studiedMap[id] ? `${label} marcado como estudado.` : `${label} desmarcado.`);
    }

    function resetProgress() {
      studiedMap = {};
      saveStudied();
      renderSidebar();
      renderMain();
      showToast('Progresso de leitura reiniciado.');
    }

    function toggleConcept(secId, idx) {
      const key = `${secId}-${idx}`;
      expandedConcepts[key] = !expandedConcepts[key];
      renderMain();
    }

    function navigateTo(view) {
      currentView = view;
      renderSidebar();
      renderMain();
      closeDrawer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openDrawer() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebar-overlay').classList.add('open');
    }

    function closeDrawer() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('open');
    }

    /* --- CAP 2: A Equação do Trabalho e do Poder (E + I) --- */
    function renderCap2() {

      const resistance = Math.min(100, Math.round(18 + asymmetry * 0.72));

      let regime = '';
      if (E >= 65 && I < 40) {
        regime = 'Força Bruta Ineficiente (Alta Energia + Baixa Informação): poder coercitivo pesado, alto desgaste energético, vigilância grosseira e forte resistência explosiva.';

      } else {
        regime = 'Campo de Baixa Dissimetria / Equilíbrio Relativo: trocas mais próximas da simetria, com menor capacidade de imposição unilateral de um ator sobre o outro.';
      }

      // Posição visual do vetor de força
      const arrowLen = Math.round(90 + (totalForce / 100) * 190);
      const resLen = Math.round(45 + (resistance / 100) * 120);

      return `

            <text x="94" y="114" text-anchor="middle" font-family="monospace" font-size="9" fill="#4A5564">Dado bruto / Inerte</text>

            <!-- 3 Engrenagens / Filtros -->
            <circle cx="278" cy="100" r="44" fill="${G.tech ? '#E8F1F4' : '#F4F1EA'}" stroke="${G.tech ? '#2B5B6C' : '#C5BAA6'}" stroke-width="3" stroke-dasharray="${G.tech ? '8 4' : 'none'}"/>
            <text x="278" y="96" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="${G.tech ? '#2B5B6C' : '#8C8375'}">TÉCNICA</text>
            <text x="278" y="111" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4A5564">${G.tech ? 'Ativa (r)' : 'Ausente'}</text>

            <circle cx="404" cy="100" r="44" fill="${G.energy ? '#FBF3E3' : '#F4F1EA'}" stroke="${G.energy ? '#C98A2C' : '#C5BAA6'}" stroke-width="3" stroke-dasharray="${G.energy ? '8 4' : 'none'}"/>
            <text x="404" y="96" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="${G.energy ? '#8A5B14' : '#8C8375'}">ENERGIA</text>
            <text x="404" y="111" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4A5564">${G.energy ? 'Acessível' : 'Bloqueada'}</text>

            <circle cx="530" cy="100" r="44" fill="${G.power ? '#F9EBEB' : '#F4F1EA'}" stroke="${G.power ? '#9E2424' : '#C5BAA6'}" stroke-width="3" stroke-dasharray="${G.power ? '8 4' : 'none'}"/>
            <text x="530" y="96" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="${G.power ? '#9E2424' : '#8C8375'}">PODER</text>
            <text x="530" y="111" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#4A5564">${G.power ? 'Utilidade' : 'Sem demanda'}</text>

            <!-- Fluxo -->
            <line x1="168" y1="100" x2="232" y2="100" stroke="#1B2635" stroke-width="2.5"/>
            <line x1="576" y1="100" x2="634" y2="100" stroke="${isResource ? '#3D6B59' : '#8C8375'}" stroke-width="3"/>

            <!-- Saída: Recurso ou Matéria Obsoleta -->
            <rect x="636" y="48" width="164" height="104" rx="14" fill="${isResource ? '#3D6B59' : '#DDD5C7'}" stroke="${isResource ? '#274A3D' : '#8C8375'}" stroke-width="2.5"/>
            <text x="718" y="88" text-anchor="middle" font-family="Georgia, serif" font-size="14.5" font-weight="700" fill="${isResource ? '#FFFFFF' : '#4A5564'}">${isResource ? 'RECURSO (P)' : 'MERA MATÉRIA'}</text>
            <text x="718" y="110" text-anchor="middle" font-family="monospace" font-size="9.5" fill="${isResource ? '#E8F2EE' : '#4A5564'}">${isResource ? 'A · r · M ➔ P' : `${count}/3 condições`}</text>
            <text x="718" y="128" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="${isResource ? '#FBF3E3' : '#4A5564'}">${isResource ? 'Propriedades inventadas' : 'Propriedades latentes'}</text>
          </svg>
        </div>

        <div class="panel-soft" style="border-left:4px solid ${isResource ? 'var(--olive)' : 'var(--ochre)'};">
          <p style="font-size:0.84rem;color:var(--slate);">
            ${isResource
              ? '<strong>Recurso Produzido (A·r·M ➔ P):</strong> Todas as condições relacionais estão ativas. A prática humana extraiu propriedades úteis da matéria — como o carvão que passou de pedra curiosa a combustível e matéria-prima química.'
              : '<strong>Matéria Inerte ou Obsoleta:</strong> Faltando técnica, energia/acesso ou demanda social, a substância permanece (ou volta a ser, como o sílex) apenas matéria bruta sem valor de recurso.'}
          </p>
        </div>
      `;
    }

    /* --- CAP 10: Ciclo de Vida do Recurso & Estratégias --- */
    function renderCap10() {
      const phases = [
        { n: '1. Invenção / Descoberta', y: 155, d: 'Uma prática técnica nova identifica propriedades úteis em uma matéria. O saber (I) abre o horizonte de utilização.' },
        { n: '2. Monopólio / Trunfo Estratégico', y: 55, d: 'Atores ArM ou AM/Ar concentram o acesso e o know-how, convertendo o recurso em arma política e fonte de relações dissimétricas.' },
        { n: '3. Disputa / Dependência', y: 78, d: 'Países produtores (AM) formam cartéis (ex.: OPEP) e jogam com o tempo; potências tecnológicas (Ar) retêm o saber-fazer e buscam diversificação.' },
        { n: '4. Substituição / Obsolescência', y: 162, d: 'A pressão dos preços ou o esgotamento induz atores Ar a inventar bens de substituição, esvaziando o antigo trunfo.' }
      ];
      const ph = phases[ui.c10Phase];

      const strats = {
        acesso: { t: 'Controle de Acesso (Espacial)', d: 'Domínio direto ou indireto das jazidas, rotas de circulação e contratos de concessão/associação para garantir fluxo contínuo.' },
        estocagem: { t: 'Estocagem & Gestão do Tempo', d: 'Jogada típica dos atores AM (cotas de extração) ou de grandes consumidores (reservas estratégicas) para neutralizar pressões de curto prazo.' },
        substituicao: { t: 'Substituição Tecnológica (Estratégia Ar)', d: 'Investimento intensivo em P&D (informação) para criar substitutos sintéticos ou energias alternativas, rompendo a dependência de AM.' },
        preco: { t: 'Controle de Preço & Informação', d: 'Manipulação da rarefação relativa/artificial via preços e retenção do "saber-fazer" nas redes privadas das multinacionais.' }
      };
      const st = strats[ui.c10Strat];

      return `
        <span class="kicker" style="color:var(--ochre);">Infográfico Interativo • Cap. 10</span>
        <h3 class="section-heading">O Tabuleiro dos Trunfos e o Ciclo de Vida do Recurso</h3>
        <p class="section-lead">Clique nas <strong>4 fases da trajetória estratégica</strong> de um recurso no gráfico e compare as <strong>4 estratégias de poder</strong> no tabuleiro internacional.</p>

        <div class="svg-stage">
          <svg viewBox="0 0 820 215" role="img" aria-label="Curva do ciclo de vida estratégico de um recurso como arma política">
            <!-- Eixos -->
            <line x1="55" y1="185" x2="780" y2="185" stroke="#1B2635" stroke-width="2"/>
            <line x1="55" y1="22" x2="55" y2="185" stroke="#1B2635" stroke-width="2"/>
            <text x="64" y="34" font-family="monospace" font-size="9.5" font-weight="700" fill="#9E2424">VALOR COMO TRUNFO POLÍTICO</text>
            <text x="776" y="202" text-anchor="end" font-family="monospace" font-size="9.5" fill="#4A5564">TEMPO / EVOLUÇÃO TÉCNICA →</text>

            <!-- Curva do Ciclo -->
            <path d="M 110 155 C 200 140 245 55 315 55 C 400 55 460 75 520 78 C 610 82 650 155 725 162" fill="none" stroke="#C98A2C" stroke-width="4"/>

            <!-- 4 Nós Clicáveis -->
            ${[
              { i: 0, x: 110, y: 155, l: '1. Invenção' },
              { i: 1, x: 315, y: 55, l: '2. Monopólio' },
              { i: 2, x: 520, y: 78, l: '3. Disputa' },
              { i: 3, x: 725, y: 162, l: '4. Substituição' }
            ].map(pt => {
              const act = ui.c10Phase === pt.i;
              return `
                <g onclick="ui.c10Phase=${pt.i}; renderMain();" style="cursor:pointer;">
                  <circle cx="${pt.x}" cy="${pt.y}" r="${act ? 15 : 10}" fill="${act ? '#9E2424' : '#1B2635'}" stroke="#FFFDF8" stroke-width="3"/>
                  <text x="${pt.x}" y="${pt.y - 20}" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="${act ? '#9E2424' : '#1B2635'}">${pt.l}</text>
                </g>
              `;
            }).join('')}
          </svg>
        </div>

        <div class="panel-soft" style="border-left:4px solid var(--crimson);margin-bottom:18px;">
          <strong style="font-family:var(--font-serif);font-size:1.05rem;color:var(--crimson);">${ph.n}</strong>
          <p style="font-size:0.84rem;color:var(--slate);margin-top:4px;">${ph.d}</p>
        </div>

        <span class="kicker">Estratégias de Poder no Tabuleiro dos Recursos</span>
        <div class="btn-row" style="margin-top:6px;">
          ${[
            ['acesso', 'Controle de Acesso'],
            ['estocagem', 'Estocagem / Tempo'],
            ['substituicao', 'Substituição Técnica'],
            ['preco', 'Preço & Saber-Fazer']
          ].map(([k, l]) => `
            <button type="button" class="ctrl-btn ${ui.c10Strat===k ? 'active-ochre' : ''}" onclick="ui.c10Strat='${k}'; renderMain();">${l}</button>
          `).join('')}
        </div>
        <div class="panel-soft" style="border-left:4px solid var(--ochre);">
          <strong style="font-family:var(--font-serif);font-size:1rem;">${st.t}</strong>
          <p style="font-size:0.83rem;color:var(--slate);margin-top:4px;">${st.d}</p>
        </div>
      `;
    }

    /* --- CAP 11 (CONCLUSÃO): A Bússola da Geografia do Poder --- */
    function renderCap11() {
      const isAut = ui.c11Logic === 'autonomia';
      const axes = {
        poder: {
          title: 'Eixo I — Problemática do Poder',
          dom: 'Poder unidimensional ("P"), centralização absoluta, separação entre Energia e Informação, coisificação das relações.',
          aut: 'Compreensão relacional ("p"), reconhecimento da resistência e busca por relações simétricas (ganhos e custos equilibrados).'
        },
        populacao: {
          title: 'Eixo II — População e Diferença',
          dom: 'Redução ao "homem estatístico", homogeneização isotrópica, discriminação espacial e destruição de línguas e culturas.',
          aut: 'População como fonte criadora de autonomia; preservação das diferenças genéticas, linguísticas e culturais.'
        },
        territorio: {
          title: 'Eixo III — Território e Territorialidade',
          dom: 'Malhas suportadas, centralidades hipertrofiadas, redes opacas de vigilância e territorialidade alienada.',
          aut: 'Malhas concretas e vividas, redes horizontais, mediadores apropriados conscientemente e defesa do cotidiano.'
        },
        recursos: {
          title: 'Eixo IV — Recursos e Tecnicidade',
          dom: 'Exploracionismo predatório (informação funcional), monopólio do saber-fazer (Ar) e uso dos recursos como armas de estrangulamento.',
          aut: 'Tecnicidade simétrica, equilíbrio com informação reguladora, cooperação bioeconômica e socialização do saber.'
        }
      };
      const curAx = axes[ui.c11Axis];

      return `
        <span class="kicker" style="color:var(--slate);">Infográfico Síntese • Conclusão</span>
        <h3 class="section-heading">A Bússola da Geografia do Poder: Dominação vs. Autonomia</h3>
        <p class="section-lead">Alterne o polo orientador da bússola e clique em cada um dos <strong>4 eixos radiais</strong> para sintetizar toda a obra de Claude Raffestin.</p>

        <div class="btn-row">
          <button type="button" class="ctrl-btn ${!isAut ? 'active-crimson' : ''}" onclick="ui.c11Logic='dominacao'; renderMain();">Lógica da Dominação (Dissimetria / Alienação)</button>
          <button type="button" class="ctrl-btn ${isAut ? 'active-olive' : ''}" onclick="ui.c11Logic='autonomia'; renderMain();">Lógica da Autonomia (Simetria / Apropriação Consciente)</button>
        </div>

        <div class="grid-2" style="align-items:center;">
          <div class="svg-stage" style="margin-bottom:0;">
            <svg viewBox="0 0 380 280" role="img" aria-label="Bússola radial dos 4 eixos da Geografia do Poder">
              <!-- Círculos da Bússola -->
              <circle cx="190" cy="140" r="108" fill="none" stroke="#DDD5C7" stroke-width="2"/>
              <circle cx="190" cy="140" r="76" fill="none" stroke="#DDD5C7" stroke-width="1.2" stroke-dasharray="4 4"/>
              <line x1="190" y1="22" x2="190" y2="258" stroke="#C5BAA6" stroke-width="1.5"/>
              <line x1="72" y1="140" x2="308" y2="140" stroke="#C5BAA6" stroke-width="1.5"/>

              <!-- Agulha da Bússola -->
              <polygon points="190,74 202,140 190,206 178,140" fill="${isAut ? '#3D6B59' : '#9E2424'}" opacity="0.22"/>
              <circle cx="190" cy="140" r="34" fill="${isAut ? '#3D6B59' : '#9E2424'}"/>
              <text x="190" y="137" text-anchor="middle" font-family="monospace" font-size="8.5" font-weight="700" fill="#fff">${isAut ? 'LÓGICA DA' : 'LÓGICA DA'}</text>
              <text x="190" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="10.5" font-weight="700" fill="#FBF3E3">${isAut ? 'AUTONOMIA' : 'DOMINAÇÃO'}</text>

              <!-- 4 Eixos Clicáveis -->
              ${[
                { k: 'poder', x: 190, y: 34, l: 'PODER (E+I)' },
                { k: 'populacao', x: 306, y: 140, l: 'POPULAÇÃO' },
                { k: 'territorio', x: 190, y: 246, l: 'TERRITÓRIO' },
                { k: 'recursos', x: 74, y: 140, l: 'RECURSOS' }
              ].map(n => {
                const act = ui.c11Axis === n.k;
                return `
                  <g onclick="ui.c11Axis='${n.k}'; renderMain();" style="cursor:pointer;">
                    <rect x="${n.x - 54}" y="${n.y - 16}" width="108" height="32" rx="16"
                      fill="${act ? '#1B2635' : '#FFFDF8'}" stroke="${act ? '#1B2635' : (isAut ? '#3D6B59' : '#9E2424')}" stroke-width="2"/>
                    <text x="${n.x}" y="${n.y + 4}" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700"
                      fill="${act ? '#FBF3E3' : '#1B2635'}">${n.l}</text>
                  </g>
                `;
              }).join('')}
            </svg>
          </div>

          <div class="panel-soft" style="border-left:4px solid ${isAut ? 'var(--olive)' : 'var(--crimson)'};">
            <span class="chip ${isAut ? 'chip-olive' : 'chip-crimson'}" style="margin-bottom:8px;">
              ${isAut ? 'Horizonte da Autonomia' : 'Crítica à Dominação'}
            </span>
            <h4 style="font-family:var(--font-serif);font-size:1.15rem;color:var(--slate);margin-bottom:8px;">${curAx.title}</h4>
            <p style="font-size:0.86rem;color:var(--slate);margin-bottom:14px;">${isAut ? curAx.aut : curAx.dom}</p>
            <div style="padding-top:10px;border-top:1px dashed var(--border-strong);font-size:0.78rem;color:var(--slate-muted);">
              <strong>Contraste imediato:</strong> ${isAut ? curAx.dom : curAx.aut}
            </div>
          </div>
        </div>
      `;
    }

    /* =========================================================================
       RENDERIZAÇÃO DE CAPÍTULO COMPLETO
       ========================================================================= */

    function renderSection(sec) {
      const part = PARTS[sec.part];
      const isDone = !!studiedMap[sec.id];

      const prevTarget = sec.id === 1 ? 'overview' : sec.id - 1;
      const prevTitle = sec.id === 1 ? 'Mapa Geral da Obra' : (SECTIONS[sec.id - 2].id === 11 ? 'Conclusão' : `Cap. ${SECTIONS[sec.id - 2].id} — ${SECTIONS[sec.id - 2].title}`);

      const nextTarget = sec.id < 11 ? sec.id + 1 : 'overview';
      const nextTitle = sec.id < 11 ? (SECTIONS[sec.id].id === 11 ? 'Conclusão — Por uma Geografia da Autonomia' : `Cap. ${SECTIONS[sec.id].id} — ${SECTIONS[sec.id].title}`) : 'Voltar ao Mapa Geral da Obra';

      return `
        <header class="chapter-header">
          <div class="meta-row">
            <span class="part-pill" style="background:${part.color};">${part.roman} • ${part.title}</span>
            <button type="button" class="study-btn ${isDone ? 'studied' : ''}" onclick="toggleStudied(${sec.id})">
              <span>${isDone ? '✓' : '○'}</span>
              <span>${isDone ? 'Estudado' : 'Marcar como estudado'}</span>
            </button>
          </div>
          <h2 class="chapter-title">${sec.id === 11 ? sec.title : `Capítulo ${sec.id} — ${sec.title}`}</h2>
          <p class="chapter-subtitle">${sec.subtitle}</p>
          <div class="editorial-stripe"></div>
        </header>

        <!-- Síntese Teórica -->
        <section class="synthesis-card" style="border-left-color:${part.color};">
          <span class="kicker" style="color:${part.color};">Síntese Teórica e Conceitual</span>
          <p class="synthesis-text">${sec.synthesis}</p>
          <div class="formula-pill">${sec.formula}</div>
        </section>

        <!-- Infográfico Interativo Exclusivo -->
        <section class="infographic-card">
          ${renderInfographic(sec.id)}
        </section>

        <!-- Cartões de Conceitos-Chave Clicáveis / Expansíveis -->
        <section>
          <span class="kicker" style="color:${part.color};">Glossário Relacional (Clique para expandir relações)</span>
          <h3 class="section-heading">Conceitos-Chave do Capítulo</h3>
          <div class="concepts-grid">
            ${sec.concepts.map((c, idx) => {
              const exp = !!expandedConcepts[`${sec.id}-${idx}`];
              return `
                <button type="button" class="concept-card ${exp ? 'expanded' : ''}" onclick="toggleConcept(${sec.id}, ${idx})">
                  <div class="concept-top">
                    <span class="concept-tag" style="color:${part.color};">${c.tag}</span>
                    <span class="concept-toggle-icon" aria-hidden="true">${exp ? '−' : '+'}</span>
                  </div>
                  <h4>${c.name}</h4>
                  <p class="concept-def">${c.def}</p>
                  ${exp ? `
                    <div class="concept-extra">
                      <strong>Conexão conceitual:</strong> ${c.rel}
                    </div>
                  ` : ''}
                </button>
              `;
            }).join('')}
          </div>
        </section>

        <!-- Citação -->
        <blockquote class="quote-card" style="background:${part.soft};border-left-color:${part.color};">
          <p>“${sec.quote}”</p>
          <footer style="color:${part.color};">— Claude Raffestin, ${sec.quoteRef} (Editora Ática)</footer>
        </blockquote>

        <!-- Rodapé de Navegação -->
        <nav class="chapter-footer" aria-label="Navegação entre capítulos">
          <button type="button" class="step-btn" onclick="navigateTo(${typeof prevTarget === 'string' ? `'${prevTarget}'` : prevTarget})">
            <span style="font-size:1.15rem;color:var(--crimson);">←</span>
            <div>
              <span class="step-meta">Anterior</span>
              <span class="step-title">${prevTitle}</span>
            </div>
          </button>

          <button type="button" class="step-btn next" onclick="navigateTo(${typeof nextTarget === 'string' ? `'${nextTarget}'` : nextTarget})">
            <div>
              <span class="step-meta">${sec.id < 11 ? 'Próximo' : 'Concluir Percurso'}</span>
              <span class="step-title">${nextTitle}</span>
            </div>
            <span style="font-size:1.15rem;">${sec.id < 11 ? '→' : '↺'}</span>
          </button>
        </nav>
      `;
    }

    function renderMain() {
      const el = document.getElementById('main-content');
      if (!el) return;
      if (currentView === 'overview') {
        el.innerHTML = renderOverview();
      } else {
        const sec = SECTIONS.find(s => s.id === currentView);
        el.innerHTML = sec ? renderSection(sec) : renderOverview();
      }
    }

    /* =========================================================================
       INICIALIZAÇÃO
       ========================================================================= */

    document.addEventListener('DOMContentLoaded', () => {
      try {
        document.getElementById('open-drawer-btn').addEventListener('click', openDrawer);
        document.getElementById('close-drawer-btn').addEventListener('click', closeDrawer);
        document.getElementById('sidebar-overlay').addEventListener('click', closeDrawer);
        document.getElementById('reset-progress-btn').addEventListener('click', resetProgress);

        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');

        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          searchClear.classList.toggle('visible', searchQuery.length > 0);
          renderSidebar();
        });

        searchClear.addEventListener('click', () => {
          searchQuery = '';
          searchInput.value = '';
          searchClear.classList.remove('visible');
          renderSidebar();
          searchInput.focus();
        });

        renderSidebar();
        renderMain();
      } catch (err) {
        console.error('Erro ao inicializar o Atlas de Raffestin:', err);
      }
    });
  </script>
</body>
</html>
