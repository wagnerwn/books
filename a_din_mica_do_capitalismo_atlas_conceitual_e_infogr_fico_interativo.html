<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Dinâmica do Capitalismo — Atlas Conceitual e Infográfico Interativo | Fernand Braudel</title>

  <style>
    /* =========================================================================
       TOKENS DE DESIGN — PALETA EDITORIAL HISTÓRICO-CARTOGRÁFICA (ROCCO, 1987)
       ========================================================================= */
    :root {
      --bg-paper: #F6F1E7;
      --bg-card: #FFFDF8;
      --bg-soft: #EFE8D9;
      --border-soft: #DFD5C3;
      --border-strong: #C6B89E;

      --text-main: #1E1B18;
      --text-muted: #575046;

      /* Cor Primária — Bordô / Carmim clássico (Capitalismo / Cúpula) */
      --bordo: #8C2332;
      --bordo-dark: #631621;
      --bordo-soft: #F7E8EA;

      /* Cor Secundária — Azul-Marinho Cartográfico (Atlântico / Tempo do Mundo) */
      --navy: #1E354D;
      --navy-dark: #132334;
      --navy-soft: #E6EDF4;

      /* Destaque 1 — Ouro Envelhecido / Ocre Monetário (Economia de Mercado) */
      --gold: #C28728;
      --gold-dark: #8C5E14;
      --gold-soft: #FBF2E1;

      /* Destaque 2 — Verde-Oliva (Vida Material / Cotidiano) */
      --olive: #3E634E;
      --olive-dark: #2A4636;
      --olive-soft: #E7F0EA;

      /* Tipografia 100% Nativa */
      --font-serif: Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
      --font-sans: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --sidebar-w: 300px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 10px rgba(30, 27, 24, 0.06);
      --shadow-md: 0 12px 30px rgba(30, 27, 24, 0.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(rgba(140, 35, 50, 0.045) 1px, transparent 0),
        linear-gradient(rgba(30, 53, 77, 0.025) 1px, transparent 1px);
      background-size: 26px 26px, 26px 26px;
      overflow-x: hidden;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================================
       MICRO-ANIMAÇÕES PARA ESQUEMAS E ENGRENAGENS
       ========================================================================= */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spinCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spinCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes dashFlow {
      to { stroke-dashoffset: -28; }
    }

    .gear-cw {
      transform-box: fill-box;
      transform-origin: center;
      animation: spinCW 9s linear infinite;
    }

    .gear-ccw {
      transform-box: fill-box;
      transform-origin: center;
      animation: spinCCW 9s linear infinite;
    }

    .gear-jammed {
      transform-box: fill-box;
      transform-origin: center;
    }

    .flow-animated {
      stroke-dasharray: 8 6;
      animation: dashFlow 1.6s linear infinite;
    }

    /* =========================================================================
       LAYOUT PRINCIPAL E BARRA LATERAL
       ========================================================================= */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Topo Mobile */
    .mobile-topbar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(246, 241, 231, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--bordo);
      padding: 10px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.16s ease;
    }
    .icon-btn:hover {
      border-color: var(--bordo);
      color: var(--bordo);
      background: var(--bordo-soft);
    }

    .mobile-brand {
      text-align: center;
      flex: 1;
      min-width: 0;
    }
    .mobile-brand strong {
      display: block;
      font-family: var(--font-serif);
      font-size: 0.96rem;
      color: var(--text-main);
      line-height: 1.15;
    }
    .mobile-brand span {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--bordo);
    }

    .mobile-progress-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--bordo-soft);
      color: var(--bordo-dark);
      border: 1px solid rgba(140, 35, 50, 0.3);
      white-space: nowrap;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(30, 27, 24, 0.5);
      z-index: 45;
    }
    .sidebar-overlay.open {
      display: block;
    }

    /* Barra Lateral Fixa */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--bg-card);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 20px 18px 16px;
      background: linear-gradient(150deg, var(--bordo) 0%, var(--bordo-dark) 58%, var(--navy-dark) 100%);
      color: #F6F1E7;
      position: relative;
      border-bottom: 4px solid var(--gold);
    }

    .edition-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.61rem;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(194, 135, 40, 0.28);
      border: 1px solid rgba(251, 242, 225, 0.3);
      color: #FBF2E1;
      margin-bottom: 8px;
    }

    .sidebar-title {
      font-family: var(--font-serif);
      font-size: 1.32rem;
      font-weight: 700;
      line-height: 1.18;
      color: #FFFFFF;
    }

    .sidebar-author {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: #F4D59A;
      margin-top: 5px;
      letter-spacing: 0.04em;
    }

    .sidebar-sub {
      font-size: 0.72rem;
      color: rgba(246, 241, 231, 0.84);
      margin-top: 2px;
    }

    .close-drawer-btn {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    /* Progresso */
    .progress-wrap {
      margin-top: 14px;
      padding-top: 11px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.71rem;
      margin-bottom: 6px;
      color: rgba(246, 241, 231, 0.92);
    }
    .progress-meta strong {
      font-family: var(--font-mono);
      color: #F4D59A;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--gold), #F2C97D);
      transition: width 0.3s ease;
    }

    /* Busca Instantânea */
    .search-box {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-soft);
      background: #F3ECE0;
    }
    .search-wrap {
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 9px 30px 9px 32px;
      font-size: 0.79rem;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.16s, box-shadow 0.16s;
    }
    .search-input:focus {
      border-color: var(--bordo);
      box-shadow: 0 0 0 3px rgba(140, 35, 50, 0.12);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
    }
    .search-clear.visible {
      display: inline-flex;
    }
    .search-clear:hover {
      background: var(--border-soft);
      color: var(--text-main);
    }

    /* Lista da Sidebar */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 14px 10px 20px;
    }

    .nav-section-title {
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-muted);
      padding: 4px 10px 8px;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 11px;
      padding: 10px 10px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      color: var(--text-main);
      transition: all 0.16s ease;
      margin-bottom: 5px;
    }
    .nav-item:hover {
      background: var(--bg-paper);
      border-color: var(--border-soft);
    }
    .nav-item.active {
      background: var(--bordo-soft);
      border-color: rgba(140, 35, 50, 0.35);
    }

    .nav-num {
      flex-shrink: 0;
      width: 28px;
      height: 26px;
      border-radius: 7px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-paper);
      color: var(--text-muted);
      border: 1px solid var(--border-soft);
      margin-top: 1px;
    }
    .nav-item.active .nav-num {
      background: var(--bordo);
      color: #FFFFFF;
      border-color: var(--bordo);
    }

    .nav-label {
      flex: 1;
      min-width: 0;
    }
    .nav-label-title {
      display: block;
      font-size: 0.81rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-main);
    }
    .nav-item.active .nav-label-title {
      color: var(--bordo-dark);
    }
    .nav-label-sub {
      display: block;
      font-size: 0.69rem;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.3;
    }

    .nav-check {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.66rem;
      color: transparent;
      margin-top: 2px;
      transition: all 0.16s ease;
    }
    .nav-check.done {
      background: var(--olive);
      border-color: var(--olive);
      color: #FFFFFF;
    }

    .search-match-tag {
      display: inline-block;
      margin-top: 4px;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--gold-soft);
      color: var(--gold-dark);
      border: 1px solid rgba(194, 135, 40, 0.35);
    }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border-soft);
      background: #F3ECE0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.69rem;
      color: var(--text-muted);
    }
    .reset-btn {
      background: transparent;
      border: none;
      color: var(--bordo);
      font-weight: 600;
      font-size: 0.69rem;
      text-decoration: underline;
    }

    /* =========================================================================
       ÁREA PRINCIPAL DE LEITURA E EXPLORAÇÃO
       ========================================================================= */
    .main-area {
      flex: 1;
      min-width: 0;
      padding: 32px 38px 68px;
    }

    .page-container {
      max-width: 1020px;
      margin: 0 auto;
      animation: fadeUp 0.28s ease-out;
    }

    /* Cabeçalho da Visão / Capítulo */
    .chapter-header {
      margin-bottom: 24px;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .part-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 13px;
      border-radius: 999px;
      color: #FFFFFF;
    }

    .study-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      transition: all 0.16s ease;
    }
    .study-btn:hover {
      border-color: var(--olive);
      color: var(--olive);
    }
    .study-btn.studied {
      background: var(--olive);
      border-color: var(--olive);
      color: #FFFFFF;
    }

    .chapter-title {
      font-family: var(--font-serif);
      font-size: clamp(1.72rem, 3.1vw, 2.45rem);
      font-weight: 700;
      line-height: 1.16;
      color: var(--text-main);
    }

    .chapter-subtitle {
      font-size: 0.97rem;
      color: var(--text-muted);
      margin-top: 8px;
      max-width: 840px;
    }

    .editorial-stripe {
      height: 5px;
      width: 100%;
      margin: 18px 0 22px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--bordo) 0%, var(--bordo) 36%, var(--gold) 36%, var(--gold) 68%, var(--navy) 68%, var(--navy) 100%);
    }

    /* Epígrafe + Tese Central */
    .thesis-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-left: 5px solid var(--bordo);
      border-radius: var(--radius-md);
      padding: 20px 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 26px;
    }
    .epigraph {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.03rem;
      color: var(--bordo-dark);
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--border-strong);
      line-height: 1.52;
    }
    .thesis-text {
      font-size: 0.94rem;
      color: var(--text-main);
      line-height: 1.66;
    }

    /* Container de Infográfico */
    .infographic-card {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow-md);
      margin-bottom: 28px;
    }

    .kicker {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--bordo);
      margin-bottom: 5px;
    }

    .section-heading {
      font-family: var(--font-serif);
      font-size: 1.42rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.24;
      margin-bottom: 6px;
    }

    .section-lead {
      font-size: 0.87rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      max-width: 820px;
    }

    /* Controles Interativos */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .ctrl-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-paper);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.16s ease;
    }
    .ctrl-btn:hover {
      border-color: var(--bordo);
      background: var(--bordo-soft);
    }
    .ctrl-btn.active-bordo {
      background: var(--bordo);
      color: #FFFFFF;
      border-color: var(--bordo);
      box-shadow: 0 2px 8px rgba(140, 35, 50, 0.25);
    }
    .ctrl-btn.active-navy {
      background: var(--navy);
      color: #FFFFFF;
      border-color: var(--navy);
      box-shadow: 0 2px 8px rgba(30, 53, 77, 0.22);
    }
    .ctrl-btn.active-gold {
      background: var(--gold);
      color: #FFFFFF;
      border-color: var(--gold);
    }
    .ctrl-btn.active-olive {
      background: var(--olive);
      color: #FFFFFF;
      border-color: var(--olive);
    }

    .panel-soft {
      background: #F6F1E7;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 18px;
    }

    .svg-stage {
      width: 100%;
      background: #FAF6ED;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .svg-stage svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Sliders */
    input[type="range"].atlas-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: var(--border-soft);
      outline: none;
    }
    input[type="range"].atlas-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--bordo);
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(140, 35, 50, 0.38);
      cursor: pointer;
    }
    input[type="range"].atlas-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--bordo);
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(140, 35, 50, 0.38);
      cursor: pointer;
    }

    /* Grids utilitários */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    /* Chips e Tags */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-main);
    }
    .chip-bordo { background: var(--bordo-soft); border-color: rgba(140,35,50,0.32); color: var(--bordo-dark); }
    .chip-navy { background: var(--navy-soft); border-color: rgba(30,53,77,0.32); color: var(--navy); }
    .chip-gold { background: var(--gold-soft); border-color: rgba(194,135,40,0.38); color: var(--gold-dark); }
    .chip-olive { background: var(--olive-soft); border-color: rgba(62,99,78,0.34); color: var(--olive-dark); }

    /* Medidores */
    .meter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.79rem;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .meter-head span:last-child {
      font-family: var(--font-mono);
    }

    /* Grade de Conceitos-Chave Expansíveis */
    .concepts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(245px, 1fr));
      gap: 14px;
      margin-top: 12px;
      margin-bottom: 28px;
    }

    .concept-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all 0.18s ease;
      text-align: left;
      width: 100%;
      display: flex;
      flex-direction: column;
    }
    .concept-card:hover {
      border-color: var(--bordo);
      transform: translateY(-2px);
    }
    .concept-card.expanded {
      border-color: var(--bordo);
      background: #FFFBF7;
      box-shadow: var(--shadow-md);
    }
    .concept-top {

    function loadStudied() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveStudied() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(studied));
      } catch (e) { /* ambiente sem localStorage */ }
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      const txt = document.getElementById('toast-msg');
      if (!el || !txt) return;
      txt.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    function norm(s) {
      return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function toggleStudied(viewId, evt) {
      if (evt) evt.stopPropagation();
      studied[viewId] = !studied[viewId];
      saveStudied();
      renderSidebar();
      renderMain();
      const v = VIEWS.find(x => x.id === viewId);
      showToast(studied[viewId] ? `"${v.shortTitle}" marcado como estudado.` : `"${v.shortTitle}" desmarcado.`);
    }

    function resetProgress() {
      studied = {};
      saveStudied();
      renderSidebar();
      renderMain();
      showToast('Progresso de estudo reiniciado.');
    }

    function toggleConcept(viewId, idx) {
      const key = `${viewId}-${idx}`;
      expandedCards[key] = !expandedCards[key];
      renderMain();

    function navigateTo(viewId) {
      currentView = viewId;

    function renderCap2() {
      const depth = ui.c2Depth; // 0 (Boca) .. 100 (Fundo)
      const probeY = Math.round(48 + (depth / 100) * 145);
      const wellMsg = depth < 35
        ? 'Boca do Poço (Economia de Mercado): zona viva, ruidosa e farta em arquivos (preços, câmaras de comércio). O perigo dos economistas clássicos (Turgot, Smith, Ricardo) é olhar só para cá e crer no mito da "mão invisível" onipotente.'
        : depth < 70
        ? 'Zona de Transição (Duplo Registro): os preços do mercado tocam a superfície da água, mas não penetram uniformemente toda a profundidade social — o mercado continua sendo uma ligação parcial.'
        : 'Fundo do Poço (Vida Material): imensa massa de água profunda (autoconsumo, hábitos seculares) que os preços do mercado tocam sem sempre agitar. Uma história econômica completa exige o duplo registro de Witold Kula.';

      const triadMap = {
        capital: { t: 'Capital (Realidade Tangível)', c: '#3E634E', d: 'Não apenas dinheiro, mas todos os bens de capital (casas, navios, campos limpos, estradas, grãos) efetivamente inseridos na produção renovada. Tesouro ocioso ou floresta inexplorada não são capital.' },
        capitalista: { t: 'Capitalista (O Agente)', c: '#C28728', d: 'O homem ou grupo que preside — ou procura presidir — à inserção estratégica do capital no processo incessante de produção e circulação.' },
        capitalismo: { t: 'Capitalismo (A Forma do Jogo)', c: '#8C2332', d: 'O modo como se conduz, para fins usualmente pouco altruístas, esse jogo constante de inserção, privilegiando a cúpula, a opacidade e o monopólio.' }
      };
      const tr = triadMap[ui.c2Triad];

      const setsMap = {
        economico: { t: 'Conjunto Econômico', c: '#C28728', d: 'Base material e redes de troca. O capitalismo flutua sobre a economia de mercado e depende de seu vigor subjacente (crítica a Schumpeter: o empresário não é um deus ex machina isolado).' },
        politico: { t: 'Conjunto Político (O Estado)', c: '#8C2332', d: 'O Estado moderno não criou o capitalismo, mas o herdou: ora o favorece, ora lhe quebra as molas. "O capitalismo só triunfa quando se identifica com o Estado, quando ele é o Estado" (Veneza, Holanda, Inglaterra pós-1688).' },
        cultural: { t: 'Conjunto Cultural / Religioso (Crítica a Max Weber)', c: '#1E354D', d: 'A religião diz "não" à usura, mas cede em aggiornamentos (Santo Tomás). Braudel refuta Max Weber: o protestantismo não inventou o capitalismo; o Norte apenas copiou o Mediterrâneo quando o centro de gravidade econômico migrou para o Atlântico.' },
        social: { t: 'Conjunto Social Hierárquico (As "Escadas")', c: '#3E634E', d: 'Acima da massa popular (Grundvolk de Sombart) erguem-se várias escadas (política, religiosa, militar, do dinheiro). O capitalismo precisa de uma hierarquia estável e de "longas famílias" para acumular.' }
      };
      const cs = setsMap[ui.c2Set];

      return `
        ${renderHeaderBlock('cap2', 'Capítulo II • 2ª Conferência', 'Os Jogos da Troca', 'A distinção decisiva entre Economia de Mercado e Capitalismo, a polivalência da cúpula e as condições sociais do triunfo capitalista.', '“O capitalismo não inventa as hierarquias, utiliza-as, do mesmo modo que não inventou o mercado ou o consumo. Ele é, na longa perspectiva da história, o visitante da noite. Chega quando tudo já está em seus devidos lugares.”', 'É indispensável separar conceitualmente a "economia de mercado" (troca transparente, concorrencial e de lucros moderados) do "capitalismo" (zona de cúpula, opaca, monopolista e polivalente), que só triunfa mediante a cumplicidade das hierarquias sociais e do Estado.')}

                <!-- Água Profunda (Vida Material) -->
                <rect x="72" y="84" width="236" height="130" fill="#D4E3DA"/>

    /* =========================================================================

    function renderCap3() {
      // 3.1 Zonas Concêntricas
      const zones = {
        nucleo: {
          title: '1. Núcleo / Centro (O Sol da História)',
          color: '#8C2332',
          desc: 'Região em torno da cidade dominante (ex.: Províncias Unidas com Amsterdam; Inglaterra com Londres). Concentra preços altos, salários altos, bancos, técnicas de ponta, ciência fundamental e "liberdades" relativas.'
        },
        intermediaria: {
          title: '2. Zonas Intermediárias (Concorrentes & Êmulos)',
          color: '#C28728',
          desc: 'Países vizinhos e rivais do centro (ex.: França do séc. XVIII diante da Inglaterra). Possuem menos homens livres, redes bancárias incompletas e nível de vida um tom abaixo ("Jacques Bonhomme" de tamancos vs. "John Bull").'
        },
        margem: {
          title: '3. Margens / Periferias ("Purgatório ou Inferno")',
          color: '#1E354D',
          desc: 'Mais subordinadas do que participantes na divisão do trabalho (ex.: Europa Oriental sob segunda servidão e Américas sob escravatura em 1650). Alimentam o centro que lhes dita a lei.'
        }
      };
      const zn = zones[ui.c3Zone];

      // 3.2 Relógio das Descentragens (7 marcos)
      const clockSteps = [
        { yr: 'Séc. XIII', city: 'Feiras de Champagne', type: 'Encruzilhada (Sem Cidade Dominante)', desc: 'Centro de gravidade entre a Itália e os Países Baixos: panos do Norte trocados por especiarias e crédito italianos. Declina com a rota marítima direta (1297) e a Peste Negra.' },
        { yr: '~1380', city: 'Veneza', type: 'Cidade-Estado (Dominação Urbana)', desc: 'Após derrotar Gênova em Chioggia (1381), reina por mais de um século redistribuindo os produtos do Levante e do Extremo Oriente para toda a Europa.' },
        { yr: '~1500', city: 'Antuérpia', type: 'Cidade-Estado (Dominação Urbana)', desc: 'Salto brusco para o Atlântico: torna-se o grande entreposto da pimenta portuguesa e do tráfego do Norte europeu, antes de sofrer com as guerras nos Países Baixos.' },
        { yr: '1550–1560', city: 'Gênova', type: 'Cidade-Estado (Dominação Urbana)', desc: '"Século dos Genoveses": controla o desvio da prata americana para o Mediterrâneo e o clearing financeiro europeu nas feiras de Piacenza, até ser abatida pela crise de 1620 e pela ofensiva nórdica.' },
        { yr: '1590–1610', city: 'Amsterdam', type: 'Última Cidade-Estado (Pólis)', desc: 'Estabiliza o centro europeu por quase dois séculos controlando simultaneamente os grãos/madeira do Báltico e o quase-monopólio das especiarias finas asiáticas.' },
        { yr: '1790–1815', city: 'Londres', type: '1º Mercado Nacional Unificado!', desc: 'VIRADA ESTRUTURAL: Londres não é uma cidade-Estado, mas a capital de um mercado nacional coerente (sem pedágios internos, cabotagem, Navigation Acts). Inicia a era das dominações nacionais.' },
        { yr: '1929', city: 'Nova Iorque', type: 'Mercado Continental / Mundial', desc: 'Atravessando o Atlântico em meio à grande crise de 1929, o centro econômico do mundo passa definitivamente de Londres para Nova Iorque (capital econômica, não Washington).' }
      ];
      const ck = clockSteps[ui.c3Clock];

      // 3.3 Revolução Industrial (6 Engrenagens)
      const isEng = ui.c3IndMode === 'inglaterra';
      const gears = [
        { k: 'agricultura', l: 'Agricultura', cx: 145, cy: 85, dir: 'cw', c: '#3E634E' },
        { k: 'trabalho', l: 'Mão-de-Obra', cx: 275, cy: 85, dir: 'ccw', c: '#C28728' },
        { k: 'interno', l: 'Merc. Interno', cx: 405, cy: 85, dir: 'cw', c: '#1E354D' },
        { k: 'tecnica', l: 'Técnica Artesanal', cx: 535, cy: 85, dir: 'ccw', c: '#8C2332' },
        { k: 'credito', l: 'Crédito / Capital', cx: 665, cy: 85, dir: 'cw', c: '#C28728' },
        { k: 'externo', l: 'Merc. Externos', cx: 405, cy: 175, dir: 'ccw', c: '#8C2332' }
      ];

      // 3.4 Três Invariantes
      const invs = {
        1: { t: '1. Vocação de Escala Mundial', d: 'Ontem como hoje, o capitalismo permanece fundado na exploração das disparidades e recursos internacionais. Sua grande tarefa constante é reconstituir esse universalismo.' },
        2: { t: '2. Vocação Monopolista (Diálogo Crítico com Lênin)', d: 'O capitalismo sempre se apoiou em monopólios de fato ou de direito. Contra a tese de Lênin (1917), Braudel mostra que mercadorias e capitais sempre viajaram juntos — a exportação de capitais já era cotidiana desde Florença no séc. XIII e Gênova no séc. XVI.' },
        3: { t: '3. Permanência dos Três Andares', d: 'Mesmo hoje, o capitalismo nunca engloba toda a sociedade: no térreo subsiste o autoconsumo e o artesanato; no meio, PMEs sob concorrência feroz; no topo, gigantes que fundem interesses acima do mercado.' }
      };
      const curInv = invs[ui.c3Inv];

      return `
        ${renderHeaderBlock('cap3', 'Capítulo III • 3ª Conferência', 'O Tempo do Mundo', 'Economias-mundos, zonas concêntricas, sincronismo das desigualdades, descentragens seculares e a Revolução Industrial sistêmica.', '“O capitalismo é uma criação da desigualdade do mundo; para desenvolver-se, necessita das conivências da economia internacional. É filho da organização autoritária de um espaço evidentemente desmedido.”', 'Reconstruindo o quebra-cabeça em escala planetária, Braudel demonstra que o capitalismo nasce e se expande dentro de "economias-mundos" hierarquizadas em zonas concêntricas, cujos pólos se deslocam por meio de crises — culminando na passagem das Cidades-Estados aos Mercados Nacionais e à Revolução Industrial.')}

        <!-- Infográfico 3.1: Economia-Mundo & Sincronismo -->

          <h3 class="section-heading">Economia-Mundo (<em>Weltwirtschaft</em>): Zonas Concêntricas</h3>
          <p class="section-lead">Enquanto <strong>Economia Mundial</strong> é o mercado do planeta inteiro, uma <strong>Economia-Mundo</strong> é uma porção autônoma ("um mundo em si mesmo") com limites, um pólo urbano e 3 zonas concêntricas. Clique nos anéis abaixo.</p>

                <text x="190" y="34" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="${ui.c3Zone==='margem' ? '#fff' : '#1E354D'}">MARGENS / PERIFERIAS</text>

                <!-- Anel 2: Zonas Intermediárias -->
                <circle cx="190" cy="135" r="82" fill="${ui.c3Zone==='intermediaria' ? '#C28728' : '#FBF2E1'}" stroke="#C28728" stroke-width="${ui.c3Zone==='intermediaria' ? 3.5 : 2}" onclick="ui.c3Zone='intermediaria'; renderMain();" style="cursor:pointer;"/>
                <text x="190" y="75" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="${ui.c3Zone==='intermediaria' ? '#fff' : '#8C5E14'}">ZONAS INTERMEDIÁRIAS</text>

                <!-- Anel 1: Núcleo / Centro -->
                <circle cx="190" cy="135" r="42" fill="${ui.c3Zone==='nucleo' ? '#8C2332' : '#F7E8EA'}" stroke="#8C2332" stroke-width="${ui.c3Zone==='nucleo' ? 3.5 : 2}" onclick="ui.c3Zone='nucleo'; renderMain();" style="cursor:pointer;"/>
                <text x="190" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="700" fill="${ui.c3Zone==='nucleo' ? '#fff' : '#631621'}">NÚCLEO</text>
                <text x="190" y="147" text-anchor="middle" font-family="monospace" font-size="8.5" fill="${ui.c3Zone==='nucleo' ? '#F4D59A' : '#8C2332'}">Pólo Urbano</text>
              </svg>
            </div>

            <div class="panel-soft" style="border-left:5px solid ${zn.color};">
              <span class="chip" style="border-color:${zn.color};color:${zn.color};margin-bottom:8px;">Anel Selecionado</span>
              <h4 style="font-family:var(--font-serif);font-size:1.12rem;color:${zn.color};margin-bottom:8px;">${zn.title}</h4>
              <p style="font-size:0.84rem;color:var(--text-main);">${zn.desc}</p>
            </div>
          </div>

          <!-- Alternador Modelo Linear vs. Sincrônico -->
          <div class="btn-row" style="margin-bottom:10px;">
            <button type="button" class="ctrl-btn ${ui.c3Model==='linear' ? 'active-navy' : ''}" onclick="ui.c3Model='linear'; renderMain();">Modelo Linear Tradicional (Sucessivo)</button>
            <button type="button" class="ctrl-btn ${ui.c3Model==='sincronico' ? 'active-bordo' : ''}" onclick="ui.c3Model='sincronico'; renderMain();">Modelo Sincrônico (Braudel / Wallerstein — 1650)</button>
          </div>
          <div class="panel-soft" style="border-left:4px solid ${ui.c3Model==='sincronico' ? 'var(--bordo)' : 'var(--navy)'};">
            ${ui.c3Model === 'sincronico' ? `
              <strong style="font-family:var(--font-serif);color:var(--bordo-dark);">Simultaneidade Estrutural (1650):</strong>
              <p style="font-size:0.83rem;color:var(--text-main);margin-top:4px;">
                Em vez de etapas sucessivas, a economia-mundo europeia de 1650 <strong>sobrepõe ao mesmo tempo</strong>: <strong>Capitalismo</strong> no centro (Holanda) + <strong>Segunda Servidão</strong> induzida no Leste europeu + <strong>Escravatura</strong> reinventada nas Américas. As periferias alimentam o centro.
              </p>
            ` : `
              <strong style="font-family:var(--font-serif);color:var(--navy);">Esquema Linear Clássico (Questionado):</strong>
              <p style="font-size:0.83rem;color:var(--text-main);margin-top:4px;">
                <em>Escravatura → Servidão → Capitalismo</em> como estágios separados que se substituem no tempo. Braudel mostra que esse esquema oculta como o capitalismo europeu precisou recriar trabalho servil e escravo nas margens do mundo.
              </p>
            `}
          </div>
        </section>

        <!-- Infográfico 3.2: O Relógio das Descentragens e Recentragens -->
        <section class="infographic-card">
          <span class="kicker" style="color:var(--bordo);">Infográfico 3.2 • Sucessão de Hegemonias</span>
          <h3 class="section-heading">O Relógio das Descentragens e Recentragens</h3>
          <p class="section-lead">Clique em cada marco do relógio histórico para acompanhar o deslocamento dos centros de gravidade — e a grande ruptura entre <strong>Cidades-Estados</strong> e <strong>Mercados Nacionais</strong>.</p>

          <div class="svg-stage">
            <svg viewBox="0 0 820 175" role="img" aria-label="Arco cronológico das descentragens de Champagne a Nova Iorque">
              <!-- Linha de base / arco -->
              <line x1="55" y1="88" x2="765" y2="88" stroke="#C6B89E" stroke-width="4"/>
              <!-- Divisória estrutural Cidade-Estado vs Mercado Nacional -->
              <line x1="588" y1="18" x2="588" y2="162" stroke="#8C2332" stroke-width="2" stroke-dasharray="5 4"/>
              <text x="310" y="26" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#8C5E14">ERA DAS CIDADES-ESTADOS (ATÉ ~1750)</text>
              <text x="702" y="26" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#8C2332">MERCADOS NACIONAIS</text>

              ${clockSteps.map((st, idx) => {
                const px = Math.round(65 + idx * 114);
                const act = ui.c3Clock === idx;
                const isNat = idx >= 5;
                const col = isNat ? '#8C2332' : '#1E354D';
                return `
                  <g onclick="ui.c3Clock=${idx}; renderMain();" style="cursor:pointer;">
                    <circle cx="${px}" cy="88" r="${act ? 18 : 12}" fill="${act ? col : '#FFFDF8'}" stroke="${col}" stroke-width="3"/>
                    <text x="${px}" y="60" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="${act ? col : '#575046'}">${st.yr}</text>
                    <text x="${px}" y="124" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="${act ? col : '#1E1B18'}">${st.city.replace('Feiras de ','')}</text>
                  </g>
                `;
              }).join('')}
            </svg>
          </div>

          <div class="panel-soft" style="border-left:4px solid ${ui.c3Clock >= 5 ? 'var(--bordo)' : 'var(--navy)'};">
            <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:6px;">
              <strong style="font-family:var(--font-serif);font-size:1.12rem;">${ck.yr} — ${ck.city}</strong>
              <span class="chip ${ui.c3Clock >= 5 ? 'chip-bordo' : 'chip-navy'}">${ck.type}</span>
            </div>
            <p style="font-size:0.84rem;color:var(--text-main);">${ck.desc}</p>
            <p style="font-size:0.78rem;color:var(--text-muted);margin-top:8px;"><em>Regra das Crises:</em> Uma crise econômica prolongada atua como provação — os centros fortes resistem e se fortalecem; os centros ameaçados sucumbem, abrindo espaço à recentragem.</p>
          </div>
        </section>

        <!-- Infográfico 3.3: A Engrenagem da Revolução Industrial -->
        <section class="infographic-card">
          <span class="kicker" style="color:var(--olive);">Infográfico 3.3 • Processo Lento e de Conjunto</span>
          <h3 class="section-heading">A Engrenagem da Revolução Industrial</h3>
          <p class="section-lead">Alterne entre <strong>Revoluções Abortadas</strong> (quando uma engrenagem trava e gera estrangulamento) e <strong>Inglaterra em Sintonia Global</strong> (quando todos os setores respondem em conjunto).</p>

          <div class="btn-row">
            <button type="button" class="ctrl-btn ${isEng ? 'active-olive' : ''}" onclick="ui.c3IndMode='inglaterra'; renderMain();">✓ Modo Inglaterra (Sintonia Global)</button>
            <button type="button" class="ctrl-btn ${!isEng ? 'active-bordo' : ''}" onclick="ui.c3IndMode='abortada'; renderMain();">✕ Modo Revoluções Abortadas (Estrangulamento)</button>
          </div>

          ${!isEng ? `
            <div class="btn-row" style="margin-bottom:12px;">
              <span style="font-size:0.78rem;color:var(--text-muted);align-self:center;margin-right:4px;">Qual engrenagem travou?</span>
              ${gears.map(g => `
                <button type="button" class="ctrl-btn ${ui.c3JamGear===g.k ? 'active-bordo' : ''}" style="padding:5px 10px;font-size:0.73rem;" onclick="ui.c3JamGear='${g.k}'; renderMain();">${g.l}</button>
              `).join('')}
            </div>
          ` : ''}

          <div class="svg-stage">
            <svg viewBox="0 0 820 245" role="img" aria-label="Seis engrenagens acopladas representando a Revolução Industrial sistêmica">
              <!-- Conexões estruturais -->
              <line x1="145" y1="85" x2="665" y2="85" stroke="#DFD5C3" stroke-width="6"/>
              <line x1="405" y1="85" x2="405" y2="175" stroke="#DFD5C3" stroke-width="6"/>

              ${gears.map(g => {
                const jammed = !isEng && ui.c3JamGear === g.k;
                const cls = isEng ? (g.dir === 'cw' ? 'gear-cw' : 'gear-ccw') : 'gear-jammed';
                const strokeCol = jammed ? '#8C2332' : g.c;
                const fillCol = jammed ? '#F7E8EA' : '#FFFDF8';
                return `
                  <g>
                    <g class="${cls}">
                      <circle cx="${g.cx}" cy="${g.cy}" r="42" fill="${fillCol}" stroke="${strokeCol}" stroke-width="4" stroke-dasharray="10 6"/>
                      <circle cx="${g.cx}" cy="${g.cy}" r="28" fill="none" stroke="${strokeCol}" stroke-width="1.6"/>
                    </g>
                    <text x="${g.cx}" y="${g.cy + 3}" text-anchor="middle" font-family="sans-serif" font-size="9.5" font-weight="700" fill="${jammed ? '#8C2332' : '#1E1B18'}">${g.l}</text>
                    ${jammed ? `<text x="${g.cx}" y="${g.cy + 16}" text-anchor="middle" font-family="monospace" font-size="8" font-weight="700" fill="#8C2332">TRAVADA!</text>` : ''}
                  </g>
                `;
              }).join('')}

              <text x="640" y="180" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="${isEng ? '#3E634E' : '#8C2332'}">
                ${isEng ? 'SINTONIA: INTERNO + EXTERNO' : 'MOTOR ENGUIÇADO POR GARGALO'}
              </text>
            </svg>
          </div>

          <div class="panel-soft" style="border-left:4px solid ${isEng ? 'var(--olive)' : 'var(--bordo)'};">
            <p style="font-size:0.84rem;color:var(--text-main);">
              ${isEng
                ? '<strong>Sintonia Global Inglesa:</strong> A revolução do algodão nasceu da vida comum e dos artesãos (não de Londres, que só assume o controle após 1830). Agricultura, mão-de-obra, mercado interno, técnica e crédito responderam sem gargalos, realimentados pelos mercados externos. <em>Causas internas e externas são inseparáveis: "não explora o mundo quem quer".</em>'
                : '<strong>Revoluções Abortadas:</strong> Como o vapor no Egito ptolemaico, o coque na China do séc. XIV ou a industrialização difícil no Terceiro Mundo, basta um único gargalo (agricultura atrasada, mercado interno estreito, técnica inadequada ou mercado externo hostil) para travar toda a engrenagem.'}
            </p>
          </div>
        </section>

        <!-- Infográfico 3.4: Três Invariantes e Horizonte da História -->
        <section class="infographic-card">
          <span class="kicker" style="color:var(--bordo);">Infográfico 3.4 • Síntese &amp; Tempo Presente</span>
          <h3 class="section-heading">As Três Invariantes do Capitalismo e o Horizonte da História</h3>
          <p class="section-lead">O capitalismo mudou de escala, mas não de natureza. Explore as 3 provas de Braudel e seu duplo recado final como cidadão e historiador.</p>

          <div class="grid-3" style="margin-bottom:14px;">
            ${[1, 2, 3].map(n => `
              <button type="button" class="ctrl-btn ${ui.c3Inv===n ? 'active-bordo' : ''}" style="text-align:left;padding:12px;" onclick="ui.c3Inv=${n}; renderMain();">
                ${invs[n].t}
              </button>
            `).join('')}
          </div>

          <div class="panel-soft" style="border-left:4px solid var(--bordo);margin-bottom:18px;">
            <strong style="font-family:var(--font-serif);font-size:1.06rem;color:var(--bordo-dark);">${curInv.t}</strong>
            <p style="font-size:0.84rem;color:var(--text-main);margin-top:5px;">${curInv.d}</p>
          </div>

          <div class="grid-2">
            <div class="panel-soft" style="border-top:3px solid var(--gold);">
              <span class="chip chip-gold" style="margin-bottom:6px;">Crítica Política Contemporânea</span>
              <h4 style="font-family:var(--font-serif);font-size:1rem;margin-bottom:5px;">Não Confundir Mercado e Capitalismo</h4>
              <p style="font-size:0.81rem;color:var(--text-main);">Braudel lamenta que tanto o mundo capitalista (justificando monopólios como preço da livre empresa) quanto o socialista (destruindo o mercado junto com o capitalismo) recusem separar os dois patamares.</p>
            </div>
            <div class="panel-soft" style="border-top:3px solid var(--navy);">
              <span class="chip chip-navy" style="margin-bottom:6px;">Desafio Metodológico aos Historiadores</span>
              <h4 style="font-family:var(--font-serif);font-size:1rem;margin-bottom:5px;">Unir Fluxos (Renda) + Estoques (Patrimônio)</h4>
              <p style="font-size:0.81rem;color:var(--text-main);">Para construir uma história econômica totalizante, é preciso integrar a contabilidade nacional de fluxos (Kuznets, renda <em>per capita</em>) com a medida dos patrimônios nacionais. <em>"Haverá sempre uma América a descobrir."</em></p>
            </div>
          </div>
        </section>

        ${renderConceptsGrid('cap3', '#1E354D')}
        ${renderFooterNav('cap2', 'overview', 'Voltar ao Mapa Geral — O Edifício de Três Andares')}
      `;
    }

    /* =========================================================================
       COMPONENTES REUTILIZÁVEIS (CABEÇALHO, CONCEITOS EXPANSÍVEIS, RODAPÉ)
       ========================================================================= */

    function renderHeaderBlock(viewId, pillText, title, subtitle, epigraph, thesis) {
      const v = VIEWS.find(x => x.id === viewId);
      const isDone = !!studied[viewId];
      return `
        <header class="chapter-header">
          <div class="meta-row">
            <span class="part-pill" style="background:${v.color};">${pillText}</span>
            <button type="button" class="study-btn ${isDone ? 'studied' : ''}" onclick="toggleStudied('${viewId}')">
              <span>${isDone ? '✓' : '○'}</span>
              <span>${isDone ? 'Estudado' : 'Marcar como estudado'}</span>
            </button>
          </div>
          <h2 class="chapter-title">${title}</h2>
          <p class="chapter-subtitle">${subtitle}</p>
          <div class="editorial-stripe"></div>
        </header>

        <section class="thesis-card" style="border-left-color:${v.color};">
          <p class="epigraph">${epigraph}</p>
          <span class="kicker" style="color:${v.color};">Tese Central</span>
          <p class="thesis-text">${thesis}</p>
        </section>
      `;
    }

    function renderConceptsGrid(viewId, accentColor) {
      const list = CONCEPTS[viewId] || [];
      return `
        <section>
          <span class="kicker" style="color:${accentColor};">Glossário Interativo (Clique em cada cartão para expandir)</span>
          <h3 class="section-heading">Conceitos-Chave desta Seção</h3>
          <div class="concepts-grid">
            ${list.map((c, idx) => {
              const exp = !!expandedCards[`${viewId}-${idx}`];
              return `
                <button type="button" class="concept-card ${exp ? 'expanded' : ''}" onclick="toggleConcept('${viewId}', ${idx})">
                  <div class="concept-top">
                    <span class="concept-tag" style="color:${accentColor};">${c.tag}</span>
                    <span class="concept-icon" aria-hidden="true">${exp ? '−' : '+'}</span>
                  </div>
                  <h4>${c.name}</h4>
                  <p class="concept-def">${c.def}</p>
                  ${exp ? `
                    <div class="concept-extra">
                      <p><strong style="color:var(--bordo-dark);">Oposição conceitual:</strong> ${c.opp}</p>
                      <p><strong style="color:var(--navy);">Papel na dinâmica histórica:</strong> ${c.role}</p>
                    </div>
                  ` : ''}
                </button>
              `;
            }).join('')}
          </div>
        </section>
      `;
    }

    function renderFooterNav(prevId, nextId, nextLabel) {
      const prevObj = prevId ? VIEWS.find(v => v.id === prevId) : null;
      return `
        <nav class="chapter-footer" aria-label="Navegação entre seções">
          ${prevObj ? `
            <button type="button" class="step-btn" onclick="navigateTo('${prevObj.id}')">
              <span style="font-size:1.15rem;color:var(--bordo);">←</span>
              <div>
                <span class="step-meta">Anterior</span>
                <span class="step-title">${prevObj.shortTitle}</span>
              </div>
            </button>
          ` : '<div></div>'}

          <button type="button" class="step-btn next" onclick="navigateTo('${nextId}')">
            <div>
              <span class="step-meta">${nextId === 'overview' ? 'Concluir Percurso' : 'Próxima Seção'}</span>
              <span class="step-title">${nextLabel}</span>
            </div>
            <span style="font-size:1.15rem;">${nextId === 'overview' ? '↺' : '→'}</span>
          </button>
        </nav>
      `;
    }

    function renderMain() {
      const el = document.getElementById('main-content');
      if (!el) return;
      if (currentView === 'overview') el.innerHTML = renderOverview();
      else if (currentView === 'cap1') el.innerHTML = renderCap1();
      else if (currentView === 'cap2') el.innerHTML = renderCap2();
      else if (currentView === 'cap3') el.innerHTML = renderCap3();
      else el.innerHTML = renderOverview();
    }

    /* =========================================================================
       INICIALIZAÇÃO
       ========================================================================= */

    document.addEventListener('DOMContentLoaded', () => {
      try {
        document.getElementById('open-drawer-btn').addEventListener('click', openDrawer);
        document.getElementById('close-drawer-btn').addEventListener('click', closeDrawer);
        document.getElementById('sidebar-overlay').addEventListener('click', closeDrawer);
        document.getElementById('reset-progress-btn').addEventListener('click', resetProgress);

        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');

        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          searchClear.classList.toggle('visible', searchQuery.length > 0);
          renderSidebar();
        });

        searchClear.addEventListener('click', () => {
          searchQuery = '';
          searchInput.value = '';
          searchClear.classList.remove('visible');
          renderSidebar();
          searchInput.focus();
        });

        renderSidebar();
        renderMain();
      } catch (err) {
        console.error('Erro ao inicializar o Atlas de Braudel:', err);
      }
    });
  </script>
</body>
</html>
