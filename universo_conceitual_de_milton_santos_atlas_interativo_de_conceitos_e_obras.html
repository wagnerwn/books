<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universo Conceitual de Milton Santos — Atlas Interativo de Conceitos e Obras</title>
  <style>
    /* =========================================================================
       IDENTIDADE VISUAL — COLEÇÃO MILTON SANTOS (EDUSP)
       ========================================================================= */
    :root {
      --bg-paper: #F6F2E9;
      --bg-card: #FFFDF8;
      --bg-soft: #EFE9DC;
      --border-soft: #DDD4C4;
      --border-strong: #C5B9A4;

      --petrol: #18444C;
      --petrol-dark: #103036;
      --petrol-soft: #E5F0F2;

      --terra: #B85332;
      --terra-dark: #8C3B20;
      --terra-soft: #FBECE6;

      --ochre: #C68829;
      --ochre-dark: #8F5F14;
      --ochre-soft: #FBF3E2;

      --olive: #3B664C;
      --olive-dark: #284835;
      --olive-soft: #E7F1EB;

      --text-main: #1C242B;
      --text-muted: #4E5963;

      --font-serif: Georgia, 'Times New Roman', Cambria, serif;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --sidebar-w: 312px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 10px rgba(24, 68, 76, 0.06);
      --shadow-md: 0 12px 30px rgba(28, 36, 43, 0.09);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg-paper);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
      background-image:
        radial-gradient(rgba(24, 68, 76, 0.045) 1px, transparent 0),
        linear-gradient(rgba(184, 83, 50, 0.025) 1px, transparent 1px);
      background-size: 26px 26px;
      overflow-x: hidden;
    }

    button, input { font-family: inherit; }
    button { cursor: pointer; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -28; }
    }
    .flow-line {
      stroke-dasharray: 7 5;
      animation: dashMove 1.4s linear infinite;
    }

    /* =========================================================================
       ESTRUTURA PRINCIPAL & SIDEBAR
       ========================================================================= */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Cabeçalho Mobile */
    .mobile-topbar {
      display: none;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(246, 242, 233, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 2px solid var(--petrol);
      padding: 10px 14px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--petrol);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.16s ease;
    }
    .icon-btn:hover { background: var(--petrol-soft); border-color: var(--petrol); }

    .mobile-brand {
      text-align: center;
      flex: 1;
      min-width: 0;
    }
    .mobile-brand strong {
      display: block;
      font-family: var(--font-serif);
      font-size: 0.96rem;
      color: var(--petrol-dark);
      line-height: 1.15;
    }
    .mobile-brand span {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--terra);
    }

    .mobile-pill {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--petrol-soft);
      color: var(--petrol-dark);
      border: 1px solid rgba(24, 68, 76, 0.28);
      white-space: nowrap;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(28, 36, 43, 0.48);
      z-index: 45;
    }
    .sidebar-overlay.open { display: block; }

    /* Barra Lateral */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--bg-card);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: transform 0.25s ease;
    }

    .sidebar-header {
      padding: 18px 18px 14px;
      background: linear-gradient(155deg, var(--petrol) 0%, var(--petrol-dark) 75%, #232A2E 100%);
      color: #F6F2E9;
      position: relative;
      border-bottom: 4px solid var(--terra);
    }

    .edition-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(198, 136, 41, 0.28);
      border: 1px solid rgba(251, 243, 226, 0.28);
      color: #FBF3E2;
      margin-bottom: 7px;
    }

    .sidebar-title {
      font-family: var(--font-serif);
      font-size: 1.26rem;
      font-weight: 700;
      line-height: 1.18;
      color: #FFFFFF;
    }

    .sidebar-sub {
      font-size: 0.74rem;
      color: rgba(246, 242, 233, 0.86);
      margin-top: 3px;
    }

    .close-drawer-btn {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    /* Progresso */
    .progress-wrap {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.71rem;
      margin-bottom: 5px;
      color: rgba(246, 242, 233, 0.92);
    }
    .progress-meta strong {
      font-family: var(--font-mono);
      color: #F3D18E;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--ochre), #F2C97D);
      transition: width 0.3s ease;
    }

    /* Busca Instantânea */
    .search-box {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-soft);
      background: #F3EDE0;
    }
    .search-wrap { position: relative; }
    .search-input {
      width: 100%;
      padding: 8px 28px 8px 30px;
      font-size: 0.79rem;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.16s, box-shadow 0.16s;
    }
    .search-input:focus {
      border-color: var(--petrol);
      box-shadow: 0 0 0 3px rgba(24, 68, 76, 0.12);
    }
    .search-icon {
      position: absolute;
      left: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-clear {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }
    .search-clear.visible { display: inline-flex; }
    .search-clear:hover { background: var(--border-soft); color: var(--text-main); }

    /* 3 Abas no Menu Lateral */
    .sidebar-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 8px 10px;
      background: #EFE9DC;
      border-bottom: 1px solid var(--border-soft);
    }
    .tab-btn {
      padding: 7px 4px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.71rem;
      font-weight: 700;
      text-align: center;
      transition: all 0.16s ease;
    }
    .tab-btn:hover { background: rgba(255, 253, 248, 0.65); color: var(--text-main); }
    .tab-btn.active {
      background: var(--bg-card);
      color: var(--petrol-dark);
      border-color: var(--border-strong);
      box-shadow: 0 1px 4px rgba(24, 68, 76, 0.08);
    }

    /* Lista Navegável da Sidebar */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 10px 10px 18px;
    }

    .axis-group { margin-top: 10px; }
    .axis-group:first-child { margin-top: 2px; }
    .axis-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px 6px;
      font-family: var(--font-mono);
      font-size: 0.61rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .axis-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .nav-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 7px 9px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--text-main);
      transition: all 0.15s ease;
      margin-bottom: 3px;
    }
    .nav-item:hover { background: var(--bg-paper); border-color: var(--border-soft); }
    .nav-item.active { background: var(--petrol-soft); border-color: rgba(24, 68, 76, 0.35); }

    .nav-num {
      flex-shrink: 0;
      min-width: 26px;
      height: 22px;
      padding: 0 5px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-paper);
      color: var(--text-muted);
      border: 1px solid var(--border-soft);
      margin-top: 1px;
    }
    .nav-item.active .nav-num {
      background: var(--petrol);
      color: #FFFFFF;
      border-color: var(--petrol);
    }

    .nav-label { flex: 1; min-width: 0; }
    .nav-label-title {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-main);
    }
    .nav-item.active .nav-label-title { color: var(--petrol-dark); }
    .nav-label-sub {
      display: block;
      font-size: 0.66rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .nav-check {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.62rem;
      color: transparent;
      margin-top: 2px;
      transition: all 0.15s ease;
    }
    .nav-check.done {
      background: var(--olive);
      border-color: var(--olive);
      color: #FFFFFF;
    }

    .sidebar-footer {
      padding: 9px 14px;
      border-top: 1px solid var(--border-soft);
      background: #F3EDE0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      color: var(--text-muted);
    }
    .reset-btn {
      background: transparent;
      border: none;
      color: var(--terra);
      font-weight: 600;
      font-size: 0.68rem;
      text-decoration: underline;
    }

    /* =========================================================================
       CONTEÚDO PRINCIPAL
       ========================================================================= */
    .main-area {
      flex: 1;
      min-width: 0;
      padding: 30px 36px 64px;
    }

    .page-container {
      max-width: 1020px;
      margin: 0 auto;
      animation: fadeUp 0.25s ease-out;
    }

    /* Cabeçalho */
    .page-header { margin-bottom: 22px; }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
    }
    .axis-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      border-radius: 999px;
      color: #FFFFFF;
    }

    .study-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.79rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      transition: all 0.16s ease;
    }
    .study-btn:hover { border-color: var(--olive); color: var(--olive); }
    .study-btn.studied { background: var(--olive); border-color: var(--olive); color: #FFFFFF; }

    .page-title {
      font-family: var(--font-serif);
      font-size: clamp(1.65rem, 3vw, 2.38rem);
      font-weight: 700;
      line-height: 1.16;
      color: var(--text-main);
    }

    .page-subtitle {
      font-size: 0.96rem;
      color: var(--text-muted);
      margin-top: 7px;
      max-width: 840px;
    }

    .editorial-stripe {
      height: 5px;
      width: 100%;
      margin: 16px 0 22px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--petrol) 0%, var(--petrol) 34%, var(--terra) 34%, var(--terra) 67%, var(--ochre) 67%, var(--ochre) 100%);
    }

    /* Blocos */
    .def-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-left: 5px solid var(--petrol);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }
    .def-text {
      font-size: 0.94rem;
      color: var(--text-main);
      line-height: 1.66;
    }
    .quote-inline {
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-strong);
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 0.95rem;
      color: var(--petrol-dark);
    }

    .infographic-card {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 24px 26px;
      box-shadow: var(--shadow-md);
      margin-bottom: 26px;
    }

    .kicker {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--petrol);
      margin-bottom: 4px;
    }
    .section-heading {
      font-family: var(--font-serif);
      font-size: 1.36rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.24;
      margin-bottom: 5px;
    }
    .section-lead {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      max-width: 820px;
    }

    /* Controles */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .ctrl-btn {
      padding: 8px 13px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-paper);
      color: var(--text-main);
      font-size: 0.79rem;
      font-weight: 600;
      transition: all 0.16s ease;
    }
    .ctrl-btn:hover { border-color: var(--petrol); background: var(--petrol-soft); }
    .ctrl-btn.active-petrol { background: var(--petrol); color: #fff; border-color: var(--petrol); }
    .ctrl-btn.active-terra { background: var(--terra); color: #fff; border-color: var(--terra); }
    .ctrl-btn.active-ochre { background: var(--ochre); color: #fff; border-color: var(--ochre); }
    .ctrl-btn.active-olive { background: var(--olive); color: #fff; border-color: var(--olive); }

    .panel-soft {
      background: #F6F1E6;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 16px 18px;
    }

    .svg-stage {
      width: 100%;
      background: #FAF7F0;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 12px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .svg-stage svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Sliders */
    input[type="range"].atlas-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: var(--border-soft);
      outline: none;
    }
    input[type="range"].atlas-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--petrol);
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(24, 68, 76, 0.35);
      cursor: pointer;
    }
    input[type="range"].atlas-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--petrol);
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(24, 68, 76, 0.35);
      cursor: pointer;
    }

    /* Grids */
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }

    /* Chips & Links Cruzados */
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-main);
    }
    .chip-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      transition: all 0.16s ease;
    }
    .chip-btn:hover {
      border-color: var(--petrol);
      background: var(--petrol-soft);
      color: var(--petrol-dark);
      transform: translateY(-1px);
    }

    .rel-card {
      text-align: left;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .rel-card:hover {
      border-color: var(--terra);
      background: #FFFBF8;
      transform: translateY(-2px);
    }
    .rel-card strong {
      font-family: var(--font-serif);
      font-size: 0.98rem;
      color: var(--petrol-dark);
    }
    .rel-card span {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.48;
    }

    /* Tabelas */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.81rem;
      background: var(--bg-card);
    }
    .data-table th, .data-table td {
      padding: 9px 11px;
      border-bottom: 1px solid var(--border-soft);
      text-align: left;
      vertical-align: top;
    }
    .data-table th {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      background: #F3EDE0;
      color: var(--petrol-dark);
    }

    /* Medidores */
    .meter-item { margin-bottom: 10px; }
    .meter-item:last-child { margin-bottom: 0; }
    .meter-head {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .meter-head span:last-child { font-family: var(--font-mono); }
    .meter-track {
      width: 100%;
      height: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* Rodapé de Navegação */
    .page-footer {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--border-soft);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: stretch;
      gap: 12px;
    }
    .step-btn {
      flex: 1;
      min-width: 220px;
      max-width: 390px;
      padding: 12px 16px;

    /* =========================================================================
       PERSISTÊNCIA E UTILITÁRIOS

    function loadStudied() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }
    function saveStudied() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(studied)); } catch (e) {}
    }

    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      const txt = document.getElementById('toast-msg');
      if (!el || !txt) return;
      txt.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
    }

    function norm(s) {
      return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function toggleStudied(key, label, evt) {
      if (evt) evt.stopPropagation();
      studied[key] = !studied[key];
      saveStudied();
      renderSidebar();
      renderMain();
      showToast(studied[key] ? `"${label}" marcado como estudado.` : `"${label}" desmarcado.`);
    }

    function resetProgress() {
      studied = {};
      saveStudied();
      renderSidebar();
      renderMain();
      showToast('Progresso de estudo reiniciado.');
    }

    function setSidebarTab(tab) {
      sidebarTab = tab;
      if (tab === 'map' && !searchQuery.trim()) {
        currentView = { type: 'map', id: 'map' };
        renderMain();
      }
      renderSidebar();
    }

    function openConcept(id) {
      currentView = { type: 'concept', id };
      sidebarTab = 'concepts';
      renderSidebar();
      renderMain();
      closeDrawer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openWork(id) {
      currentView = { type: 'work', id };
      sidebarTab = 'works';
      if (ui.workPart[id] === undefined) ui.workPart[id] = 0;
      renderSidebar();
      renderMain();
      closeDrawer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openMap() {
      currentView = { type: 'map', id: 'map' };
      sidebarTab = 'map';
      renderSidebar();
      renderMain();
      closeDrawer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openDrawer() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebar-overlay').classList.add('open');
    }
    function closeDrawer() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('open');
    }

    function getConcept(id) { return CONCEPTS.find(c => c.id === id); }
    function getWork(id) { return WORKS.find(w => w.id === id); }

      const q = norm(searchQuery.trim());

      const doneCount = [...CONCEPTS.map(c => c.id), ...WORKS.map(w => w.id)].filter(k => studied[k]).length;
      const pct = Math.round((doneCount / totalItems) * 100);
      document.getElementById('sidebar-progress-text').textContent = `${doneCount}/${totalItems} (${pct}%)`;
      document.getElementById('sidebar-progress-fill').style.width = `${pct}%`;
      document.getElementById('mobile-pill').textContent = `${doneCount}/${totalItems}`;

      // Atualizar abas
      ['map', 'concepts', 'works'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (el) el.classList.toggle('active', sidebarTab === t);
      });

      // Se houver busca ativa, mostra resultados combinados de conceitos e obras
      if (q) {
        const mConcepts = CONCEPTS.filter(c => norm(`${c.num} ${c.title} ${c.def}`).includes(q));
        const mWorks = WORKS.filter(w => norm(`${w.year} ${w.title} ${w.subtitle} ${w.thesis}`).includes(q));

        if (!mConcepts.length && !mWorks.length) {
          nav.innerHTML = `<div style="padding:18px;font-size:0.8rem;color:var(--text-muted);text-align:center;">Nenhum resultado para "<strong>${searchQuery}</strong>".</div>`;
          return;
        }

        let html = '';
        if (mConcepts.length) {
          html += `<div class="axis-header"><span class="axis-dot" style="background:var(--petrol)"></span><span>Conceitos (${mConcepts.length})</span></div>`;
          mConcepts.forEach(c => html += renderConceptNavItem(c));

          html += `<div class="axis-header" style="margin-top:10px;"><span class="axis-dot" style="background:var(--terra)"></span><span>Obras (${mWorks.length})</span></div>`;
          mWorks.forEach(w => html += renderWorkNavItem(w));
        }
        nav.innerHTML = html;
        return;
      }

        nav.innerHTML = `

              <span class="nav-label-sub">Grafo interativo de 18 conceitos &amp; 4 eixos</span>

          </button>
          <div class="panel-soft" style="margin-top:10px;padding:12px 13px;">
            <span class="kicker" style="margin-bottom:6px;">4 Eixos Epistemológicos</span>

    function renderConceptNavItem(c) {

    function renderWorkNavItem(w) {

    /* =========================================================================

       ========================================================================= */

    function renderMapScreen() {
      const filter = ui.mapAxisFilter;
      const sel = getConcept(ui.mapSelected) || CONCEPTS[0];
      const selAxis = AXES[sel.axis];
      const directIds = new Set([sel.id, ...sel.relations.map(r => r.id)]);

      // Construir arestas únicas
      const edges = [];
      const seen = new Set();
      CONCEPTS.forEach(c => {
        c.relations.forEach(r => {
          const pair = [c.id, r.id].sort().join('-');
          if (!seen.has(pair)) {
            seen.add(pair);
            const target = getConcept(r.id);
            if (target) edges.push({ a: c, b: target });
          }
        });
      });

      const tl = TIMELINE[ui.timelineStep];

      return `

          <div class="meta-row">

              <button type="button" class="ctrl-btn ${filter===ax.id ? (ax.id==='e1'?'active-petrol':ax.id==='e2'?'active-terra':ax.id==='e3'?'active-ochre':'active-olive') : ''}"
                onclick="ui.mapAxisFilter='${ax.id}'; renderMain();">${ax.roman}: ${ax.title}</button>
            `).join('')}
          </div>

          <div class="svg-stage">
            <svg viewBox="0 0 940 440" role="img" aria-label="Constelação interativa dos 18 conceitos de Milton Santos">
              <!-- Fundos suaves dos 4 eixos -->
              <rect x="18" y="16" width="265" height="288" rx="16" fill="#E5F0F2" opacity="${filter==='all'||filter==='e1'?0.55:0.15}"/>
              <text x="32" y="38" font-family="monospace" font-size="10" font-weight="700" fill="#18444C">EIXO I • ONTOLOGIA</text>

              <rect x="296" y="16" width="235" height="288" rx="16" fill="#FBECE6" opacity="${filter==='all'||filter==='e2'?0.55:0.15}"/>

              <rect x="544" y="16" width="378" height="296" rx="16" fill="#FBF3E2" opacity="${filter==='all'||filter==='e3'?0.58:0.15}"/>
              <text x="558" y="38" font-family="monospace" font-size="10" font-weight="700" fill="#8F5F14">EIXO III • TÉCNICA, REDES E GLOBALIZAÇÃO</text>

              <rect x="115" y="324" width="765" height="100" rx="16" fill="#E7F1EB" opacity="${filter==='all'||filter==='e4'?0.58:0.15}"/>
              <text x="132" y="344" font-family="monospace" font-size="10" font-weight="700" fill="#3B664C">EIXO IV • ECONOMIA, TERRITÓRIO E CIDADANIA</text>

              <!-- Arestas -->
              ${edges.map(e => {
                const touchesSel = e.a.id === sel.id || e.b.id === sel.id;

                const op = touchesSel ? 0.95 : (matchFilter ? 0.25 : 0.06);
                return `<line x1="${e.a.gx}" y1="${e.a.gy}" x2="${e.b.gx}" y2="${e.b.gy}"
                  stroke="${touchesSel ? selAxis.color : '#6C757D'}"

                  opacity="${op}"/>`;
              }).join('')}

              <!-- Nós (18 conceitos) -->
              ${CONCEPTS.map(c => {
                const ax = AXES[c.axis];
                const isSel = c.id === sel.id;
                const isNeighbor = directIds.has(c.id);
                const visibleByFilter = filter === 'all' || c.axis === filter;
                const op = isSel || isNeighbor ? 1 : (visibleByFilter ? 0.85 : 0.2);
                return `
                  <g onclick="ui.mapSelected='${c.id}'; renderMain();" style="cursor:pointer;" opacity="${op}">
                    <circle cx="${c.gx}" cy="${c.gy}" r="${isSel ? 22 : (isNeighbor ? 17 : 14)}"

                Abrir Explicação Visual do Conceito →

            </div>
            <p style="font-size:0.85rem;color:var(--text-main);margin-bottom:12px;">${sel.def}</p>

            <span class="kicker" style="color:${selAxis.color};">Como se relaciona diretamente com...</span>
            <div class="grid-2" style="margin-top:6px;">
              ${sel.relations.map(r => {
                const tc = getConcept(r.id);
                return `
                  <button type="button" class="rel-card" onclick="openConcept('${tc.id}')">
                    <strong>#${tc.num} ${tc.short} →</strong>
                    <span>${r.why}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

            </div>
            <p style="font-size:0.84rem;color:var(--text-main);">${tl.desc}</p>
          </div>
        </section>
      `;
    }

    /* =========================================================================
       B) TELA DE CONCEITO + 18 INFOGRÁFICOS INTERATIVOS EXCLUSIVOS EM SVG
       ========================================================================= */

      const ax = AXES[c.axis];

      const next = idx < CONCEPTS.length - 1 ? CONCEPTS[idx + 1] : null;

      return `
        <header class="page-header">
          <div class="meta-row">
            <span class="axis-pill" style="background:${ax.color};">${ax.roman} • ${ax.title}</span>

              <span>${isDone ? '✓' : '○'}</span>
              <span>${isDone ? 'Conceito Estudado' : 'Marcar como estudado'}</span>
            </button>
          </div>
          <h2 class="page-title">${c.num}. ${c.title}</h2>
          <div class="editorial-stripe"></div>
        </header>

        <section class="def-card" style="border-left-color:${ax.color};">
          <span class="kicker" style="color:${ax.color};">Definição Sintética</span>
          <p class="def-text">${c.def}</p>
          <p class="quote-inline">“${c.quote}” — Milton Santos</p>
        </section>

        <!-- Infográfico Exclusivo do Conceito -->

          ${renderConceptInfographic(c.id)}

        <!-- Inter-relações Conceituais -->

            ${c.relations.map(r => {
              const target = getConcept(r.id);
              const tax = AXES[target.axis];
              return `
                <button type="button" class="rel-card" style="border-left:4px solid ${tax.color};" onclick="openConcept('${target.id}')">
                  <strong style="color:${tax.color};">#${target.num} ${target.title} →</strong>
                  <span>${r.why}</span>

          <div class="btn-row" style="margin-top:8px;margin-bottom:0;">

              const w = getWork(wid);

              <div>
                <span class="step-meta">Voltar</span>
                <span class="step-title">Mapa Relacional</span>

          ${next ? `
            <button type="button" class="step-btn next" onclick="openConcept('${next.id}')">
              <div>
                <span class="step-meta">Próximo Conceito</span>
                <span class="step-title">${next.num}. ${next.short}</span>

              </div>
              <span style="font-size:1.15rem;">→</span>
            </button>

        </nav>
      `;
    }

    function renderWorkScreen(w) {
      const isDone = !!studied[w.id];
      const idx = WORKS.findIndex(x => x.id === w.id);
      const prev = idx > 0 ? WORKS[idx - 1] : null;
      const next = idx < WORKS.length - 1 ? WORKS[idx + 1] : null;
      const activePartIdx = ui.workPart[w.id] || 0;
      const activePart = w.parts[activePartIdx] || w.parts[0];
      const n = w.parts.length;

      // Gerar esquema SVG arquitetônico próprio conforme o layout da obra ('flow' | 'pillars' | 'matrix')
      let svgBody = '';
      const palette = ['#18444C', '#B85332', '#C68829', '#3B664C'];

      if (w.layout === 'matrix' && n === 4) {
        const coords = [[36, 20], [426, 20], [36, 126], [426, 126]];
        svgBody = `
          <line x1="410" y1="20" x2="410" y2="216" stroke="#C5B9A4" stroke-width="1.5" stroke-dasharray="5 4"/>
          <line x1="36" y1="118" x2="784" y2="118" stroke="#C5B9A4" stroke-width="1.5" stroke-dasharray="5 4"/>
          ${w.parts.map((p, i) => {
            const [x, y] = coords[i];
            const act = activePartIdx === i;
            const col = palette[i % 4];
            return `
              <g onclick="ui.workPart['${w.id}']=${i}; renderMain();" style="cursor:pointer;">
                <rect x="${x}" y="${y}" width="358" height="88" rx="12" fill="${act ? col : '#FFFDF8'}" stroke="${col}" stroke-width="${act?3:1.8}"/>
                <text x="${x+18}" y="${y+26}" font-family="monospace" font-size="10" font-weight="700" fill="${act?'#FBF3E2':col}">${p.tag.toUpperCase()}</text>
                <text x="${x+18}" y="${y+52}" font-family="Georgia, serif" font-size="14" font-weight="700" fill="${act?'#fff':'#1C242B'}">${p.title.slice(0, 38)}${p.title.length>38?'…':''}</text>
                <text x="${x+18}" y="${y+72}" font-family="sans-serif" font-size="10" fill="${act?'rgba(255,255,255,0.85)':'#4E5963'}">Clique para detalhar conteúdo</text>
              </g>
            `;
          }).join('')}
        `;
      } else if (w.layout === 'pillars') {
        const wBox = Math.floor(740 / n);
        svgBody = `
          <rect x="30" y="14" width="760" height="36" rx="10" fill="#18444C"/>
          <text x="410" y="36" text-anchor="middle" font-family="Georgia, serif" font-size="13.5" font-weight="700" fill="#FBF3E2">${w.title.toUpperCase()} (${w.year})</text>
          ${w.parts.map((p, i) => {
            const x = 30 + i * (wBox + 10);
            const act = activePartIdx === i;
            const col = palette[i % 4];
            return `
              <g onclick="ui.workPart['${w.id}']=${i}; renderMain();" style="cursor:pointer;">
                <rect x="${x}" y="66" width="${wBox}" height="134" rx="12" fill="${act ? col : '#FFFDF8'}" stroke="${col}" stroke-width="${act?3:1.8}"/>
                <text x="${x+14}" y="92" font-family="monospace" font-size="9.5" font-weight="700" fill="${act?'#FBF3E2':col}">${p.tag.toUpperCase()}</text>
                <text x="${x+14}" y="120" font-family="Georgia, serif" font-size="13" font-weight="700" fill="${act?'#fff':'#1C242B'}">${p.title.slice(0, 26)}</text>
                <text x="${x+14}" y="138" font-family="Georgia, serif" font-size="13" font-weight="700" fill="${act?'#fff':'#1C242B'}">${p.title.slice(26, 52)}</text>
                <text x="${x+14}" y="182" font-family="monospace" font-size="9" fill="${act?'#F6F2E9':'#4E5963'}">Inspecionar pilar →</text>
              </g>
            `;
          }).join('')}
        `;
      } else {
        // 'flow'
        const gap = 22;
        const wBox = Math.floor((760 - gap * (n - 1)) / n);
        svgBody = `
          ${w.parts.map((p, i) => {
            const x = 30 + i * (wBox + gap);
            const act = activePartIdx === i;
            const col = palette[i % 4];
            return `
              <g onclick="ui.workPart['${w.id}']=${i}; renderMain();" style="cursor:pointer;">
                <rect x="${x}" y="44" width="${wBox}" height="132" rx="14" fill="${act ? col : '#FFFDF8'}" stroke="${col}" stroke-width="${act?3:2}"/>
                <text x="${x+14}" y="72" font-family="monospace" font-size="9.5" font-weight="700" fill="${act?'#FBF3E2':col}">${p.tag.toUpperCase()}</text>
                <text x="${x+14}" y="102" font-family="Georgia, serif" font-size="12.5" font-weight="700" fill="${act?'#fff':'#1C242B'}">${p.title.slice(0, 24)}</text>
                <text x="${x+14}" y="120" font-family="Georgia, serif" font-size="12.5" font-weight="700" fill="${act?'#fff':'#1C242B'}">${p.title.slice(24, 48)}</text>
                <text x="${x+14}" y="158" font-family="monospace" font-size="8.5" fill="${act?'#F6F2E9':'#4E5963'}">Etapa ${i+1} de ${n}</text>
              </g>
              ${i < n - 1 ? `<line x1="${x+wBox}" y1="110" x2="${x+wBox+gap}" y2="110" stroke="#1C242B" stroke-width="2.5"/>` : ''}
            `;
          }).join('')}
        `;
      }

      return `
        <header class="page-header">
          <div class="meta-row">
            <span class="axis-pill" style="background:var(--terra);">Obra • ${w.year} • ${w.phase}</span>
            <button type="button" class="study-btn ${isDone ? 'studied' : ''}" onclick="toggleStudied('${w.id}', '${w.title.replace(/'/g, '')}')">
              <span>${isDone ? '✓' : '○'}</span>
              <span>${isDone ? 'Obra Estudada' : 'Marcar como estudada'}</span>
            </button>
          </div>
          <h2 class="page-title">${w.title}</h2>
          <p class="page-subtitle">${w.subtitle}</p>
          <div class="editorial-stripe"></div>
        </header>

        <section class="def-card" style="border-left-color:var(--terra);">
          <span class="kicker" style="color:var(--terra);">Tese Central do Livro</span>
          <p class="def-text">${w.thesis}</p>
        </section>

        <!-- Esquema Visual Interativo do Conteúdo da Obra -->
        <section class="infographic-card">
          <span class="kicker" style="color:var(--petrol);">Esquema Arquitetônico da Obra</span>
          <h3 class="section-heading">Estrutura Interna &amp; Fluxo Argumentativo</h3>
          <p class="section-lead">Clique em qualquer bloco do diagrama abaixo para inspecionar o conteúdo de cada parte/seção do livro.</p>

          <div class="svg-stage">
            <svg viewBox="0 0 820 228" role="img" aria-label="Esquema visual do livro ${w.title}">
              ${svgBody}
            </svg>
          </div>

          <div class="panel-soft" style="border-left:5px solid ${palette[activePartIdx % 4]};">
            <span class="chip" style="border-color:${palette[activePartIdx % 4]};color:${palette[activePartIdx % 4]};margin-bottom:6px;">${activePart.tag}</span>
            <h4 style="font-family:var(--font-serif);font-size:1.12rem;margin-bottom:5px;">${activePart.title}</h4>
            <p style="font-size:0.85rem;color:var(--text-main);">${activePart.desc}</p>
          </div>
        </section>

        <!-- Conceitos-Chave Desenvolvidos na Obra -->
        <section class="panel-soft" style="margin-bottom:10px;">
          <span class="kicker" style="color:var(--petrol);">Conceitos-Chave Desenvolvidos nesta Obra (Clique para abrir o infográfico)</span>
          <div class="btn-row" style="margin-top:8px;margin-bottom:0;">
            ${w.concepts.map(cid => {
              const c = getConcept(cid);
              const ax = AXES[c.axis];
              return `<button type="button" class="chip-btn" style="border-left:4px solid ${ax.color};" onclick="openConcept('${c.id}')">#${c.num} ${c.short} →</button>`;
            }).join('')}
          </div>
        </section>

        <!-- Navegação Inferior -->
        <nav class="page-footer">
          ${prev ? `
            <button type="button" class="step-btn" onclick="openWork('${prev.id}')">
              <span style="font-size:1.15rem;color:var(--terra);">←</span>
              <div>
                <span class="step-meta">Obra Anterior (${prev.year})</span>
                <span class="step-title">${prev.title}</span>
              </div>
            </button>
          ` : `
            <button type="button" class="step-btn" onclick="openMap()">
              <span style="font-size:1.15rem;color:var(--petrol);">←</span>
              <div>
                <span class="step-meta">Voltar</span>
                <span class="step-title">Mapa Relacional</span>
              </div>
            </button>
          `}

          ${next ? `
            <button type="button" class="step-btn next" onclick="openWork('${next.id}')">
              <div>
                <span class="step-meta">Próxima Obra (${next.year})</span>
                <span class="step-title">${next.title}</span>
              </div>
              <span style="font-size:1.15rem;">→</span>
            </button>
          ` : `
            <button type="button" class="step-btn next" onclick="openMap()">
              <div>
                <span class="step-meta">Concluir Percurso</span>
                <span class="step-title">Voltar ao Mapa Relacional</span>
              </div>
              <span style="font-size:1.15rem;">↺</span>
            </button>
          `}
        </nav>
      `;
    }

    function renderMain() {
      const container = document.getElementById('main-content');
      if (!container) return;
      if (currentView.type === 'map') {
        container.innerHTML = renderMapScreen();
      } else if (currentView.type === 'concept') {
        const c = getConcept(currentView.id);
        container.innerHTML = c ? renderConceptScreen(c) : renderMapScreen();
      } else if (currentView.type === 'work') {
        const w = getWork(currentView.id);
        container.innerHTML = w ? renderWorkScreen(w) : renderMapScreen();
      }
    }

    /* =========================================================================
       INICIALIZAÇÃO
       ========================================================================= */

    document.addEventListener('DOMContentLoaded', () => {
      try {
        document.getElementById('open-drawer-btn').addEventListener('click', openDrawer);
        document.getElementById('close-drawer-btn').addEventListener('click', closeDrawer);
        document.getElementById('sidebar-overlay').addEventListener('click', closeDrawer);
        document.getElementById('reset-progress-btn').addEventListener('click', resetProgress);

        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');

        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          searchClear.classList.toggle('visible', searchQuery.length > 0);
          renderSidebar();
        });

        searchClear.addEventListener('click', () => {
          searchQuery = '';
          searchInput.value = '';
          searchClear.classList.remove('visible');
          renderSidebar();
          searchInput.focus();
        });

        renderSidebar();
        renderMain();
      } catch (err) {
        console.error('Erro ao inicializar o Atlas de Milton Santos:', err);
      }
    });
  </script>
</body>
</html>
