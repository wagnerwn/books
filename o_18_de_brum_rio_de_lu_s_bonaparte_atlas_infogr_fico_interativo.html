<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O 18 de Brumário de Luís Bonaparte — Atlas Infográfico Interativo</title>

  <!-- Google Fonts com fallback seguro -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            parchment: '#F6F3EC',
            ink: '#1C1B1A',
            crimson: '#9B1C1C',
            republic: '#1E3A5F',
            gold: '#B78428',
            peasant: '#2D6A4F',
            borderline: '#E2DDD2',
            surface: '#FFFFFF'
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'Georgia', 'Cambria', 'serif'],
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace']
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --bg-parchment: #F6F3EC;
      --bg-card: #FFFFFF;
      --text-ink: #1C1B1A;
      --accent-crimson: #9B1C1C;
      --accent-republic: #1E3A5F;
      --accent-gold: #B78428;
      --accent-peasant: #2D6A4F;
      --border-soft: #E2DDD2;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-parchment);
      color: var(--text-ink);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-image: radial-gradient(rgba(28, 27, 26, 0.04) 1px, transparent 0);
      background-size: 24px 24px;
    }

    /* Textura sutil de gravura em cabeçalhos editoriais */
    .engraving-rule {
      background-image: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 3px,
        rgba(28, 27, 26, 0.14) 3px,
        rgba(28, 27, 26, 0.14) 4px
      );
    }

    /* Barra de rolagem discreta */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #EDE8DC;
    }
    ::-webkit-scrollbar-thumb {
      background: #C9C1B0;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #A89E89;
    }

    /* Estilização do slider range */
    input[type="range"].editorial-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #E2DDD2;
      border-radius: 999px;
      outline: none;
    }
    input[type="range"].editorial-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #9B1C1C;
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(28, 27, 26, 0.3);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"].editorial-slider::-webkit-slider-thumb:hover {
      transform: scale(1.12);
    }
    input[type="range"].editorial-slider::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #9B1C1C;
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(28, 27, 26, 0.3);
      cursor: pointer;
    }

    /* Animação suave de entrada de página */
    .fade-in {
      animation: fadeIn 0.28s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cartão interativo com virada suave de estado */
    .flip-state-card {
      transition: all 0.25s ease;
    }
    .flip-state-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px -6px rgba(28, 27, 26, 0.1);
    }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-crimson/20 selection:text-crimson">

  <!-- Cabeçalho Mobile -->
  <header class="lg:hidden sticky top-0 z-30 bg-parchment/95 backdrop-blur border-b border-borderline px-4 py-3 flex items-center justify-between">
    <button id="mobile-menu-btn" type="button" class="p-2 rounded-lg border border-borderline bg-white text-ink hover:bg-parchment focus:outline-none focus:ring-2 focus:ring-crimson" aria-label="Abrir menu de navegação">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <div class="text-center px-2">
      <p class="font-serif font-bold text-sm text-ink leading-tight">O 18 de Brumário</p>
      <p class="font-mono text-[10px] uppercase tracking-widest text-crimson">Atlas Infográfico</p>
    </div>
    <div id="mobile-progress-pill" class="font-mono text-xs font-semibold px-2.5 py-1 rounded-full bg-white border border-borderline text-republic">
      0/7
    </div>
  </header>

  <!-- Overlay Mobile Drawer -->
  <div id="sidebar-overlay" class="fixed inset-0 z-40 bg-ink/40 backdrop-blur-[1px] hidden lg:hidden" aria-hidden="true"></div>

  <!-- Layout Principal -->
  <div class="flex min-h-screen">

    <!-- Barra Lateral Fixa / Drawer Responsivo -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-50 h-screen w-80 max-w-[88vw] bg-white border-r border-borderline flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-200 ease-out shadow-xl lg:shadow-none">
      <!-- Identidade Editorial -->
      <div class="p-5 border-b border-borderline bg-parchment/60">
        <div class="flex items-start justify-between gap-2">
          <div>
            <span class="inline-block font-mono text-[10px] font-semibold uppercase tracking-[0.18em] text-crimson mb-1">
              Karl Marx • 1852 / Boitempo
            </span>
            <h1 class="font-serif font-extrabold text-xl leading-snug text-ink">
              O 18 de Brumário
            </h1>
            <p class="text-xs text-ink/70 mt-0.5">de Luís Bonaparte — Atlas Interativo</p>
          </div>
          <button id="close-sidebar-btn" type="button" class="lg:hidden p-1.5 rounded-lg border border-borderline bg-white text-ink/70 hover:text-ink" aria-label="Fechar menu">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <!-- Progresso Geral -->
        <div class="mt-4">
          <div class="flex items-center justify-between text-xs mb-1.5">
            <span class="font-medium text-ink/70">Progresso de Estudo</span>
            <span id="sidebar-progress-text" class="font-mono font-semibold text-republic">0 de 7 capítulos</span>
          </div>
          <div class="w-full h-2 bg-borderline/70 rounded-full overflow-hidden">
            <div id="sidebar-progress-bar" class="h-full bg-crimson rounded-full transition-all duration-300" style="width: 0%;"></div>
          </div>
        </div>
      </div>

      <!-- Busca Instantânea -->
      <div class="p-4 border-b border-borderline">
        <label for="search-input" class="sr-only">Buscar capítulo, conceito, data ou personagem</label>
        <div class="relative">
          <svg class="w-4 h-4 text-ink/45 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
          </svg>
          <input
            id="search-input"
            type="text"
            placeholder="Buscar conceito, data, nome..."
            autocomplete="off"
            class="w-full pl-9 pr-8 py-2 text-xs rounded-lg border border-borderline bg-parchment/50 text-ink placeholder:text-ink/45 focus:bg-white focus:outline-none focus:ring-2 focus:ring-crimson/40 focus:border-crimson transition"
          >
          <button id="clear-search-btn" type="button" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-ink/45 hover:text-ink" aria-label="Limpar busca">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div id="search-results" class="hidden mt-2 max-h-60 overflow-y-auto rounded-lg border border-borderline bg-white divide-y divide-borderline/60 shadow-sm"></div>
      </div>

      <!-- Navegação Principal -->
      <nav class="flex-1 overflow-y-auto p-3 space-y-1.5" aria-label="Sumário da obra">
        <button
          id="nav-overview"
          type="button"
          onclick="navigateTo('overview')"
          class="w-full text-left px-3.5 py-2.5 rounded-xl border transition flex items-center justify-between gap-2 group"
        >
          <div class="flex items-center gap-2.5 min-w-0">
            <span class="w-7 h-7 rounded-lg bg-republic/10 text-republic font-mono text-xs font-bold flex items-center justify-center shrink-0">
              §0
            </span>
            <div class="min-w-0">
              <p class="text-xs font-bold text-ink truncate">Mapa Geral &amp; Prefácios</p>
              <p class="text-[11px] text-ink/60 truncate">Linha do Tempo • Marx, Engels, Marcuse</p>
            </div>
          </div>
        </button>

        <div class="pt-2 pb-1 px-2 flex items-center justify-between">
          <span class="font-mono text-[10px] font-semibold uppercase tracking-wider text-ink/50">Capítulos da Obra</span>
          <span class="font-mono text-[10px] text-ink/45">1848–1851</span>
        </div>

        <div id="chapter-nav-list" class="space-y-1.5">
          <!-- Preenchido dinamicamente pelo JS -->
        </div>
      </nav>

      <!-- Rodapé da Barra Lateral -->
      <div class="p-3.5 border-t border-borderline bg-parchment/40 text-[11px] text-ink/60 flex items-center justify-between">
        <span>Ed. Boitempo • Trad. Nélio Schneider</span>
        <button type="button" onclick="resetProgress()" class="text-crimson hover:underline font-medium">Reiniciar</button>
      </div>
    </aside>

    <!-- Área Principal de Conteúdo -->
    <main class="flex-1 min-w-0">
      <div id="main-content" class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-10 py-6 sm:py-10">
        <!-- Renderizado dinamicamente -->
      </div>
    </main>

  </div>

  <!-- Toast de Feedback (substitui qualquer uso de alert) -->
  <div id="toast-banner" class="fixed bottom-5 right-5 z-50 hidden max-w-xs bg-ink text-parchment text-xs font-medium px-4 py-3 rounded-xl shadow-lg border border-gold/40 flex items-center gap-2.5">
    <span class="w-2 h-2 rounded-full bg-gold shrink-0"></span>
    <span id="toast-message"></span>
  </div>

  <script>
    /* =========================================================================
       DADOS HISTÓRICOS, TEXTUAIS E DE BUSCA — O 18 DE BRUMÁRIO DE LUÍS BONAPARTE
       Baseado fielmente na edição da Boitempo Editorial (Trad. Nélio Schneider)
       ========================================================================= */

    const STORAGE_KEY = 'brumario_atlas_studied_v1';

    const CHAPTERS_META = [
      {
        id: 'cap1',
        roman: 'I',
        shortTitle: 'Tragédia, Farsa e o Prólogo de Fevereiro',
        dates: 'Fev – Jun 1848',
        color: '#9B1C1C',
        keywords: ['Hegel', 'tragédia', 'farsa', 'pesadelo', 'tradição', 'mortos', 'Hic Rhodus', 'Fevereiro', 'Junho', 'barricadas', 'Blanqui', 'Propriedade', 'Família', 'Religião', 'Ordem', 'Crapulinski', '15 de maio', 'revoluções burguesas', 'proletárias']
      },
      {
        id: 'cap2',
        roman: 'II',
        shortTitle: 'Os Republicanos Puros e a Constituição de Aquiles',
        dates: 'Jun 1848 – Mai 1849',
        color: '#1E3A5F',
        keywords: ['National', 'republicanos puros', 'tricolores', 'Cavaignac', 'Marrast', 'estado de sítio', 'Constituição de 1848', 'Aquiles', 'câmara superior', 'câmara inferior', 'artigo 45', 'Frère il faut mourir', '10 de dezembro', 'Odilon Barrot', '29 de janeiro', 'Changarnier', 'Roma', 'Oudinot', 'bayonettes intelligentes']
      },
      {
        id: 'cap3',
        roman: 'III',
        shortTitle: 'A Linha Descendente, o Partido da Ordem e o 13 de Junho',
        dates: 'Mai – Ago 1849',
        color: '#B78428',
        keywords: ['linha ascendente', 'linha descendente', '1789', '1848', 'baionetas', 'Partido da Ordem', 'Legitimistas', 'Orleanistas', 'Bourbon', 'Orléans', 'flor-de-lis', 'Capital', 'Montanha', 'social-democracia', 'Ledru-Rollin', '13 de junho', 'Roma', 'Guarda Nacional', 'talismã', 'espectro vermelho']
      },
      {
        id: 'cap4',
        roman: 'IV',
        shortTitle: 'Perda do Executivo, "Tudo é Socialismo!" e o 31 de Maio',
        dates: 'Out 1849 – Mai 1850',
        color: '#9B1C1C',
        keywords: ['1º de novembro', 'Hautpoul', 'Fould', 'Carlier', 'imposto do vinho', 'lei de educação', 'jesuítas', 'socialismo', 'violino', 'espada de Dâmocles', '10 de março', 'De Flotte', 'Eugène Sue', '31 de maio', 'sufrágio universal', '3 milhões', 'golpe da burguesia', 'Baroche', 'Faucher']
      },
      {
        id: 'cap5',
        roman: 'V',
        shortTitle: 'A Sociedade 10 de Dezembro, Salsichões e a Perda do Exército',
        dates: 'Mai 1850 – Abr 1851',
        color: '#1E3A5F',
        keywords: ['lista civil', 'chantagem', 'Sociedade 10 de Dezembro', 'lumpemproletariado', 'bohemia', 'Saint-Maur', 'Satory', 'salsichões', 'champanhe', 'Changarnier', '12 de janeiro', 'cretinismo parlamentar', 'Mauguin', 'Yon', 'loteria', 'barras de ouro', 'ministério de transição', 'antiparlamentar', 'Persigny']
      },
      {
        id: 'cap6',
        roman: 'VI',
        shortTitle: 'Ruptura da Burguesia, Crise de 1851 e o 2 de Dezembro',
        dates: 'Mai – Dez 1851',
        color: '#B78428',
        keywords: ['revisão constitucional', 'artigo 111', '19 de julho', '446', '278', 'fusão', 'Chambord', 'Henrique V', 'Joinville', 'Economist', 'aristocracia financeira', 'crise comercial', '1851', 'superprodução', 'algodão', 'lã', 'Lei dos Questores', 'Asno de Buridano', '2 de dezembro', '25 milhões', 'Magnan', 'Thorigny', '10º arrondissement']
      },
      {
        id: 'cap7',
        roman: 'VII',
        shortTitle: 'A Máquina Estatal, o "Saco de Batatas" e o Bonapartismo',
        dates: 'Análise Estrutural',
        color: '#2D6A4F',
        keywords: ['4 de dezembro', 'retaliação', 'Fuge tace quiesce', 'república cossaca', 'velha toupeira', 'máquina estatal', 'burocracia', 'quebrar a máquina', 'saco de batatas', 'camponeses parceleiros', 'Parzellenbauern', 'Vendée', 'Cévennes', 'idées napoléoniennes', 'hipoteca', 'Coluna de Vendôme', 'Pierre dAilly']
      }
    ];

    // Estado global da aplicação
    let currentView = 'overview';
    let studiedMap = loadStudiedMap();

    // Estados internos dos infográficos (para manter interatividade fluida)
    const widgetState = {
      timelineIndex: 0,
      prefaceTab: 'marx',
      cap1RevMode: '18',
      cap1CoalitionId: 'financa',
      cap2Articles: { art8: false, art9: false, art3: false, sufragio: false },
      cap2Head: 'compare',
      cap3Step: 0,
      cap3FactionMode: 'split',
      cap4LawMode: 'before',
      cap4SocialismKey: 'imprensa',
      cap5ThermoStage: 0,
      cap5ForceTab: 'soc10',
      cap6VoteHighlight: 'all',
      cap6CrisisTab: 'compare',
      cap6CoupStep: 0,
      cap7MachineStage: 5,
      cap7PeasantMode: 'conservador',
      cap7Idees: { i1: false, i2: false, i3: false, i4: false, i5: false },
      cap7MirrorIdx: 0
    };

    /* =========================================================================
       PERSISTÊNCIA (localStorage) E UTILITÁRIOS
       ========================================================================= */

    function loadStudiedMap() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveStudiedMap() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(studiedMap));
      } catch (e) {
        // Fallback silencioso se localStorage estiver bloqueado
      }
    }

    function toggleStudied(chapterId, event) {
      if (event) event.stopPropagation();
      studiedMap[chapterId] = !studiedMap[chapterId];
      saveStudiedMap();
      renderSidebar();
      updateCurrentStudiedButton();
      const ch = CHAPTERS_META.find(c => c.id === chapterId);
      if (ch) {
        showToast(studiedMap[chapterId]
          ? `Capítulo ${ch.roman} marcado como estudado.`
          : `Capítulo ${ch.roman} desmarcado.`);
      }
    }

    function resetProgress() {
      studiedMap = {};
      saveStudiedMap();
      renderSidebar();
      updateCurrentStudiedButton();
      showToast('Progresso de estudo reiniciado.');
    }

    let toastTimer = null;
    function showToast(msg) {
      const banner = document.getElementById('toast-banner');
      const text = document.getElementById('toast-message');
      if (!banner || !text) return;
      text.textContent = msg;
      banner.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.add('hidden');
      }, 2600);
    }

    function updateCurrentStudiedButton() {
      const btn = document.getElementById('chapter-studied-toggle-btn');
      if (!btn || currentView === 'overview') return;
      const isDone = !!studiedMap[currentView];
      btn.className = isDone
        ? 'inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold bg-peasant text-white shadow-sm hover:bg-peasant/90 transition'
        : 'inline-flex items-center gap-2 px-4 py-2 rounded-xl text-xs font-semibold bg-white border border-borderline text-ink hover:border-peasant hover:text-peasant transition';
      btn.innerHTML = isDone
        ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Capítulo Estudado`
        : `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg> Marcar como Estudado`;
    }

    /* =========================================================================
       NAVEGAÇÃO, SIDEBAR E BUSCA INSTANTÂNEA
       ========================================================================= */

    function renderSidebar() {
      const list = document.getElementById('chapter-nav-list');
      const overviewBtn = document.getElementById('nav-overview');

      if (currentView === 'overview') {
        overviewBtn.className = 'w-full text-left px-3.5 py-2.5 rounded-xl border border-republic bg-republic/10 transition flex items-center justify-between gap-2';
      } else {
        overviewBtn.className = 'w-full text-left px-3.5 py-2.5 rounded-xl border border-transparent hover:border-borderline hover:bg-parchment/60 transition flex items-center justify-between gap-2';
      }

      list.innerHTML = CHAPTERS_META.map(ch => {
        const isActive = currentView === ch.id;
        const isDone = !!studiedMap[ch.id];
        return `
          <div
            onclick="navigateTo('${ch.id}')"
            role="button"
            tabindex="0"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();navigateTo('${ch.id}');}"
            class="w-full text-left px-3 py-2.5 rounded-xl border cursor-pointer transition flex items-start justify-between gap-2 ${
              isActive
                ? 'border-crimson bg-crimson/[0.06] shadow-xs'
                : 'border-transparent hover:border-borderline hover:bg-parchment/60'
            }"
          >
            <div class="flex items-start gap-2.5 min-w-0">
              <span class="w-7 h-7 rounded-lg font-serif font-bold text-xs flex items-center justify-center shrink-0 mt-0.5 ${
                isActive ? 'bg-crimson text-white' : 'bg-parchment text-ink border border-borderline'
              }">
                ${ch.roman}
              </span>
              <div class="min-w-0">
                <p class="text-xs font-semibold leading-snug ${isActive ? 'text-crimson' : 'text-ink'}">${ch.shortTitle}</p>
                <p class="font-mono text-[10px] text-ink/55 mt-0.5">${ch.dates}</p>
              </div>
            </div>
            <button
              type="button"
              onclick="toggleStudied('${ch.id}', event)"
              title="${isDone ? 'Desmarcar como estudado' : 'Marcar como estudado'}"
              aria-label="${isDone ? 'Desmarcar capítulo ' + ch.roman : 'Marcar capítulo ' + ch.roman + ' como estudado'}"
              class="shrink-0 mt-1 w-5 h-5 rounded-md border flex items-center justify-center transition ${
                isDone
                  ? 'bg-peasant border-peasant text-white'
                  : 'bg-white border-borderline text-transparent hover:border-peasant/70'
              }"
            >
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
              </svg>
            </button>
          </div>
        `;
      }).join('');

      // Atualizar barra de progresso
      const doneCount = CHAPTERS_META.filter(c => studiedMap[c.id]).length;
      const pct = Math.round((doneCount / CHAPTERS_META.length) * 100);
      document.getElementById('sidebar-progress-text').textContent = `${doneCount} de ${CHAPTERS_META.length} capítulos`;
      document.getElementById('sidebar-progress-bar').style.width = `${pct}%`;
      const mobilePill = document.getElementById('mobile-progress-pill');
      if (mobilePill) mobilePill.textContent = `${doneCount}/7`;
    }

    function navigateTo(viewId) {
      currentView = viewId;
      renderSidebar();
      renderMainView();
      closeMobileSidebar();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openMobileSidebar() {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.remove('hidden');
    }

    function closeMobileSidebar() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.add('hidden');
    }

    // Índice de busca instantânea
    const SEARCH_INDEX = [
      { target: 'overview', label: 'Mapa Geral & Prefácios', meta: 'Victor Hugo, Proudhon, Marx (1869), Engels (1885), Marcuse (1965), Sismondi, cesarismo, linha do tempo 1848-1851' },

    function setupSearch() {
      const input = document.getElementById('search-input');
      const resultsBox = document.getElementById('search-results');
      const clearBtn = document.getElementById('clear-search-btn');

      function runSearch() {
        const q = input.value.trim().toLowerCase();
        clearBtn.classList.toggle('hidden', q.length === 0);
        if (q.length < 2) {
          resultsBox.classList.add('hidden');
          resultsBox.innerHTML = '';
          return;
        }
        const normalizedQ = q.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        const matches = SEARCH_INDEX.filter(item => {
          const hay = (item.label + ' ' + item.meta).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
          return hay.includes(normalizedQ);
        });

        if (matches.length === 0) {
          resultsBox.innerHTML = `<div class="p-3 text-xs text-ink/55">Nenhum resultado para "<strong>${escapeHtml(input.value)}</strong>".</div>`;
        } else {
          resultsBox.innerHTML = matches.map(m => {
            const matchedKeywords = m.meta.split(/[, ]+/).filter(w =>
              w.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(normalizedQ)
            ).slice(0, 3);
            return `
              <button type="button" onclick="navigateTo('${m.target}'); document.getElementById('search-results').classList.add('hidden');" class="w-full text-left px-3 py-2.5 hover:bg-parchment/80 transition">
                <p class="text-xs font-semibold text-ink">${m.label}</p>
                ${matchedKeywords.length ? `<p class="font-mono text-[10px] text-crimson mt-0.5">Correspondência: ${matchedKeywords.join(', ')}</p>` : ''}
              </button>
            `;
          }).join('');
        }
        resultsBox.classList.remove('hidden');
      }

      input.addEventListener('input', runSearch);
      clearBtn.addEventListener('click', () => {
        input.value = '';
        runSearch();
        input.focus();
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

      { era: 'Restauração & Julho', label: 'Divisão do Trabalho', desc: 'Acentua a divisão de trabalho estatal: cada interesse comum (pontes, escolas, ferrovias) é arrancado da sociedade e entregue ao Estado.' },
      { era: 'República Parlamentar', label: 'Repressão', desc: 'Na luta contra a revolução, reforça ainda mais os meios repressivos e a centralização do Poder Executivo.' },
      { era: 'Segundo Bonaparte', label: 'Autonomia Plena', desc: 'O Estado torna-se completamente independente face à sociedade civil: 500.000 funcionários + 500.000 soldados. Tese de Marx: “Todas as revoluções somente aperfeiçoaram a máquina em vez de quebrá-la.”' }
    ];

    const CAP7_IDEES = [
      { key: 'i1', num: '01', title: 'Propriedade Parcelada', y1800: 'Condição de libertação do camponês feudal e enriquecimento no início do séc. XIX.', y1851: 'Deterioração da agricultura, hipoteca esmagadora (juros equivalentes à dívida nacional britânica) e 16 milhões vivendo em casebres.' },
      { key: 'i2', num: '02', title: 'Governo Forte & Imposto', y1800: 'Napoleão compensava o imposto pilhando a Europa e abrindo mercados à baioneta.', y1851: 'Governo forte = imposto elevado que suga os últimos recursos da parcela para sustentar burocracia, corte e polícia.' },
      { key: 'i3', num: '03', title: 'Burocracia Estatal', y1800: 'Meio de centralização contra poderes feudais intermediários.', y1851: 'Casta parasita artificial que vive de sinecuras e tem interesse existencial na preservação do regime bonapartista.' },
      { key: 'i4', num: '04', title: 'Religião & Clero', y1800: 'A parcela jovem, dependente da natureza, era naturalmente religiosa; o céu complementava a terra.', y1851: 'A parcela endividada torna-se irreligiosa; o padreco vira o "sabujo ungido da polícia terrena".' },
      { key: 'i5', num: '05', title: 'Preponderância do Exército', y1800: 'Questão de honra dos camponeses-heróis defendendo a pátria e revolucionando o mundo.', y1851: 'Exército de suplentes (lumpemproletariado camponês) caçando camponeses como veados; os inimigos agora são oficiais de justiça e o fisco.' }
    ];

    const CAP7_MIRROR = [
      { weapon: 'Apoteose do Sabre', againstProl: 'Exaltou o Exército como salvador da ordem em junho de 1848 e junho de 1849.', againstBourg: 'O sabre passou a dominá-la: em 4 de dezembro, soldados bêbados fuzilaram burgueses nas janelas dos bulevares.' },
      { weapon: 'Imprensa & Salões', againstProl: 'Destruiu a imprensa revolucionária e colocou clubes populares sob vigilância policial.', againstBourg: 'Sua própria imprensa foi amordaçada e seus salões culturais foram vigiados pela polícia.' },
      { weapon: 'Guarda Nacional', againstProl: 'Dissolveu as Guardas Nacionais democráticas após 13 de junho de 1849.', againstBourg: 'Sua própria Guarda Nacional foi dissolvida e desarmada sarcasticamente por Bonaparte.' },
      { weapon: 'Estado de Sítio & Comissões', againstProl: 'Decretou estado de sítio, trocou júris por comissões militares e deportou 15 mil sem julgamento.', againstBourg: 'Estado de sítio decretado sobre ela, júris substituídos por tribunais militares e deputados deportados.' },
      { weapon: 'O Lema da Ordem', againstProl: 'Bradou sem cessar à Revolução: “Fuge, tace, quiesce!” (Foge, cala-te, aquieta-te!).', againstBourg: 'Bonaparte gritou exatamente o mesmo para a burguesia: “Fuge, tace, quiesce!” — e ainda saqueou sua bolsa.' }
    ];

    function renderCap7() {
      const ch = CHAPTERS_META[6];
      const mStage = CAP7_MACHINE_STAGES[widgetState.cap7MachineStage];
      const isCons = widgetState.cap7PeasantMode === 'conservador';

      return `
        <div class="fade-in space-y-8">
          ${renderChapterHeader(
            ch,
            'Todas as revoluções somente aperfeiçoaram a máquina em vez de quebrá-la. [...] Porém, quando o manto imperial finalmente cair sobre os ombros de Luís Bonaparte, a estátua de bronze de Napoleão despencará do alto da coluna de Vendôme.',
            'Capítulo VII'
          )}

          <!-- Infográfico 7.1: Evolução da Máquina Estatal -->
          <section class="bg-white rounded-3xl border border-borderline p-6 sm:p-8 shadow-xs">
            <span class="font-mono text-[11px] font-semibold uppercase tracking-widest text-peasant">Infográfico Exclusivo 7.1</span>
            <h3 class="font-serif font-bold text-2xl text-ink mt-0.5 mb-2">Evolução da Máquina Estatal Burocrático-Militar</h3>
            <p class="text-sm text-ink/70 mb-5">
              Acompanhe como o "corpo de parasitas" que entope todos os poros da sociedade francesa cresceu até se emancipar sob Luís Bonaparte.
            </p>

            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 mb-5">
              ${CAP7_MACHINE_STAGES.map((st, i) => `
                <button type="button" onclick="widgetState.cap7MachineStage=${i}; renderMainView();" class="p-3 rounded-xl border text-left transition ${widgetState.cap7MachineStage===i ? 'bg-peasant text-white border-peasant shadow-sm' : 'bg-parchment/60 border-borderline text-ink hover:bg-parchment'}">
                  <p class="font-mono text-[10px] font-bold ${widgetState.cap7MachineStage===i ? 'text-white/80' : 'text-peasant'}">0${i+1} • ${st.label}</p>
                  <p class="text-xs font-semibold mt-1 leading-tight">${st.era}</p>
                </button>
              `).join('')}
            </div>

            <div class="rounded-2xl bg-parchment/65 border border-borderline p-5 flex flex-col md:flex-row md:items-center justify-between gap-5">
              <div class="flex-1">
                <p class="font-mono text-xs font-bold text-peasant uppercase">${mStage.era} — ${mStage.label}</p>
                <p class="text-sm text-ink/85 mt-2 leading-relaxed">${mStage.desc}</p>
              </div>
              <div class="shrink-0 grid grid-cols-2 gap-3 bg-white p-4 rounded-xl border border-borderline text-center">
                <div>
                  <p class="font-mono font-bold text-xl text-republic">500 mil</p>
                  <p class="text-[10px] text-ink/60 uppercase">Funcionários</p>
                </div>
                <div>
                  <p class="font-mono font-bold text-xl text-crimson">500 mil</p>
                  <p class="text-[10px] text-ink/60 uppercase">Soldados</p>
                </div>
              </div>
            </div>
            <p class="mt-3 text-xs text-ink/65 italic">
              Nota: Marx compara o trabalho subterrâneo da revolução, que concentra todo o Poder Executivo para então destruí-lo, à citação de Shakespeare: <strong>“Bem cavoucado, velha toupeira!”</strong>.
            </p>
          </section>

          <!-- Infográfico 7.2: O "Saco de Batatas" -->
          <section class="bg-white rounded-3xl border border-borderline p-6 sm:p-8 shadow-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-5">
              <div>
                <span class="font-mono text-[11px] font-semibold uppercase tracking-widest text-peasant">Infográfico Exclusivo 7.2</span>
                <h3 class="font-serif font-bold text-2xl text-ink mt-0.5">O “Saco de Batatas” — Camponeses Parceleiros</h3>
              </div>
              <div class="inline-flex p-1 rounded-xl bg-parchment border border-borderline self-start">
                <button type="button" onclick="widgetState.cap7PeasantMode='conservador'; renderMainView();" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition ${isCons ? 'bg-gold text-white' : 'text-ink/70'}">
                  Conservador (Vendée)
                </button>
                <button type="button" onclick="widgetState.cap7PeasantMode='revolucionario'; renderMainView();" class="px-3.5 py-2 rounded-lg text-xs font-semibold transition ${!isCons ? 'bg-crimson text-white' : 'text-ink/70'}">
                  Revolucionário (Cévennes)
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
              <!-- Visual de parcelas isoladas -->
              <div class="lg:col-span-5 bg-parchment/70 rounded-2xl p-5 border border-borderline">
                <p class="font-mono text-[10px] uppercase font-bold text-peasant mb-3 text-center">Adição de Grandezas Homônimas (Sem Vínculo Nacional)</p>
                <div class="grid grid-cols-3 gap-2">
                  ${Array.from({length: 9}).map((_, idx) => `
                    <div class="bg-white rounded-xl p-2.5 border border-peasant/30 text-center">
                      <div class="w-4 h-4 mx-auto rounded-full bg-peasant/20 border border-peasant mb-1"></div>
                      <p class="font-mono text-[9px] text-ink/70">Parcela ${idx+1}</p>
                    </div>
                  `).join('')}
                </div>
                <p class="text-[11px] text-ink/75 mt-3 text-center leading-snug">
                  “Eles não são capazes de representar a si mesmos, necessitando ser representados. O seu representante precisa entrar em cena como seu senhor, mandando chuva e sol lá de cima.”
                </p>
              </div>

              <!-- Explicação da dualidade -->
              <div class="lg:col-span-7 rounded-2xl p-6 border ${isCons ? 'bg-gold/[0.08] border-gold/45' : 'bg-crimson/[0.05] border-crimson/35'}">
                <span class="font-mono text-[10px] uppercase font-bold px-2.5 py-0.5 rounded text-white ${isCons ? 'bg-gold' : 'bg-crimson'}">
                  ${isCons ? 'Base Social de Bonaparte' : 'Aliado Natural do Proletariado'}
                </span>
                <h4 class="font-serif font-bold text-xl text-ink mt-2.5">
                  ${isCons ? 'O Camponês Conservador (Moderna Vendée)' : 'O Camponês Revolucionário (Moderna Cévennes)'}
                </h4>
                <p class="text-sm text-ink/85 mt-2 leading-relaxed">
                  ${isCons
                    ? 'A dinastia Bonaparte representa o camponês que quer consolidar sua parcela, encerrado na velha ordem, movido pela superstição, pelo preconceito e pelo passado — esperando que o fantasma do Império o salve das cidades.'
                    : 'Esmagado pela hipoteca, pelo agiota citadino e pelo fisco, o camponês que se projeta para além da parcela descobre no proletariado citadino seu aliado e líder natural para subverter a ordem burguesa — o "coro" sem o qual o canto solo proletário vira lamento fúnebre.'}
                </p>
              </div>
            </div>
          </section>

          <!-- Infográfico 7.3: As 5 Idées Napoléoniennes -->
          <section class="bg-white rounded-3xl border border-borderline p-6 sm:p-8 shadow-xs">
            <div class="flex flex-wrap items-center justify-between gap-3 mb-2">
              <div>
                <span class="font-mono text-[11px] font-semibold uppercase tracking-widest text-gold">Infográfico Exclusivo 7.3</span>
                <h3 class="font-serif font-bold text-2xl text-ink mt-0.5">As 5 <em>Idées Napoléoniennes</em> (1800 vs. 1851)</h3>
              </div>
              <button type="button" onclick="toggleAllIdees()" class="px-3.5 py-1.5 rounded-lg text-xs font-semibold border border-borderline bg-parchment hover:bg-ink hover:text-white transition">
                Alternar Todas (1800 ↔ 1851)
              </button>
            </div>
            <p class="text-sm text-ink/70 mb-5">
              Clique em cada pilar para ver como as ideias ligadas à parcela jovem de 1800 viraram "alucinações de sua agonia" em 1851.
            </p>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3">
              ${CAP7_IDEES.map(item => {
                const is1851 = !!widgetState.cap7Idees[item.key];
                return `
                  <button type="button" onclick="widgetState.cap7Idees['${item.key}']=!widgetState.cap7Idees['${item.key}']; renderMainView();" class="flip-state-card text-left rounded-2xl p-4 border flex flex-col justify-between ${is1851 ? 'bg-crimson/[0.05] border-crimson/40' : 'bg-peasant/[0.05] border-peasant/35'}">
                    <div>
                      <div class="flex items-center justify-between mb-2">
                        <span class="font-mono text-[10px] font-bold px-2 py-0.5 rounded text-white ${is1851 ? 'bg-crimson' : 'bg-peasant'}">${is1851 ? '1851 (Agonia)' : '1800 (Viço)'}</span>
                        <span class="font-mono text-[10px] text-ink/50">#${item.num}</span>
                      </div>
                      <h4 class="font-serif font-bold text-sm text-ink mb-1.5">${item.title}</h4>
                      <p class="text-xs text-ink/80 leading-relaxed">${is1851 ? item.y1851 : item.y1800}</p>
                    </div>
                    <p class="mt-3 pt-2 border-t border-borderline/60 font-mono text-[10px] ${is1851 ? 'text-crimson' : 'text-peasant'}">↻ Virar época</p>
                  </button>
                `;
              }).join('')}
            </div>
          </section>

          <!-- Infográfico 7.4: O Espelho da Retaliação (4 de Dezembro) -->
          <section class="bg-white rounded-3xl border border-borderline p-6 sm:p-8 shadow-xs">
            <span class="font-mono text-[11px] font-semibold uppercase tracking-widest text-crimson">Infográfico Exclusivo 7.4</span>
            <h3 class="font-serif font-bold text-2xl text-ink mt-0.5 mb-2">O Espelho da Retaliação (4 de Dezembro)</h3>
            <p class="text-sm text-ink/70 mb-5">
              A simetria irônica descrita por Marx: cada arma repressiva que a burguesia forjou contra o proletariado foi aplicada por Bonaparte contra a própria burguesia (“república cossaca”).
            </p>

            <div class="overflow-x-auto rounded-2xl border border-borderline">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-parchment border-b border-borderline font-mono text-[11px] uppercase tracking-wider text-ink/70">
                    <th class="py-3 px-4">Instrumento</th>
                    <th class="py-3 px-4 text-republic">O que a Burguesia fez (1848–50)</th>
                    <th class="py-3 px-4 text-crimson">O que Bonaparte fez contra ela (Dez 1851)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-borderline text-xs">
                  ${CAP7_MIRROR.map((row, idx) => `
                    <tr onclick="widgetState.cap7MirrorIdx=${idx}; renderMainView();" class="cursor-pointer transition ${widgetState.cap7MirrorIdx===idx ? 'bg-gold/10' : 'hover:bg-parchment/50'}">
                      <td class="py-3.5 px-4 font-serif font-bold text-ink whitespace-nowrap">${row.weapon}</td>
                      <td class="py-3.5 px-4 text-ink/80 leading-relaxed">${row.againstProl}</td>
                      <td class="py-3.5 px-4 text-ink/90 font-medium leading-relaxed">${row.againstBourg}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <!-- Nota final sobre contradições do Bonapartismo -->
            <div class="mt-5 rounded-2xl bg-ink text-parchment p-5">
              <p class="font-mono text-[10px] uppercase tracking-widest text-gold font-bold">Contradições do Bonapartismo</p>
              <p class="text-xs sm:text-sm text-parchment/90 mt-1.5 leading-relaxed">
                Bonaparte quer ser o benfeitor patriarcal de todas as classes — roubar toda a França para dá-la de presente à França —, mas não pode dar a uma sem tirar da outra. Como resumiu o cardeal Pierre d’Ailly no Concílio de Constança: <em>“O único que ainda pode salvar a Igreja é o diabo em pessoa”</em>. Assim, sob o chefe da Sociedade 10 de Dezembro, só a desordem salva a ordem — enquanto profana toda a máquina estatal e prepara a queda da Coluna de Vendôme.
              </p>
            </div>
          </section>

          ${renderChapterFooter('cap7')}
        </div>
      `;
    }

    function toggleAllIdees() {
      const anyFalse = Object.values(widgetState.cap7Idees).some(v => !v);
      Object.keys(widgetState.cap7Idees).forEach(k => { widgetState.cap7Idees[k] = anyFalse; });
      renderMainView();
    }

    /* =========================================================================
       RENDERIZADOR PRINCIPAL E INICIALIZAÇÃO
       ========================================================================= */

    function renderMainView() {
      const container = document.getElementById('main-content');
      if (!container) return;

      switch (currentView) {
        case 'cap1': container.innerHTML = renderCap1(); break;
        case 'cap2': container.innerHTML = renderCap2(); break;
        case 'cap3': container.innerHTML = renderCap3(); break;
        case 'cap4': container.innerHTML = renderCap4(); break;
        case 'cap5': container.innerHTML = renderCap5(); break;
        case 'cap6': container.innerHTML = renderCap6(); break;
        case 'cap7': container.innerHTML = renderCap7(); break;
        default: container.innerHTML = renderOverview(); break;
      }

      updateCurrentStudiedButton();
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        document.getElementById('mobile-menu-btn').addEventListener('click', openMobileSidebar);
        document.getElementById('close-sidebar-btn').addEventListener('click', closeMobileSidebar);
        document.getElementById('sidebar-overlay').addEventListener('click', closeMobileSidebar);
        setupSearch();
        renderSidebar();
        renderMainView();
      } catch (err) {
        console.error('Erro ao inicializar o Atlas:', err);
      }
    });
  </script>
</body>
</html>
