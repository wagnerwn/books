<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical (Stephen Graham) — Parte 2: Das Torres de Luxo às Minas Profundas</title>
  <style>
    /* ==========================================================================
       DESIGN TOKENS — PALETA ESTRITAMENTE AZUL MARINHO E CINZA CLARO
       ========================================================================== */
    :root {
      --navy-950: #0B1F3A;
      --navy-900: #132E52;
      --navy-700: #1E3F66;
      --navy-600: #2C5282;
      --slate-500: #64748B;

      --gray-50:  #F4F6F9;
      --gray-100: #E8EDF3;
      --gray-200: #D1D9E4;
      --white:    #FFFFFF;

      --text-main:  #0F172A;
      --text-body:  #334155;
      --text-muted: #526277;
      --border:     #CBD5E1;

      --font-serif: Georgia, 'Times New Roman', serif;
      --font-sans:  -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

      --topbar-h: 60px;
      --sidebar-w: 325px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 2px 8px rgba(11, 31, 58, 0.06);
      --shadow-md: 0 8px 24px rgba(11, 31, 58, 0.11);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--gray-50);
      color: var(--text-main);
      line-height: 1.65;
      overflow-x: hidden;
    }

    /* ==========================================================================
       BARRA SUPERIOR FIXA COM PÍLULAS DE ACESSO RÁPIDO
       ========================================================================== */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--topbar-h);
      background: var(--navy-950);
      color: var(--white);
      border-bottom: 2px solid var(--navy-600);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      gap: 14px;
      z-index: 1000;
      box-shadow: 0 4px 16px rgba(11, 31, 58, 0.22);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mobile-menu-btn {
      display: none;
      background: var(--navy-700);
      border: 1px solid var(--navy-600);
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 6px 11px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
    }

    .topbar-brand {
      font-family: var(--font-serif);
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--white);
      white-space: nowrap;
    }

    .topbar-brand span {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gray-200);
      margin-left: 8px;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .topbar-pills {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .topbar-pills::-webkit-scrollbar { display: none; }

    .top-pill {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(209, 217, 228, 0.24);
      color: var(--gray-100);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.16s ease;
    }

    .top-pill:hover {
      background: rgba(255, 255, 255, 0.18);
      color: var(--white);
    }

    .top-pill.active {
      background: var(--gray-100);
      color: var(--navy-950);
      border-color: var(--white);
      font-weight: 700;
    }

    /* ==========================================================================
       LAYOUT PRINCIPAL: SIDEBAR FIXA + ÁREA EDITORIAL
       ========================================================================== */
    .app-shell {
      display: flex;
      padding-top: var(--topbar-h);
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: var(--topbar-h);
      left: 0;
      bottom: 0;
      width: var(--sidebar-w);
      background: linear-gradient(180deg, var(--navy-950) 0%, var(--navy-900) 100%);
      color: var(--gray-100);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--navy-700);
      z-index: 950;
      transition: transform 0.25s ease;
    }

    .sidebar-head {
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(209, 217, 228, 0.16);
    }

    .sidebar-meta {
      font-size: 0.69rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #A9BDD4;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .sidebar-ctrl-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .sidebar-subtitle {
      font-size: 0.76rem;
      color: var(--gray-200);
      line-height: 1.3;
    }

    .btn-expand-all {
      flex-shrink: 0;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(209, 217, 228, 0.3);
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 0.7rem;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-expand-all:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 24px;
    }

    .sidebar-scroll::-webkit-scrollbar { width: 6px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--navy-700); border-radius: 4px; }

    .nav-overview-btn {
      width: 100%;
      text-align: left;
      background: rgba(44, 82, 130, 0.35);
      border: 1px solid rgba(209, 217, 228, 0.3);
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      transition: all 0.15s;
    }

    .nav-overview-btn:hover {
      background: rgba(44, 82, 130, 0.55);
    }

    .nav-overview-btn.active {
      background: var(--gray-100);
      color: var(--navy-950);
      border-color: var(--white);
    }

    .nav-group-label {
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: #9FB4CC;
      padding: 10px 6px 5px;
      border-bottom: 1px solid rgba(209, 217, 228, 0.12);
      margin-bottom: 7px;
    }

    .nav-item {
      margin-bottom: 6px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(209, 217, 228, 0.1);
      overflow: hidden;
    }

    .nav-item.active-chapter {
      background: rgba(44, 82, 130, 0.45);
      border-color: var(--gray-200);
    }

    .nav-item-row {
      display: flex;
      align-items: stretch;
    }

    .nav-chap-btn {
      flex: 1;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--gray-50);
      font-family: var(--font-sans);
      font-size: 0.79rem;
      font-weight: 600;
      padding: 9px 8px 9px 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.35;
    }

    .nav-chap-btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-badge {
      flex: 0 0 auto;
      background: var(--navy-700);
      color: var(--gray-100);
      font-size: 0.67rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 1px;
    }

    .nav-item.active-chapter .nav-badge {
      background: var(--white);
      color: var(--navy-950);
    }

    .nav-toggle-sub {
      width: 30px;
      background: transparent;
      border: none;
      border-left: 1px solid rgba(209, 217, 228, 0.14);
      color: #9FB4CC;
      font-size: 0.72rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, color 0.15s;
    }

    .nav-toggle-sub:hover { color: var(--white); }

    .nav-item.expanded .nav-toggle-sub {
      transform: rotate(90deg);
      color: var(--white);
    }

    .nav-sub-list {
      display: none;
      list-style: none;
      padding: 4px 8px 8px 16px;
      border-top: 1px solid rgba(209, 217, 228, 0.12);
      background: rgba(11, 31, 58, 0.45);
    }

    .nav-item.expanded .nav-sub-list {
      display: block;
    }

    .nav-sub-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-left: 2px solid rgba(209, 217, 228, 0.25);
      color: #CBD6E4;
      font-family: var(--font-sans);
      font-size: 0.73rem;
      padding: 5px 8px 5px 10px;
      cursor: pointer;
      line-height: 1.35;
      transition: all 0.15s;
    }

    .nav-sub-btn:hover {
      color: var(--white);
      border-left-color: var(--white);
    }

    .nav-sub-btn.active-sub {
      color: var(--white);
      font-weight: 700;
      border-left-color: var(--white);
      background: rgba(255, 255, 255, 0.12);
    }

    .sidebar-foot {
      padding: 11px 15px;
      border-top: 1px solid rgba(209, 217, 228, 0.16);
      background: rgba(11, 31, 58, 0.78);
      font-size: 0.71rem;
      color: #A9BDD4;
      line-height: 1.45;
    }

    .sidebar-foot strong {
      color: var(--white);
      display: block;
      margin-bottom: 2px;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 31, 58, 0.55);
      z-index: 900;
    }

    /* ==========================================================================
       PALCO EDITORIAL PRINCIPAL
       ========================================================================== */
    .main-stage {
      margin-left: var(--sidebar-w);
      flex: 1;
      max-width: calc(100% - var(--sidebar-w));
      padding: 30px 40px 76px;
    }

    .content-wrap {
      max-width: 1030px;
      margin: 0 auto;
      animation: fadeUp 0.22s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cabeçalho do Capítulo */
    .hero-card {
      background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-900) 62%, var(--navy-700) 100%);
      color: var(--white);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-md);
      border-left: 6px solid var(--slate-500);
    }

    .hero-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .tag-solid {
      background: var(--gray-100);
      color: var(--navy-950);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .tag-ghost {
      border: 1px solid rgba(209, 217, 228, 0.42);
      color: var(--gray-100);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 4px;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 700;
      line-height: 1.24;
      color: var(--white);
      margin-bottom: 5px;
    }

    .hero-orig {
      font-size: 0.84rem;
      color: #B8C9DD;
      font-style: italic;
      margin-bottom: 12px;
    }

    .hero-lead {
      font-size: 0.96rem;
      color: var(--gray-100);
      max-width: 880px;
    }

    /* Caixa de Tese Central */
    .thesis-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 5px solid var(--navy-900);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
    }

    .thesis-kicker {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--navy-700);
      margin-bottom: 6px;
    }

    .thesis-text {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 500;
    }

    /* Pílulas de Subcapítulos */
    .sub-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .sub-pill {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--navy-900);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .sub-pill:hover {
      background: var(--navy-900);
      color: var(--white);
      border-color: var(--navy-900);
    }

    /* Divisores de Seção */
    .block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 28px 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gray-200);
    }

    .block-head h3 {
      font-family: var(--font-serif);
      font-size: 1.26rem;
      color: var(--navy-950);
    }

    .block-pill {
      background: var(--navy-900);
      color: var(--gray-50);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ==========================================================================
       CARDS DE ESQUEMAS EXPLICATIVOS (SVG + COMPONENTES ESTRUTURAIS)
       ========================================================================== */
    .schema-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }

    .schema-card.nested {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      margin-top: 14px;
      margin-bottom: 10px;
      padding: 18px 20px;
    }

    .schema-head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .schema-tag {
      background: var(--navy-950);
      color: var(--white);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 9px;
      border-radius: 4px;
    }

    .schema-tag.svg-tag {
      background: var(--navy-600);
    }

    .schema-tag.sub-tag {
      background: var(--gray-200);
      color: var(--navy-950);
    }

    .schema-title {
      font-family: var(--font-serif);
      font-size: 1.03rem;
      font-weight: 700;
      color: var(--navy-950);
    }

    .schema-caption {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    /* Moldura de SVG */
    .svg-frame {
      width: 100%;
      overflow-x: auto;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 10px;
    }

    .svg-frame svg {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .svg-layer-link {
      cursor: pointer;
      transition: opacity 0.16s ease;
    }

    .svg-layer-link:hover {
      opacity: 0.9;
    }

    .svg-layer-link:hover .layer-box {
      stroke: #0B1F3A;
      stroke-width: 2.5;
    }

    /* Fluxograma Horizontal */
    .diag-flow {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .diag-node {
      flex: 1;
      background: var(--gray-50);
      border: 1px solid var(--border);
      border-top: 4px solid var(--navy-600);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .diag-node.tone-dark {
      background: var(--navy-950);
      border-color: var(--navy-950);
      border-top: 4px solid var(--slate-500);
      color: var(--white);
    }

    .diag-node.tone-dark h5 { color: var(--white); }
    .diag-node.tone-dark p, .diag-node.tone-dark li { color: var(--gray-100); }

    .diag-node.tone-mid {
      background: var(--gray-100);
      border-color: #B7C5D6;
      border-top: 4px solid var(--navy-900);
    }

    .diag-node.tone-mid h5 { color: var(--navy-950); }

    .diag-node h5 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy-950);
      line-height: 1.3;
    }

    .diag-node p, .diag-node li {
      font-size: 0.8rem;
      color: var(--text-body);
      line-height: 1.46;
    }

    .diag-node ul {
      padding-left: 16px;
      margin-top: 2px;
    }

    .diag-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-600);
      font-size: 1.25rem;
      font-weight: 800;
      padding: 0 2px;
      user-select: none;
    }

    /* Grade de Cartões */
    .diag-grid {
      display: grid;
      gap: 12px;
    }
    .diag-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .diag-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .diag-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

    /* Tensão Bipolar */
    .diag-tension {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      gap: 12px;
    }

    .tension-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--navy-900);
      color: var(--white);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      min-width: 112px;
      max-width: 158px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .tension-mid .sym {
      font-size: 1.25rem;
      margin-bottom: 4px;
      color: var(--gray-200);
    }

    /* Tabela / Matriz Comparativa */
    .diag-table-wrap {
      overflow-x: auto;
    }

    .diag-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .diag-table th {
      background: var(--navy-950);
      color: var(--white);
      text-align: left;
      padding: 10px 12px;
      font-weight: 700;
      border: 1px solid var(--navy-900);
    }

    .diag-table td {
      padding: 9px 12px;
      border: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-body);
    }

    .diag-table tr:nth-child(even) td {
      background: var(--gray-50);
    }

    .diag-table td:first-child {
      font-weight: 700;
      color: var(--navy-950);
      background: var(--gray-100);
    }

    /* Escada / Camadas Verticais */
    .diag-ladder {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ladder-step {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      background: var(--gray-50);
      border: 1px solid var(--border);
      border-left: 5px solid var(--navy-600);
    }

    .ladder-step.tone-dark {
      background: var(--navy-950);
      border-color: var(--navy-950);
      border-left: 5px solid var(--slate-500);
      color: var(--white);
    }

    .ladder-step.tone-dark h5 { color: var(--white); }
    .ladder-step.tone-dark p { color: var(--gray-100); }

    .ladder-step.tone-mid {
      background: var(--gray-100);
      border-left: 5px solid var(--navy-900);
    }

    .ladder-num {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--navy-900);
      color: var(--white);
      font-size: 0.76rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ladder-step.tone-dark .ladder-num {
      background: var(--gray-100);
      color: var(--navy-950);
    }

    .ladder-step h5 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy-950);
      margin-bottom: 2px;
    }

    .ladder-step p {
      font-size: 0.79rem;
      color: var(--text-body);
      line-height: 1.44;
    }

    /* ==========================================================================
       CARDS DE SUBCAPÍTULOS E VISÃO GERAL
       ========================================================================== */
    .sub-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      scroll-margin-top: calc(var(--topbar-h) + 18px);
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .sub-card.flash-focus {

            body: "A maior lição metodológica de Vertical é que mapas bidimensionais e metáforas naturalizadas de 'alto' e 'baixo' escondem relações vitais de poder. Quando cortamos a cidade na vertical, enxergamos de imediato que o brilho de um arranha-céu em Londres ou Dubai está conectado à extração de bauxita na Guiné, à areia roubada de praias asiáticas, ao ar sufocante nas ruas abaixo e aos porões superlotados onde dormem os trabalhadores que mantêm a cidade funcionando.",
            schemas: [
              {
                title: "O Ganho Analítico do Olhar em Seção Vertical",
                type: "compare",
                headers: ["O que o Mapa Plano Esconde", "O que o Corte Vertical Revela"],
                rows: [
                  ["Separa cidade rica do centro da mina distante no interior.", "Mostra a cadeia metabólica direta entre a torre (+830 m) e a mina (-4 km)."],
                  ["Trata a atmosfera e o solo como 'cenários naturais neutros'.", "Expõe domos de poluição, solo artificial e aquíferos comprimidos como política."],
                  ["Vê desigualdade apenas como distância horizontal (centro vs. periferia).", "Revela segregação empilhada no mesmo endereço (penthouses, poor doors, porões)."]
                ]
              }
            ]
          },
          {
            id: "sub-p-2",
            code: "P.2",
            title: "Horizontes de resistência no espaço tridimensional",
            body: "Graham reconhece que o livro apenas começou a mapear a enorme variedade de movimentos sociais que já contestam essas geografias verticais — dos observadores de satélites secretos (#NotABugSplat, Trevor Paglen) aos movimentos contra despejos e pela moradia, campanhas contra a máfia da areia (Awaaz), lutas Dalit pelo fim do trabalho manual em esgotos e redes contra a mineração predatória. Citando Paul Haacke e Arjun Appadurai, propõe uma imaginação progressista que conquiste um 'ponto de vista elevado' não para dominar de cima, mas para enxergar múltiplos futuros possíveis e agir democraticamente no presente.",
            schemas: [
              {
                title: "Ecossistema das Resistências Volumétricas (Exemplos do Livro)",
                type: "flow",
                nodes: [
                  { title: "No Céu e no Ar", body: "Contracartografia (Google Earth), Occucopter, #NotABugSplat e defesa do direito de respirar." },
                  { title: "Nas Torres e Ruas", body: "Luta por habitação social, crítica às poor doors, preservação da rua e movimentos horizontais.", tone: "mid" },
                  { title: "No Solo e Subsolo", body: "Combate à extração ilegal de areia, movimento Dalit por saneamento, UrbEx e resistência indígena contra minas.", tone: "dark" }
                ]
              }
            ]
          }
        ]
      }
    ];

    /* ==========================================================================
       MOTOR DE RENDERIZAÇÃO DOS ESQUEMAS E CONTEÚDO
       ========================================================================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderNode(item) {
      const toneClass = item.tone ? `tone-${item.tone}` : "";
      const bodyHtml = item.body ? `<p>${escapeHtml(item.body)}</p>` : "";
      const listHtml = item.bullets
        ? `<ul>${item.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}</ul>`
        : "";
      return `
        <div class="diag-node ${toneClass}">
          <h5>${escapeHtml(item.title)}</h5>
          ${bodyHtml}
          ${listHtml}
        </div>
      `;
    }

    function renderSchemaBody(schema) {
      if (schema.type === "svg") {
        return `<div class="svg-frame">${SVG_LIB[schema.svgKey] || ""}</div>`;
      }

      if (schema.type === "flow") {
        return `
          <div class="diag-flow">
            ${schema.nodes.map((n, i) => `
              ${renderNode(n)}
              ${i < schema.nodes.length - 1 ? `<div class="diag-arrow">→</div>` : ""}
            `).join("")}
          </div>
        `;
      }

      if (schema.type === "grid") {
        const cols = schema.cols || 3;
        return `
          <div class="diag-grid cols-${cols}">
            ${schema.items.map(renderNode).join("")}
          </div>
        `;
      }

      if (schema.type === "tension") {
        return `
          <div class="diag-tension">
            ${renderNode(schema.left)}
            <div class="tension-mid">
              <span class="sym">${escapeHtml(schema.mid.sym)}</span>
              <div>${escapeHtml(schema.mid.text)}</div>
            </div>
            ${renderNode(schema.right)}
          </div>
        `;
      }

      if (schema.type === "compare") {
        return `
          <div class="diag-table-wrap">
            <table class="diag-table">
              <thead>
                <tr>${schema.headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${schema.rows.map(row => `
                  <tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      if (schema.type === "ladder") {
        return `
          <div class="diag-ladder">
            ${schema.steps.map((s, idx) => `
              <div class="ladder-step ${s.tone || ""}">
                <div class="ladder-num">${idx + 1}</div>
                <div>
                  <h5>${escapeHtml(s.title)}</h5>
                  <p>${escapeHtml(s.body)}</p>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }

      return "";
    }

    function renderSchemaCard(schema, idx, isNested = false) {
      const isSvg = schema.type === "svg";
      const tagClass = isNested ? "sub-tag" : (isSvg ? "svg-tag" : "");
      const tagLabel = isNested
        ? "Esquema do Subcapítulo"
        : (isSvg ? "Esquema Visual (SVG)" : `Esquema Explicativo ${idx + 1}`);

      return `
        <div class="schema-card ${isNested ? "nested" : ""}">
          <div class="schema-head">
            <span class="schema-tag ${tagClass}">${tagLabel}</span>
            <h4 class="schema-title">${escapeHtml(schema.title)}</h4>
          </div>
          ${renderSchemaBody(schema)}
          ${schema.caption ? `<p class="schema-caption">${escapeHtml(schema.caption)}</p>` : ""}
        </div>
      `;
    }

    function renderOverviewCards() {
      const items = SECTIONS.filter(s => s.id !== "overview");
      return `
        <div class="block-head">
          <h3>Acesso Direto aos Capítulos da Parte 2</h3>
          <span class="block-pill">Capítulos 8–15 &amp; Posfácio</span>
        </div>
        <div class="overview-grid">
          ${items.map(sec => `
            <button class="overview-card-btn" data-goto-sec="${sec.id}">
              <div class="ov-num">${escapeHtml(sec.badge)}</div>
              <div class="ov-title">${escapeHtml(sec.title)}</div>
              <div class="ov-desc">${escapeHtml(sec.thesis.slice(0, 106))}...</div>
            </button>
          `).join("")}
        </div>
      `;
    }

    /* ==========================================================================
       CONTROLE DE NAVEGAÇÃO, SIDEBAR E TOPBAR
       ========================================================================== */
    const sidebarNavRoot = document.getElementById("sidebarNavRoot");
    const stageRoot = document.getElementById("stageRoot");
    const sidebar = document.getElementById("sidebar");
    const sidebarOverlay = document.getElementById("sidebarOverlay");
    const mobileMenuBtn = document.getElementById("mobileMenuBtn");
    const toggleExpandAllBtn = document.getElementById("toggleExpandAllBtn");
    const topPills = document.querySelectorAll(".top-pill");

    let allExpanded = false;

    function closeMobileSidebar() {
      sidebar.classList.remove("open");
      sidebarOverlay.classList.remove("open");
    }

    mobileMenuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      sidebarOverlay.classList.toggle("open");
    });

    sidebarOverlay.addEventListener("click", closeMobileSidebar);

    function buildSidebar() {
      let html = `
        <button class="nav-overview-btn active" data-open-sec="overview">
          <span>▥</span>
          <span>Visão Geral (Corte Vertical)</span>
        </button>
      `;

      const groups = [
        { key: "above", label: "Parte Um: Acima (Continuação)" },
        { key: "below", label: "Parte Dois: Abaixo (Below)" },
        { key: "afterword", label: "Fechamento" }
      ];

      groups.forEach(g => {
        html += `<div class="nav-group-label">${escapeHtml(g.label)}</div>`;
        SECTIONS.filter(s => s.group === g.key).forEach(sec => {
          const hasSubs = sec.subchapters && sec.subchapters.length > 0;
          html += `
            <div class="nav-item" data-nav-sec="${sec.id}">
              <div class="nav-item-row">
                <button class="nav-chap-btn" data-open-sec="${sec.id}">
                  <span class="nav-badge">${escapeHtml(sec.badge.replace("Capítulo ", "Cap. "))}</span>
                  <span>${escapeHtml(sec.title)}</span>
                </button>
                ${hasSubs ? `<button class="nav-toggle-sub" data-toggle-sec="${sec.id}" aria-label="Expandir subcapítulos">▸</button>` : ""}
              </div>
              ${hasSubs ? `
                <ul class="nav-sub-list">
                  ${sec.subchapters.map(sub => `
                    <li>
                      <button class="nav-sub-btn" data-open-sec="${sec.id}" data-open-sub="${sub.id}">
                        ${escapeHtml(sub.code)} ${escapeHtml(sub.title)}
                      </button>
                    </li>
                  `).join("")}
                </ul>
              ` : ""}
            </div>
          `;
        });
      });

      sidebarNavRoot.innerHTML = html;

      sidebarNavRoot.querySelectorAll("[data-open-sec]").forEach(btn => {
        btn.addEventListener("click", () => {
          renderSection(btn.dataset.openSec, btn.dataset.openSub || null);
        });
      });

      sidebarNavRoot.querySelectorAll("[data-toggle-sec]").forEach(btn => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          btn.closest(".nav-item").classList.toggle("expanded");
        });
      });
    }

    toggleExpandAllBtn.addEventListener("click", () => {
      allExpanded = !allExpanded;
      sidebarNavRoot.querySelectorAll(".nav-item").forEach(item => {
        if (item.querySelector(".nav-sub-list")) {
          item.classList.toggle("expanded", allExpanded);
        }
      });
      toggleExpandAllBtn.textContent = allExpanded ? "Recolher" : "Expandir";
    });

    topPills.forEach(pill => {
      pill.addEventListener("click", () => {
        renderSection(pill.dataset.jumpTarget);
      });
    });

    function renderSection(secId, subId = null) {
      const idx = SECTIONS.findIndex(s => s.id === secId);
      if (idx === -1) return;

      const sec = SECTIONS[idx];
      const prevSec = idx > 0 ? SECTIONS[idx - 1] : null;
      const nextSec = idx < SECTIONS.length - 1 ? SECTIONS[idx + 1] : null;

      // Atualiza pílulas da barra superior
      topPills.forEach(pill => {
        pill.classList.toggle("active", pill.dataset.jumpGroup === sec.group);
      });

      // Atualiza sidebar
      const overviewBtn = sidebarNavRoot.querySelector(".nav-overview-btn");
      if (overviewBtn) overviewBtn.classList.toggle("active", secId === "overview");

      sidebarNavRoot.querySelectorAll(".nav-item").forEach(item => {
        const isCurrent = item.dataset.navSec === secId;
        item.classList.toggle("active-chapter", isCurrent);
        if (isCurrent && item.querySelector(".nav-sub-list")) {
          item.classList.add("expanded");
        }
      });

      sidebarNavRoot.querySelectorAll(".nav-sub-btn").forEach(btn => {
        btn.classList.toggle("active-sub", Boolean(subId && btn.dataset.openSub === subId));
      });

      const hasSubs = sec.subchapters && sec.subchapters.length > 0;

      stageRoot.innerHTML = `
        <div class="hero-card">
          <div class="hero-tags">
            <span class="tag-solid">${escapeHtml(sec.badge)}</span>
            <span class="tag-ghost">${escapeHtml(sec.partLabel)}</span>
          </div>
          <h2 class="hero-title">${escapeHtml(sec.title)}</h2>
          <div class="hero-orig">${escapeHtml(sec.origTitle)}</div>
          <p class="hero-lead">${escapeHtml(sec.lead)}</p>
        </div>

        <div class="thesis-box">
          <div class="thesis-kicker">◆ Argumento / Questão Central</div>
          <p class="thesis-text">${escapeHtml(sec.thesis)}</p>
        </div>

        ${hasSubs ? `
          <div class="sub-pills" aria-label="Atalhos dos subcapítulos">
            ${sec.subchapters.map(sub => `
              <button class="sub-pill" data-jump-sub="${sub.id}">
                ${escapeHtml(sub.code)} ${escapeHtml(sub.title)}
              </button>
            `).join("")}
          </div>
        ` : ""}

        <div class="block-head">
          <h3>${sec.isOverview ? "Corte Vertical Interativo — Parte 2" : "Esquemas Explicativos do Capítulo"}</h3>
          <span class="block-pill">${sec.schemas.length} ${sec.schemas.length === 1 ? "Diagrama" : "Diagramas"}</span>
        </div>

        ${sec.schemas.map((sc, i) => renderSchemaCard(sc, i, false)).join("")}

        ${sec.isOverview ? renderOverviewCards() : ""}

        ${hasSubs ? `
          <div class="block-head">
            <h3>Subcapítulos e Esquemas Específicos</h3>
            <span class="block-pill">${sec.subchapters.length} Subcapítulos</span>
          </div>

          ${sec.subchapters.map(sub => `
            <article class="sub-card" id="${sub.id}">
              <div class="sub-head">
                <span class="sub-code">${escapeHtml(sub.code)}</span>
                <h4 class="sub-title">${escapeHtml(sub.title)}</h4>
              </div>
              <p class="sub-body">${escapeHtml(sub.body)}</p>
              ${sub.schemas.map((sc, i) => renderSchemaCard(sc, i, true)).join("")}
            </article>
          `).join("")}
        ` : ""}

        <div class="pager-nav">
          ${prevSec ? `<button class="pager-btn" data-goto-sec="${prevSec.id}">← Anterior: ${escapeHtml(prevSec.badge)} — ${escapeHtml(prevSec.title)}</button>` : "<span></span>"}
          ${nextSec ? `<button class="pager-btn next" data-goto-sec="${nextSec.id}">Próximo: ${escapeHtml(nextSec.badge)} — ${escapeHtml(nextSec.title)} →</button>` : `<button class="pager-btn next" data-goto-sec="overview">Voltar ao Corte Vertical ↺</button>`}
        </div>
      `;

      // Liga eventos dinâmicos
      stageRoot.querySelectorAll("[data-goto-sec]").forEach(btn => {
        btn.addEventListener("click", () => renderSection(btn.dataset.gotoSec));
      });

      stageRoot.querySelectorAll("[data-svg-goto]").forEach(el => {
        el.addEventListener("click", () => renderSection(el.dataset.svgGoto));
      });

      stageRoot.querySelectorAll("[data-jump-sub]").forEach(btn => {
        btn.addEventListener("click", () => scrollToSub(btn.dataset.jumpSub));
      });

      closeMobileSidebar();

      if (subId) {
        setTimeout(() => scrollToSub(subId), 45);
      } else {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function scrollToSub(subId) {
      const el = document.getElementById(subId);
      if (!el) return;

      sidebarNavRoot.querySelectorAll(".nav-sub-btn").forEach(btn => {
        btn.classList.toggle("active-sub", btn.dataset.openSub === subId);
      });

      el.scrollIntoView({ behavior: "smooth", block: "start" });
      el.classList.remove("flash-focus");
      void el.offsetWidth;
      el.classList.add("flash-focus");
      setTimeout(() => el.classList.remove("flash-focus"), 1700);
    }

    // Inicializa a Parte 2
    buildSidebar();
    renderSection("overview");
  </script>
</body>
</html>
