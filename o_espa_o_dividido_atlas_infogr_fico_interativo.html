<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O Espaço Dividido — Atlas Infográfico Interativo | Milton Santos</title>

  <style>
    /* =========================================================================
       TOKENS DE DESIGN — PALETA EDITORIAL (COLEÇÃO MILTON SANTOS / EDUSP)
       Contraste estrutural do "Espaço Dividido": Azul-Petróleo vs. Terracota
       ========================================================================= */
    :root {
      --bg-paper: #F6F2E9;
      --bg-card: #FFFDF8;
      --border-soft: #E2D9C8;
      --border-strong: #CBBFA9;

      --text-main: #1C232B;
      --text-muted: #4E5965;

      /* Circuito Superior — Azul-Petróleo Profundo */
      --sup: #1B4965;
      --sup-light: #2C6E91;
      --sup-soft: #E6F0F5;

      /* Circuito Inferior — Terracota-Barro */
      --inf: #C45B2C;
      --inf-light: #DC7646;
      --inf-soft: #FBECE5;

      /* Destaque — Ocre / Dourado Editorial */
      --ochre: #C88A2B;
      --ochre-soft: #FBF3E1;

      /* Apoio — Verde-Oliva Geográfico (Síntese / Território) */
      --olive: #366858;
      --olive-soft: #E7F2EE;

      /* Tipografia 100% sistema (zero dependências externas) */
      --font-serif: Georgia, 'Times New Roman', Cambria, serif;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

      --sidebar-w: 290px;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow-sm: 0 2px 8px rgba(27, 73, 101, 0.06);
      --shadow-md: 0 10px 28px rgba(28, 35, 43, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-paper);
      color: var(--text-main);
      font-family: var(--font-sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      background-image: radial-gradient(rgba(27, 73, 101, 0.045) 1px, transparent 0);
      background-size: 24px 24px;
      overflow-x: hidden;
    }

    button, input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================================================================
       ESTRUTURA PRINCIPAL E BARRA LATERAL
       ========================================================================= */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Barra superior Mobile */
    .mobile-header {
      display: none;
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(246, 242, 233, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-soft);
      padding: 12px 16px;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--sup);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.16s ease;
    }
    .icon-btn:hover {
      background: var(--sup-soft);
      border-color: var(--sup);
    }

    .mobile-title-wrap {
      text-align: center;
      flex: 1;
      min-width: 0;
    }
    .mobile-title-wrap strong {
      display: block;
      font-family: var(--font-serif);
      font-size: 1rem;
      color: var(--sup);
      line-height: 1.15;
    }
    .mobile-title-wrap span {
      font-family: var(--font-mono);
      font-size: 0.64rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--inf);
    }

    .mobile-progress-badge {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--sup-soft);
      color: var(--sup);
      border: 1px solid rgba(27, 73, 101, 0.25);
      white-space: nowrap;
    }

    /* Overlay do drawer mobile */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(28, 35, 43, 0.45);
      z-index: 45;
    }
    .sidebar-overlay.open {
      display: block;
    }

    /* Barra Lateral Fixa (290px) */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      position: sticky;
      top: 0;
      height: 100vh;
      background: var(--bg-card);
      border-right: 1px solid var(--border-soft);
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: transform 0.24s ease;
    }

    .sidebar-brand {
      padding: 20px 18px 16px;
      background: linear-gradient(148deg, var(--sup) 0%, #123347 68%, #2B3B45 100%);
      color: #F6F2E9;
      position: relative;
      border-bottom: 3px solid var(--inf);
    }

    .brand-tag {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(200, 138, 43, 0.25);
      border: 1px solid rgba(251, 243, 225, 0.28);
      color: #FBF3E1;
      margin-bottom: 8px;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 1.38rem;
      font-weight: 700;
      line-height: 1.15;
      color: #FFFFFF;
    }

    .brand-author {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: #F6D8A4;
      margin-top: 5px;
      letter-spacing: 0.04em;
    }

    .close-drawer-btn {
      display: none;
      position: absolute;
      top: 14px;
      right: 14px;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
    }

    /* Progresso na Sidebar */
    .progress-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      margin-bottom: 6px;
      color: rgba(246, 242, 233, 0.9);
    }
    .progress-meta strong {
      font-family: var(--font-mono);
      color: #F6D8A4;
    }
    .progress-track {
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--inf-light), var(--ochre));
      transition: width 0.3s ease;
    }

    /* Campo de Busca */
    .search-panel {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-soft);
      background: #FAF6ED;
    }
    .search-field-wrap {
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 9px 32px 9px 32px;
      font-size: 0.8rem;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .search-input:focus {
      border-color: var(--sup);
      box-shadow: 0 0 0 3px rgba(27, 73, 101, 0.12);
    }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }
    .search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 24px;
      height: 24px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
    }
    .search-clear.visible {
      display: inline-flex;
    }
    .search-clear:hover {
      background: var(--border-soft);
      color: var(--text-main);
    }

    /* Lista de Navegação */
    .sidebar-nav {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 20px;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: flex-start;
      gap: 9px;
      color: var(--text-main);
      transition: all 0.15s ease;
      margin-bottom: 3px;
    }
    .nav-btn:hover {
      background: var(--bg-paper);
      border-color: var(--border-soft);
    }
    .nav-btn.active {
      background: var(--sup-soft);
      border-color: rgba(27, 73, 101, 0.35);
    }

    .nav-num {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 7px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-paper);
      color: var(--text-muted);
      border: 1px solid var(--border-soft);
      margin-top: 1px;
    }
    .nav-btn.active .nav-num {
      background: var(--sup);
      color: #FFFFFF;
      border-color: var(--sup);
    }

    .nav-text {
      flex: 1;
      min-width: 0;
    }
    .nav-title {
      display: block;
      font-size: 0.79rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--text-main);
    }
    .nav-btn.active .nav-title {
      color: var(--sup);
    }
    .nav-sub {
      display: block;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .nav-check {
      flex-shrink: 0;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: 1.5px solid var(--border-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      color: transparent;
      margin-top: 2px;
      transition: all 0.16s ease;
    }
    .nav-check.done {
      background: var(--olive);
      border-color: var(--olive);
      color: #FFFFFF;
    }

    .part-group {
      margin-top: 13px;
    }
    .part-header {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 8px 6px;
      font-family: var(--font-mono);
      font-size: 0.63rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .part-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 10px 14px;
      border-top: 1px solid var(--border-soft);
      background: #FAF6ED;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .reset-link {
      background: transparent;
      border: none;
      color: var(--inf);
      font-size: 0.7rem;
      font-weight: 600;
      text-decoration: underline;
    }

    /* =========================================================================
       ÁREA PRINCIPAL DE CONTEÚDO
       ========================================================================= */
    .main-area {
      flex: 1;
      min-width: 0;
      padding: 32px 38px 64px;
    }

    .page-wrap {
      max-width: 980px;
      margin: 0 auto;
      animation: fadeSlide 0.25s ease-out;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cabeçalho de Capítulo */
    .chapter-head {
      margin-bottom: 24px;
    }
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .part-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 5px 12px;
      border-radius: 999px;
      color: #FFFFFF;
    }

    .study-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-strong);
      background: var(--bg-card);
      color: var(--text-main);
      transition: all 0.16s ease;
    }
    .study-btn:hover {
      border-color: var(--olive);
      color: var(--olive);
    }
    .study-btn.studied {
      background: var(--olive);
      border-color: var(--olive);
      color: #FFFFFF;
    }

    .chapter-title {
      font-family: var(--font-serif);
      font-size: clamp(1.7rem, 3vw, 2.38rem);
      font-weight: 700;
      line-height: 1.18;
      color: var(--text-main);
    }

    .chapter-lead {
      margin-top: 9px;
      font-size: 0.96rem;
      color: var(--text-muted);
      max-width: 820px;
      line-height: 1.65;
    }

    .editorial-rule {
      height: 5px;
      width: 100%;
      margin: 18px 0 22px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--sup) 0%, var(--sup) 48%, var(--inf) 48%, var(--inf) 100%);
      opacity: 0.85;
    }

    /* Citação / Ideia-Força */
    .quote-box {
      background: var(--sup-soft);
      border-left: 4px solid var(--sup);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 18px 22px;
      margin-bottom: 24px;
    }
    .quote-box p {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1.08rem;
      color: var(--text-main);
      line-height: 1.55;
    }
    .quote-box footer {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 0.69rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    /* Cartões e Infográfico */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 24px 26px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    .infographic-card {
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow-md);
      margin-bottom: 26px;
      position: relative;
    }

    .kicker {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      color: var(--sup);
      margin-bottom: 5px;
    }
    .heading-md {
      font-family: var(--font-serif);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      margin-bottom: 6px;
    }
    .sub-lead {
      font-size: 0.87rem;
      color: var(--text-muted);
      margin-bottom: 18px;
      max-width: 780px;
    }

    /* Grid de Ideias-Chave */
    .ideas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 12px;
      margin-bottom: 26px;
    }
    .idea-card {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.16s ease, border-color 0.16s ease;
    }
    .idea-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-strong);
    }
    .idea-tag {
      display: block;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 5px;
    }
    .idea-card h4 {
      font-family: var(--font-serif);
      font-size: 1.03rem;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.28;
    }
    .idea-card p {
      font-size: 0.83rem;
      color: var(--text-muted);
      line-height: 1.54;
    }

    /* Controles Interativos */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .ctrl-btn {
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-soft);
      background: var(--bg-paper);
      color: var(--text-main);
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.16s ease;
    }
    .ctrl-btn:hover {
      border-color: var(--sup);
      background: var(--sup-soft);
    }
    .ctrl-btn.active-sup {
      background: var(--sup);
      color: #FFFFFF;
      border-color: var(--sup);
      box-shadow: 0 2px 8px rgba(27, 73, 101, 0.24);
    }
    .ctrl-btn.active-inf {
      background: var(--inf);
      color: #FFFFFF;
      border-color: var(--inf);
      box-shadow: 0 2px 8px rgba(196, 91, 44, 0.24);
    }
    .ctrl-btn.active-ochre {
      background: var(--ochre);
      color: #FFFFFF;
      border-color: var(--ochre);
    }
    .ctrl-btn.active-olive {
      background: var(--olive);
      color: #FFFFFF;
      border-color: var(--olive);
    }

    .panel-soft {
      background: #FAF6ED;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 18px;
    }

    .svg-box {
      width: 100%;
      background: #FAF6ED;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 14px;
      overflow: hidden;
    }
    .svg-box svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Grids utilitários */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    /* Sliders */
    input[type="range"].atlas-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 7px;
      border-radius: 999px;
      background: var(--border-soft);
      outline: none;
    }
    input[type="range"].atlas-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--sup);
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(27, 73, 101, 0.35);
      cursor: pointer;
    }
    input[type="range"].atlas-range::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--sup);
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 6px rgba(27, 73, 101, 0.35);
      cursor: pointer;
    }

    /* Barras de Medição / Dados */
    .meter-item {
      margin-bottom: 12px;
    }
    .meter-item:last-child {
      margin-bottom: 0;
    }
    .meter-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-size: 0.79rem;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .meter-head span:last-child {
      font-family: var(--font-mono);
    }
    .meter-track {
      width: 100%;
      height: 11px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 999px;
      overflow: hidden;
    }
    .meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.35s ease;
    }

    /* Chips */
    .chip {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 600;
      border: 1px solid var(--border-soft);
      background: var(--bg-card);
      color: var(--text-main);
    }
    .chip-sup { background: var(--sup-soft); border-color: rgba(27,73,101,0.3); color: var(--sup); }
    .chip-inf { background: var(--inf-soft); border-color: rgba(196,91,44,0.32); color: #9A411A; }
    .chip-ochre { background: var(--ochre-soft); border-color: rgba(200,138,43,0.38); color: #8A5B14; }
    .chip-olive { background: var(--olive-soft); border-color: rgba(54,104,88,0.3); color: var(--olive); }

    /* Tabelas */
    .table-scroll {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-md);
    }
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
      background: var(--bg-card);
    }
    .data-table th, .data-table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border-soft);
      text-align: left;
      vertical-align: top;
    }
    .data-table th {
      font-family: var(--font-mono);
      font-size: 0.69rem;

    function loadStudied() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) {
        return {};
      }
    }

    function saveStudied() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(studiedMap));
      } catch (e) {
        // Silencioso caso bloqueado
      }
    }

    let toastTimer = null;
    function showToast(text) {
      const el = document.getElementById('toast');
      const msg = document.getElementById('toast-msg');
      if (!el || !msg) return;
      msg.textContent = text;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    function norm(str) {
      return String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function toggleStudied(id, evt) {
      if (evt) evt.stopPropagation();
      studiedMap[id] = !studiedMap[id];
      saveStudied();
      renderSidebar();
      renderMain();
      showToast(studiedMap[id] ? `Capítulo ${id} marcado como estudado.` : `Capítulo ${id} desmarcado.`);
    }

    function resetProgress() {
      studiedMap = {};
      saveStudied();
      renderSidebar();
      renderMain();
      showToast('Progresso de estudo reiniciado.');
    }

    function navigateTo(target) {
      currentView = target;

      document.getElementById('sidebar').classList.add('open');

    function renderSidebar() {
      const nav = document.getElementById('sidebar-nav');
      const q = norm(searchQuery.trim());

      const done = CHAPTERS.filter(c => studiedMap[c.id]).length;
      const pct = Math.round((done / CHAPTERS.length) * 100);
      document.getElementById('sidebar-progress-text').textContent = `${done}/11 estudados (${pct}%)`;
      document.getElementById('sidebar-progress-fill').style.width = `${pct}%`;
      document.getElementById('mobile-progress-badge').textContent = `${done}/11`;

      let html = '';
      const showOverview = !q || norm('mapa geral prefacio figura 1 elementos dois circuitos').includes(q);

      if (showOverview) {
        html += `
          <button type="button" class="nav-btn ${currentView === 'overview' ? 'active' : ''}" onclick="navigateTo('overview')">
            <span class="nav-num">§0</span>
            <span class="nav-text">
              <span class="nav-title">Mapa Geral da Obra</span>
              <span class="nav-sub">Arquitetura, Prefácio &amp; Figura 1</span>
            </span>
          </button>
        `;
      }

      let found = showOverview ? 1 : 0;

      Object.values(PARTS).forEach(part => {
        const list = CHAPTERS.filter(ch => {
          if (ch.part !== part.id) return false;
          if (!q) return true;
          const hay = norm(`${ch.id} ${ch.title} ${part.label} ${part.title} ${ch.keywords.join(' ')}`);
          return hay.includes(q);
        });
        if (!list.length) return;
        found += list.length;

        html += `
          <div class="part-group">
            <div class="part-header">
              <span class="part-dot" style="background:${part.color}"></span>
              <span>${part.label} — ${part.title}</span>
            </div>
        `;

        list.forEach(ch => {
          const active = currentView === ch.id;
          const isDone = !!studiedMap[ch.id];
          html += `
            <button type="button" class="nav-btn ${active ? 'active' : ''}" onclick="navigateTo(${ch.id})">
              <span class="nav-num" style="${active ? `background:${part.color};border-color:${part.color};color:#fff;` : `border-left:3px solid ${part.color};`}">${ch.id}</span>
              <span class="nav-text">

              </span>
              <span class="nav-check ${isDone ? 'done' : ''}" title="${isDone ? 'Estudado' : 'Marcar como estudado'}" onclick="toggleStudied(${ch.id}, event)">✓</span>
            </button>
          `;
        });

        html += `</div>`;
      });

      if (!found) {
        html = `<div style="padding:18px;font-size:0.8rem;color:var(--text-muted);text-align:center;">Nenhum resultado encontrado para "<strong>${searchQuery}</strong>".</div>`;
      }

      nav.innerHTML = html;
    }

      return `
        <span class="kicker" style="color:var(--olive);">Infográfico Exclusivo • Cap. 11</span>
        <h3 class="heading-md">Síntese &amp; Agenda de Planificação do Espaço Dividido</h3>
        <p class="sub-lead">Clique nos 4 pilares estratégicos propostos por Milton Santos na Conclusão e revise o quadro comparativo final da transformação proposta.</p>

        <div class="grid-4" style="margin-bottom:14px;">
          ${pillars.map((item, i) => `
            <button type="button" class="ctrl-btn ${ui.c11Pillar===i ? 'active-olive' : ''}" style="text-align:left;padding:11px 12px;" onclick="ui.c11Pillar=${i}; renderMain();">
              ${item.n}
            </button>
          `).join('')}
        </div>

        <div class="panel-soft" style="border-left:4px solid ${p.c};margin-bottom:20px;">
          <span class="chip" style="border-color:${p.c};color:${p.c};margin-bottom:6px;">${p.tag}</span>
          <h4 style="font-family:var(--font-serif);font-size:1.1rem;color:${p.c};margin-bottom:5px;">${p.n}</h4>
          <p style="font-size:0.85rem;color:var(--text-main);">${p.d}</p>
        </div>

        <div class="table-scroll">
          <table class="data-table">
            <thead>
              <tr>
                <th>Dimensão</th>
                <th style="background:var(--inf-soft);color:var(--inf);">Espaço Dividido Atual (Liberal / Monopolista)</th>
                <th style="background:var(--olive-soft);color:var(--olive);">Horizonte Proposto (Produtividade Social)</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><strong>Objetivo da Produção</strong></td>
                <td>Lucro monopolista, exportação e consumo de minorias.</td>
                <td>Bem-estar coletivo, consumo popular e mercado interno.</td>
              </tr>
              <tr>
                <td><strong>Relação entre Circuitos</strong></td>
                <td>Dominação e drenagem da poupança popular para cima.</td>
                <td>Comunicação, elevação da produtividade e absorção gradual sem choques.</td>
              </tr>
              <tr>
                <td><strong>Papel do Estado</strong></td>
                <td>Endividado, financiador de multinacionais ("menos Estado").</td>
                <td>Regulador soberano, investidor social ("mais Estado").</td>
              </tr>
              <tr>
                <td><strong>Organização Espacial</strong></td>
                <td>Macrocefalia, enclaves, curto-circuito e empobrecimento periférico.</td>
                <td>Modernização nacional regionalizada e fortalecimento das cidades regionais.</td>
              </tr>
            </tbody>
          </table>
        </div>
      `;
    }

    /* =========================================================================
       RENDERIZAÇÃO DE CAPÍTULO COMPLETO
       ========================================================================= */

    function renderChapter(ch) {
      const part = PARTS[ch.part];
      const isDone = !!studiedMap[ch.id];

      const prevTarget = ch.id === 1 ? 'overview' : ch.id - 1;
      const prevTitle = ch.id === 1 ? 'Mapa Geral da Obra' : `Cap. ${ch.id - 1} — ${CHAPTERS[ch.id - 2].title}`;

      const nextTarget = ch.id < 11 ? ch.id + 1 : 'overview';
      const nextTitle = ch.id < 11 ? `Cap. ${ch.id + 1} — ${CHAPTERS[ch.id].title}` : 'Voltar ao Mapa Geral da Obra';

      return `
        <header class="chapter-head">
          <div class="meta-bar">
            <span class="part-pill" style="background:${part.color};">${part.label} • ${part.title}</span>
            <button type="button" class="study-btn ${isDone ? 'studied' : ''}" onclick="toggleStudied(${ch.id})">
              <span>${isDone ? '✓' : '○'}</span>
              <span>${isDone ? 'Capítulo Estudado' : 'Marcar como estudado'}</span>
            </button>
          </div>
          <h2 class="chapter-title">Capítulo ${ch.id} — ${ch.title}</h2>
          <p class="chapter-lead">${ch.summary}</p>
          <div class="editorial-rule"></div>
        </header>

        <!-- Citação / Ideia-Força -->
        <blockquote class="quote-box" style="background:${part.soft};border-left-color:${part.color};">
          <p>“${ch.quote}”</p>
          <footer>— Milton Santos, ${ch.quoteRef}</footer>
        </blockquote>

        <!-- Ideias-Chave Principais -->
        <section>
          <span class="kicker" style="color:${part.color};">Síntese Analítica</span>
          <h3 class="heading-md">Ideias-Chave Principais</h3>
          <div class="ideas-grid">
            ${ch.keyIdeas.map(item => `
              <article class="idea-card">
                <span class="idea-tag" style="color:${part.color};">${item.tag}</span>
                <h4>${item.title}</h4>
                <p>${item.desc}</p>
              </article>
            `).join('')}
          </div>
        </section>

        <!-- Infográfico Interativo Exclusivo -->
        <section class="infographic-card">
          ${renderChapterInfographic(ch.id)}
        </section>

        <!-- Navegação Inferior -->
        <nav class="chapter-footer" aria-label="Navegação entre capítulos">
          <button type="button" class="footer-nav-btn" onclick="navigateTo(${typeof prevTarget === 'string' ? `'${prevTarget}'` : prevTarget})">
            <span style="font-size:1.15rem;color:var(--sup);">←</span>
            <div>
              <span class="footer-nav-meta">Capítulo Anterior</span>
              <span class="footer-nav-title">${prevTitle}</span>
            </div>
          </button>

          <button type="button" class="footer-nav-btn next" onclick="navigateTo(${typeof nextTarget === 'string' ? `'${nextTarget}'` : nextTarget})">
            <div>
              <span class="footer-nav-meta">${ch.id < 11 ? 'Próximo Capítulo' : 'Concluir Percurso'}</span>
              <span class="footer-nav-title">${nextTitle}</span>
            </div>
            <span style="font-size:1.15rem;">${ch.id < 11 ? '→' : '↺'}</span>
          </button>
        </nav>
      `;
    }

    function renderMain() {
      const container = document.getElementById('main-content');
      if (!container) return;
      if (currentView === 'overview') {
        container.innerHTML = renderOverview();
      } else {
        const ch = CHAPTERS.find(c => c.id === currentView);
        container.innerHTML = ch ? renderChapter(ch) : renderOverview();
      }
    }

    /* =========================================================================
       INICIALIZAÇÃO SEGURA
       ========================================================================= */

    document.addEventListener('DOMContentLoaded', () => {
      try {
        document.getElementById('open-drawer-btn').addEventListener('click', openDrawer);
        document.getElementById('close-drawer-btn').addEventListener('click', closeDrawer);
        document.getElementById('sidebar-overlay').addEventListener('click', closeDrawer);
        document.getElementById('reset-progress-btn').addEventListener('click', resetProgress);

        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');

        searchInput.addEventListener('input', (e) => {
          searchQuery = e.target.value;
          searchClear.classList.toggle('visible', searchQuery.length > 0);
          renderSidebar();
        });

        searchClear.addEventListener('click', () => {
          searchQuery = '';
          searchInput.value = '';
          searchClear.classList.remove('visible');
          renderSidebar();
          searchInput.focus();
        });

        renderSidebar();
        renderMain();
      } catch (err) {
        console.error('Erro ao inicializar o Atlas de O Espaço Dividido:', err);
      }
    });
  </script>
</body>
</html>
