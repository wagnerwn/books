<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical (Stephen Graham) — Parte 1: Do Espaço aos Arranha-céus</title>
  <style>
    /* ==========================================================================
       DESIGN TOKENS — PALETA ESTRITAMENTE AZUL MARINHO E CINZA CLARO
       ========================================================================== */
    :root {
      --navy-950: #0b1d36;
      --navy-900: #102a4c;
      --navy-700: #1d3f6e;
      --navy-600: #2d5585;
      --navy-400: #4a6f99;

      --gray-50:  #f2f5f9;
      --gray-100: #e6ecf3;
      --gray-200: #d8e1ec;
      --white:    #ffffff;

      --text-main:  #0f172a;
      --text-body:  #334155;
      --text-muted: #5b6b80;
      --border:     #cbd5e1;

      --font-serif: Georgia, 'Times New Roman', serif;
      --font-sans:  -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;

      --sidebar-w: 318px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 2px 8px rgba(11, 29, 54, 0.06);
      --shadow-md: 0 8px 24px rgba(11, 29, 54, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--gray-50);
      color: var(--text-main);
      line-height: 1.65;
      overflow-x: hidden;
    }

    /* ==========================================================================
       BARRA MOBILE (APENAS TELAS PEQUENAS)
       ========================================================================== */
    .mobile-bar {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 58px;
      background: var(--navy-950);
      color: var(--white);
      padding: 0 16px;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      border-bottom: 2px solid var(--navy-600);
      box-shadow: 0 4px 12px rgba(11, 29, 54, 0.25);
    }

    .mobile-brand {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .mobile-brand span {
      color: var(--gray-200);
      font-family: var(--font-sans);
      font-size: 0.76rem;
      font-weight: 500;
      margin-left: 6px;
    }

    .mobile-toggle {
      background: var(--navy-700);
      border: 1px solid var(--navy-400);
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
    }

    /* ==========================================================================
       LAYOUT PRINCIPAL: SIDEBAR FIXA + ÁREA EDITORIAL
       ========================================================================== */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-w);
      background: linear-gradient(180deg, var(--navy-950) 0%, var(--navy-900) 100%);
      color: var(--gray-100);
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--navy-700);
      z-index: 950;
      transition: transform 0.25s ease;
    }

    .sidebar-head {
      padding: 20px 16px 14px;
      border-bottom: 1px solid rgba(216, 225, 236, 0.16);
    }

    .sidebar-kicker {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #9cb4cf;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .sidebar-title {
      font-family: var(--font-serif);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1.2;
    }

    .sidebar-author {
      font-size: 0.76rem;
      color: #b7c8dc;
      margin-top: 3px;
    }

    .sidebar-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .btn-sidebar-ctrl {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(216, 225, 236, 0.24);
      color: var(--gray-50);
      font-family: var(--font-sans);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-sidebar-ctrl:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 20px;
    }

    .sidebar-scroll::-webkit-scrollbar { width: 6px; }
    .sidebar-scroll::-webkit-scrollbar-thumb { background: var(--navy-700); border-radius: 4px; }

    .nav-overview-btn {
      width: 100%;
      text-align: left;
      background: rgba(74, 111, 153, 0.25);
      border: 1px solid rgba(216, 225, 236, 0.28);
      color: var(--white);
      font-family: var(--font-sans);
      font-size: 0.81rem;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      transition: all 0.15s;
    }

    .nav-overview-btn:hover {
      background: rgba(74, 111, 153, 0.42);
    }

    .nav-overview-btn.active {
      background: var(--gray-100);
      color: var(--navy-950);
      border-color: var(--white);
    }

    .nav-group-label {
      font-size: 0.67rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #94aec9;
      padding: 8px 6px 5px;
      margin-top: 6px;
    }

    .nav-item {
      margin-bottom: 6px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(216, 225, 236, 0.09);
      overflow: hidden;
    }

    .nav-item.active-chapter {
      background: rgba(45, 85, 133, 0.45);
      border-color: var(--gray-200);
    }

    .nav-item-row {
      display: flex;
      align-items: stretch;
    }

    .nav-chap-btn {
      flex: 1;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--gray-50);
      font-family: var(--font-sans);
      font-size: 0.79rem;
      font-weight: 600;
      padding: 9px 8px 9px 10px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      line-height: 1.35;
    }

    .nav-chap-btn:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .nav-badge {
      flex: 0 0 auto;
      background: var(--navy-700);
      color: var(--gray-100);
      font-size: 0.67rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 1px;
    }

    .nav-item.active-chapter .nav-badge {
      background: var(--white);
      color: var(--navy-950);
    }

    .nav-toggle-sub {
      width: 30px;
      background: transparent;
      border: none;
      border-left: 1px solid rgba(216, 225, 236, 0.12);
      color: #9cb4cf;
      font-size: 0.72rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, color 0.15s;
    }

    .nav-toggle-sub:hover { color: var(--white); }
    .nav-item.expanded .nav-toggle-sub {
      transform: rotate(90deg);
      color: var(--white);
    }

    .nav-sub-list {
      display: none;
      list-style: none;
      padding: 4px 8px 8px 16px;
      border-top: 1px solid rgba(216, 225, 236, 0.1);
      background: rgba(11, 29, 54, 0.45);
    }

    .nav-item.expanded .nav-sub-list {
      display: block;
    }

    .nav-sub-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-left: 2px solid rgba(216, 225, 236, 0.25);
      color: #c8d6e6;
      font-family: var(--font-sans);
      font-size: 0.74rem;
      padding: 5px 8px 5px 10px;
      cursor: pointer;
      line-height: 1.35;
      transition: all 0.15s;
    }

    .nav-sub-btn:hover {
      color: var(--white);
      border-left-color: var(--white);
    }

    .nav-sub-btn.active-sub {
      color: var(--white);
      font-weight: 700;
      border-left-color: var(--white);
      background: rgba(255, 255, 255, 0.1);
    }

    .sidebar-foot {
      padding: 12px 16px;
      border-top: 1px solid rgba(216, 225, 236, 0.16);
      background: rgba(11, 29, 54, 0.7);
      font-size: 0.72rem;
      color: #a9bed6;
      line-height: 1.45;
    }

    .sidebar-foot strong {
      color: var(--white);
      display: block;
      margin-bottom: 2px;
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 29, 54, 0.55);
      z-index: 900;
    }

    /* ==========================================================================
       ÁREA PRINCIPAL DE CONTEÚDO
       ========================================================================== */
    .main-stage {
      margin-left: var(--sidebar-w);
      flex: 1;
      max-width: calc(100% - var(--sidebar-w));
      padding: 32px 40px 76px;
    }

    .content-wrap {
      max-width: 1020px;
      margin: 0 auto;
      animation: fadeIn 0.22s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cabeçalho de Seção */
    .hero-card {
      background: linear-gradient(135deg, var(--navy-950) 0%, var(--navy-900) 65%, var(--navy-700) 100%);
      color: var(--white);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-md);
      border-left: 6px solid var(--navy-400);
    }

    .hero-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .tag-solid {
      background: var(--gray-100);
      color: var(--navy-950);
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .tag-ghost {
      border: 1px solid rgba(216, 225, 236, 0.4);
      color: var(--gray-100);
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 4px;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 1.9rem;
      font-weight: 700;
      line-height: 1.24;
      color: var(--white);
      margin-bottom: 5px;
    }

    .hero-orig {
      font-size: 0.84rem;
      color: #b7c8dc;
      font-style: italic;
      margin-bottom: 12px;
    }

    .hero-lead {
      font-size: 0.96rem;
      color: var(--gray-100);
      max-width: 860px;
    }

    /* Caixa de Tese Central */
    .thesis-box {
      background: var(--white);
      border: 1px solid var(--border);
      border-left: 5px solid var(--navy-900);
      border-radius: var(--radius-md);
      padding: 18px 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
    }

    .thesis-kicker {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--navy-700);
      margin-bottom: 6px;
    }

    .thesis-text {
      font-size: 0.95rem;
      color: var(--text-main);
      font-weight: 500;
    }

    /* Pílulas de Subcapítulos */
    .sub-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 26px;
    }

    .sub-pill {
      background: var(--white);
      border: 1px solid var(--border);
      color: var(--navy-900);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: var(--shadow-sm);
    }

    .sub-pill:hover {
      background: var(--navy-900);
      color: var(--white);
      border-color: var(--navy-900);
    }

    /* Divisor de Bloco */
    .block-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 28px 0 16px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--gray-200);
    }

    .block-head h3 {
      font-family: var(--font-serif);
      font-size: 1.28rem;
      color: var(--navy-950);
    }

    .block-pill {
      background: var(--navy-900);
      color: var(--gray-50);
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* ==========================================================================
       CARDS DE ESQUEMAS EXPLICATIVOS (TEXTUAIS + SVG)
       ========================================================================== */
    .schema-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-sm);
    }

    .schema-card.nested {
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      margin-top: 14px;
      margin-bottom: 8px;
      padding: 18px 20px;
    }

    .schema-head {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .schema-tag {
      background: var(--navy-950);
      color: var(--white);
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 3px 9px;
      border-radius: 4px;
    }

    .schema-tag.svg-tag {
      background: var(--navy-700);
    }

    .schema-tag.sub-tag {
      background: var(--gray-200);
      color: var(--navy-950);
    }

    .schema-title {
      font-family: var(--font-serif);
      font-size: 1.03rem;
      font-weight: 700;
      color: var(--navy-950);
    }

    .schema-caption {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
    }

    /* Container de SVG */
    .svg-frame {
      width: 100%;
      overflow-x: auto;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 10px;
    }

    .svg-frame svg {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* Camadas clicáveis no SVG do Corte Geral */
    .svg-layer-link {
      cursor: pointer;
      transition: opacity 0.18s ease;
    }

    .svg-layer-link:hover {
      opacity: 0.88;
    }

    .svg-layer-link:hover .layer-box {
      stroke: #0b1d36;
      stroke-width: 2.5;
    }

    /* Fluxograma Horizontal */
    .diag-flow {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .diag-node {
      flex: 1;
      background: var(--gray-50);
      border: 1px solid var(--border);
      border-top: 4px solid var(--navy-600);
      border-radius: var(--radius-md);
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .diag-node.tone-dark {
      background: var(--navy-950);
      border-color: var(--navy-950);
      border-top: 4px solid var(--navy-400);
      color: var(--white);
    }

    .diag-node.tone-dark h5 { color: var(--white); }
    .diag-node.tone-dark p, .diag-node.tone-dark li { color: var(--gray-100); }

    .diag-node.tone-mid {
      background: var(--gray-100);
      border-color: #b8c7da;
      border-top: 4px solid var(--navy-900);
    }

    .diag-node.tone-mid h5 { color: var(--navy-950); }

    .diag-node h5 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy-950);
      line-height: 1.3;
    }

    .diag-node p, .diag-node li {
      font-size: 0.8rem;
      color: var(--text-body);
      line-height: 1.46;
    }

    .diag-node ul {
      padding-left: 16px;
      margin-top: 2px;
    }

    .diag-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--navy-600);
      font-size: 1.25rem;
      font-weight: 800;
      padding: 0 2px;
      user-select: none;
    }

    /* Grade de Cartões */
    .diag-grid {
      display: grid;
      gap: 12px;
    }
    .diag-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .diag-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .diag-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }

    /* Tensão / Contraste Bipolar */
    .diag-tension {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      gap: 12px;
    }

    .tension-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--navy-900);
      color: var(--white);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      min-width: 112px;
      max-width: 155px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1.3;
    }

    .tension-mid .sym {
      font-size: 1.25rem;
      margin-bottom: 4px;
      color: var(--gray-200);
    }

    /* Tabela Comparativa */
    .diag-table-wrap {
      overflow-x: auto;
    }

    .diag-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .diag-table th {
      background: var(--navy-950);
      color: var(--white);
      text-align: left;
      padding: 10px 12px;
      font-weight: 700;
      border: 1px solid var(--navy-900);
    }

    .diag-table td {
      padding: 9px 12px;
      border: 1px solid var(--border);
      vertical-align: top;
      color: var(--text-body);
    }

    .diag-table tr:nth-child(even) td {
      background: var(--gray-50);
    }

    .diag-table td:first-child {
      font-weight: 700;
      color: var(--navy-950);
      background: var(--gray-100);
    }

    /* Camadas / Escada Vertical */
    .diag-ladder {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ladder-step {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      background: var(--gray-50);
      border: 1px solid var(--border);
      border-left: 5px solid var(--navy-600);
    }

    .ladder-step.tone-dark {
      background: var(--navy-950);
      border-color: var(--navy-950);
      border-left: 5px solid var(--navy-400);
      color: var(--white);
    }

    .ladder-step.tone-dark h5 { color: var(--white); }
    .ladder-step.tone-dark p { color: var(--gray-100); }

    .ladder-step.tone-mid {
      background: var(--gray-100);
      border-left: 5px solid var(--navy-900);
    }

    .ladder-num {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--navy-900);
      color: var(--white);
      font-size: 0.76rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ladder-step.tone-dark .ladder-num {
      background: var(--gray-100);
      color: var(--navy-950);
    }

    .ladder-step h5 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--navy-950);
      margin-bottom: 2px;
    }

    .ladder-step p {
      font-size: 0.79rem;
      color: var(--text-body);
      line-height: 1.44;
    }

    /* ==========================================================================
       CARDS DE SUBCAPÍTULOS
       ========================================================================== */
    .sub-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px 24px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      scroll-margin-top: 24px;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    .sub-card.flash-focus {
      border-color: var(--navy-700);
      box-shadow: 0 0 0 4px rgba(29, 63, 110, 0.22);
    }

    .sub-head {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .sub-code {
      background: var(--navy-900);
      color: var(--white);
      font-size: 0.73rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
    }

    .sub-title {
      font-family: var(--font-serif);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--navy-950);
    }

    .sub-orig {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-style: italic;
    }

    .sub-body {
      font-size: 0.92rem;
      color: var(--text-body);
      margin-bottom: 10px;
    }

    /* Cartões de Atalho na Visão Geral */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .overview-card-btn {
      text-align: left;
      background: var(--white);
      border: 1px solid var(--border);
      border-top: 4px solid var(--navy-700);
      border-radius: var(--radius-md);

    /* ==========================================================================
       MOTOR DE RENDERIZAÇÃO DOS ESQUEMAS E CONTEÚDO
       ========================================================================== */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function renderNode(item) {
      const toneClass = item.tone ? `tone-${item.tone}` : "";
      const bodyHtml = item.body ? `<p>${escapeHtml(item.body)}</p>` : "";
      const listHtml = item.bullets
        ? `<ul>${item.bullets.map(b => `<li>${escapeHtml(b)}</li>`).join("")}</ul>`
        : "";
      return `
        <div class="diag-node ${toneClass}">
          <h5>${escapeHtml(item.title)}</h5>
          ${bodyHtml}
          ${listHtml}
        </div>
      `;
    }

    function renderSchemaBody(schema) {
      if (schema.type === "svg") {
        return `<div class="svg-frame">${SVG_LIBRARY[schema.svgKey] || ""}</div>`;
      }

      if (schema.type === "flow") {
        return `
          <div class="diag-flow">
            ${schema.nodes.map((n, i) => `
              ${renderNode(n)}
              ${i < schema.nodes.length - 1 ? `<div class="diag-arrow">→</div>` : ""}
            `).join("")}
          </div>
        `;
      }

      if (schema.type === "grid") {
        const cols = schema.cols || 3;
        return `
          <div class="diag-grid cols-${cols}">
            ${schema.items.map(renderNode).join("")}
          </div>
        `;
      }

      if (schema.type === "tension") {
        return `
          <div class="diag-tension">
            ${renderNode(schema.left)}
            <div class="tension-mid">
              <span class="sym">${escapeHtml(schema.mid.sym)}</span>
              <div>${escapeHtml(schema.mid.text)}</div>
            </div>
            ${renderNode(schema.right)}
          </div>
        `;
      }

      if (schema.type === "compare") {
        return `
          <div class="diag-table-wrap">
            <table class="diag-table">
              <thead>
                <tr>${schema.headers.map(h => `<th>${escapeHtml(h)}</th>`).join("")}</tr>
              </thead>
              <tbody>
                ${schema.rows.map(row => `
                  <tr>${row.map(cell => `<td>${escapeHtml(cell)}</td>`).join("")}</tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        `;
      }

      if (schema.type === "ladder") {
        return `
          <div class="diag-ladder">
            ${schema.steps.map((s, idx) => `
              <div class="ladder-step ${s.tone || ""}">
                <div class="ladder-num">${idx + 1}</div>
                <div>
                  <h5>${escapeHtml(s.title)}</h5>
                  <p>${escapeHtml(s.body)}</p>
                </div>
              </div>
            `).join("")}
          </div>
        `;
      }

      return "";
    }

    function renderSchemaCard(schema, idx, isNested = false) {
      const isSvg = schema.type === "svg";
      const tagClass = isNested ? "sub-tag" : (isSvg ? "svg-tag" : "");
      const tagLabel = isNested
        ? "Esquema do Subcapítulo"
        : (isSvg ? `Esquema Visual (SVG)` : `Esquema Explicativo ${idx + 1}`);

      return `
        <div class="schema-card ${isNested ? "nested" : ""}">
          <div class="schema-head">
            <span class="schema-tag ${tagClass}">${tagLabel}</span>
            <h4 class="schema-title">${escapeHtml(schema.title)}</h4>
          </div>
          ${renderSchemaBody(schema)}
          ${schema.caption ? `<p class="schema-caption">${escapeHtml(schema.caption)}</p>` : ""}
        </div>
      `;
    }

    function renderOverviewCards() {
      const items = SECTIONS.filter(s => s.id !== "overview");
      return `
        <div class="block-head">

              <div class="ov-desc">${escapeHtml(sec.thesis.slice(0, 108))}...</div>
            </button>
          `).join("")}
        </div>
      `;
    }

        <div class="pager-nav">
          ${prevSec ? `<button class="pager-btn" data-goto-sec="${prevSec.id}">← Anterior: ${escapeHtml(prevSec.badge)} — ${escapeHtml(prevSec.title)}</button>` : "<span></span>"}
          ${nextSec ? `<button class="pager-btn next" data-goto-sec="${nextSec.id}">Próximo: ${escapeHtml(nextSec.badge)} — ${escapeHtml(nextSec.title)} →</button>` : `<button class="pager-btn next" data-goto-sec="overview">Voltar ao Corte Vertical ↺</button>`}
        </div>
      `;

      // Liga eventos de botões internos e camadas clicáveis do SVG
      stageRoot.querySelectorAll("[data-goto-sec]").forEach(btn => {
        btn.addEventListener("click", () => renderSection(btn.dataset.gotoSec));
      });

      stageRoot.querySelectorAll("[data-svg-goto]").forEach(el => {
        el.addEventListener("click", () => renderSection(el.dataset.svgGoto));
      });

      stageRoot.querySelectorAll("[data-jump-sub]").forEach(btn => {
        btn.addEventListener("click", () => scrollToSub(btn.dataset.jumpSub));
      });

      closeMobileMenu();

      if (subId) {
        setTimeout(() => scrollToSub(subId), 45);
      } else {
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function scrollToSub(subId) {
      const el = document.getElementById(subId);
      if (!el) return;

      sidebarNavRoot.querySelectorAll(".nav-sub-btn").forEach(btn => {
        btn.classList.toggle("active-sub", btn.dataset.openSub === subId);
      });

      el.scrollIntoView({ behavior: "smooth", block: "start" });
      el.classList.remove("flash-focus");
      void el.offsetWidth;
      el.classList.add("flash-focus");
      setTimeout(() => el.classList.remove("flash-focus"), 1700);
    }

    // Inicializa a interface
    buildSidebar();
    renderSection("overview");
  </script>
</body>
</html>
